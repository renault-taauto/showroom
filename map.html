<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>르노코리아 티에이오토 공식 대리점</title>

  <script
    type="text/javascript"
    src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0&apiKey=0AF8F2A3-2F71-3FEC-9310-ADB256604DDE"
  ></script>

  <style>
    :root {
      --ink: #15171a;
      --muted: #666;
      --pin: #ffcf00;
      --panel: rgba(255, 255, 255, 0.97);
      --shadow: 0 16px 45px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    .map-app {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: transparent;
      overflow: hidden;
    }

    .map-title {
      position: absolute;
      left: 50%;
      top: 24px;
      z-index: 20;
      width: min(920px, calc(100% - 32px));
      margin: 0;
      color: #15171a;
      font-size: clamp(26px, 4vw, 46px);
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 0;
      text-align: center;
      transform: translateX(-50%);
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(255, 255, 255, 0.95);
    }

    #vmap {
      width: 100%;
      height: 100vh;
      min-height: 560px;
      background: transparent;
    }

    .dealer-marker {
      position: relative;
      width: 28px;
      height: 28px;
      pointer-events: auto;
    }

    .dealer-pin {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 24px;
      height: 24px;
      border: 2px solid var(--ink);
      border-radius: 50% 50% 50% 0;
      background: var(--pin);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transform: translateX(-50%) rotate(-45deg);
    }

    .dealer-pin::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
      transform: translate(-50%, -50%);
    }

    .dealer-pin:hover,
    .dealer-pin.active {
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
    }

    .dealer-name {
      position: absolute;
      left: 50%;
      bottom: 32px;
      z-index: 10;
      padding: 7px 10px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 0.12s ease;
    }

    .dealer-marker:hover .dealer-name {
      opacity: 1;
    }

    .dealer-popup {
      width: min(360px, calc(100vw - 32px));
      padding: 20px;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      user-select: text;
    }

    .dealer-popup[hidden] {
      display: none;
    }

    .dealer-popup h1 {
      margin: 0 0 14px;
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .info {
      display: grid;
      gap: 8px;
      margin: 0 0 15px;
      font-size: 14px;
      line-height: 1.55;
    }

    .info div {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 8px;
    }

    .info dt {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      color: var(--ink);
    }

    .description {
      margin: 0 0 17px;
      padding-top: 15px;
      border-top: 1px solid rgba(0, 0, 0, 0.14);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .actions a,
    .actions span {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #15171a;
      border-radius: 6px;
      background: #fff;
      color: #15171a;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .actions a:hover {
      background: #15171a;
      color: #fff;
    }

    .actions span.disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .status {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 50;
      width: min(360px, calc(100vw - 32px));
      padding: 14px 16px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
      transform: translateX(-50%);
    }

    .status:empty {
      display: none;
    }

    @media (max-width: 720px) {
      .map-title {
        top: 18px;
        width: calc(100% - 24px);
        font-size: 26px;
      }

      #vmap {
        height: 100vh;
        min-height: 620px;
      }

      .dealer-popup {
        position: fixed !important;
        left: 50% !important;
        top: 50% !important;
        width: calc(100vw - 28px);
        max-height: 62vh;
        overflow: auto;
        transform: translate(-50%, -50%) !important;
      }

      .dealer-popup h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="map-app">
    <h1 class="map-title">르노코리아 티에이오토 공식 대리점</h1>

    <div id="vmap"></div>

    <article class="dealer-popup" id="popup" hidden>
      <h1 id="popupName"></h1>

      <dl class="info">
        <div>
          <dt>주소</dt>
          <dd id="popupAddress"></dd>
        </div>
        <div>
          <dt>전화번호</dt>
          <dd id="popupPhone"></dd>
        </div>
        <div>
          <dt>오시는 길</dt>
          <dd id="popupDirections"></dd>
        </div>
      </dl>

      <p class="description" id="popupDescription"></p>
      <div class="actions" id="popupActions"></div>
    </article>

    <div class="status" id="status"></div>
  </main>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwKxHf3rmSjGrfFRpp-VVH1hJs3M7gK0NPFS1UX-Xgyl1ULHU4bhiT6nLM8YbwuD_hrHw/exec";

    const status = document.querySelector("#status");
    const popup = document.querySelector("#popup");
    const popupName = document.querySelector("#popupName");
    const popupAddress = document.querySelector("#popupAddress");
    const popupPhone = document.querySelector("#popupPhone");
    const popupDirections = document.querySelector("#popupDirections");
    const popupDescription = document.querySelector("#popupDescription");
    const popupActions = document.querySelector("#popupActions");

    let vmap = null;
    let popupOverlay = null;
    let activePin = null;

    window.addEventListener("load", init);

    function init() {
      if (!window.vw || !window.ol) {
        status.textContent = "VWorld 지도를 불러오지 못했습니다. 인증키와 도메인 설정을 확인해주세요.";
        return;
      }

      createMap();

      loadDealers()
        .then((dealers) => {
          if (!dealers.length) {
            status.textContent = "표시할 대리점 정보가 없습니다.";
            return;
          }

          status.textContent = "";
          renderMarkers(dealers);
        })
        .catch((error) => {
          status.textContent = "대리점 정보를 불러오지 못했습니다. Apps Script 배포 URL과 접근 권한을 확인해주세요.";
          console.error(error);
        });
    }

    function createMap() {
      vw.ol3.MapOptions = {
        basemapType: vw.ol3.BasemapType.GRAPHIC,
        controlDensity: vw.ol3.DensityType.EMPTY,
        interactionDensity: vw.ol3.DensityType.BASIC,
        controlsAutoArrange: true,
        homePosition: vw.ol3.CameraPosition,
        initPosition: vw.ol3.CameraPosition
      };

      vmap = new vw.ol3.Map("vmap", vw.ol3.MapOptions);

      const view = vmap.getView();

      if (isMobile()) {
        view.setCenter(ol.proj.fromLonLat([127.15, 37.45]));
        view.setZoom(9);
      } else {
        view.setCenter(ol.proj.fromLonLat([127.35, 37.55]));
        view.setZoom(9);
      }

      popupOverlay = new ol.Overlay({
        element: popup,
        positioning: "center-left",
        offset: [16, 0],
        stopEvent: true
      });

      vmap.addOverlay(popupOverlay);

      vmap.on("singleclick", function(event) {
        const target = event.originalEvent && event.originalEvent.target;

        if (target && target.closest && target.closest(".dealer-marker")) {
          return;
        }

        closePopup();
      });
    }

    async function loadDealers() {
      try {
        const response = await fetch(SHEET_API_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const payload = await response.json();
        return normalizePayload(payload);
      } catch (error) {
        const payload = await loadJsonp(SHEET_API_URL);
        return normalizePayload(payload);
      }
    }

    function loadJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = `dealerMap_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const src = new URL(url);

        src.searchParams.set("callback", callbackName);

        window[callbackName] = (payload) => {
          delete window[callbackName];
          script.remove();
          resolve(payload);
        };

        script.onerror = () => {
          delete window[callbackName];
          script.remove();
          reject(new Error("JSONP load failed"));
        };

        script.src = src.toString();
        document.head.appendChild(script);
      });
    }

    function normalizePayload(payload) {
      const rows = Array.isArray(payload) ? payload : payload.dealers;
      if (!Array.isArray(rows)) return [];

      return rows
        .map((dealer, index) => ({
          id: dealer.id || `dealer-${index + 1}`,
          category: clean(dealer.category),
          region: clean(dealer.region || dealer.category),
          name: clean(dealer.name),
          address: clean(dealer.address),
          phone: clean(dealer.phone),
          directions: clean(dealer.directions),
          description: clean(dealer.description),
          testDriveUrl: clean(dealer.testDriveUrl),
          eventUrl: clean(dealer.eventUrl),
          lat: Number(dealer.lat),
          lng: Number(dealer.lng)
        }))
        .filter((dealer) => dealer.name && Number.isFinite(dealer.lat) && Number.isFinite(dealer.lng));
    }

    function renderMarkers(dealers) {
      dealers.forEach((dealer) => {
        const coordinate = ol.proj.fromLonLat([dealer.lng, dealer.lat]);
        const marker = createMarkerElement(dealer);

        const overlay = new ol.Overlay({
          element: marker,
          positioning: "bottom-center",
          position: coordinate,
          stopEvent: true
        });

        marker.querySelector(".dealer-pin").addEventListener("click", (event) => {
          event.stopPropagation();
          showDealer(dealer, coordinate, marker.querySelector(".dealer-pin"));
        });

        vmap.addOverlay(overlay);
      });
    }

    function createMarkerElement(dealer) {
      const marker = document.createElement("div");
      marker.className = "dealer-marker";

      const pin = document.createElement("button");
      pin.type = "button";
      pin.className = "dealer-pin";
      pin.setAttribute("aria-label", `${dealer.name} 상세보기`);

      const label = document.createElement("div");
      label.className = "dealer-name";
      label.textContent = dealer.name;

      marker.append(pin, label);

      return marker;
    }

    function showDealer(dealer, coordinate, pin) {
      if (activePin) activePin.classList.remove("active");

      activePin = pin;
      activePin.classList.add("active");

      popupName.textContent = dealer.name;
      popupAddress.textContent = dealer.address || "-";
      popupPhone.textContent = dealer.phone || "-";
      popupDirections.textContent = dealer.directions || "-";
      popupDescription.textContent = dealer.description || "";

      popupActions.innerHTML = "";

      if (dealer.testDriveUrl) {
        popupActions.append(createLink("시승 신청하기", dealer.testDriveUrl));
      } else {
        popupActions.append(createDisabledButton("시승 신청하기"));
      }

      if (dealer.eventUrl) {
        popupActions.append(createLink("진행중인 이벤트", dealer.eventUrl));
      }

      popup.hidden = false;
      popupOverlay.setPosition(coordinate);

      if (isMobile()) {
        vmap.getView().animate({
          center: coordinate,
          duration: 250
        });
      }
    }

    function closePopup() {
      popup.hidden = true;
      popupOverlay.setPosition(undefined);

      if (activePin) {
        activePin.classList.remove("active");
        activePin = null;
      }
    }

    function createLink(text, href) {
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = text;
      return link;
    }

    function createDisabledButton(text) {
      const button = document.createElement("span");
      button.className = "disabled";
      button.textContent = text;
      return button;
    }

    function isMobile() {
      return window.matchMedia("(max-width: 720px)").matches;
    }

    function clean(value) {
      return String(value || "").trim();
    }
  </script>
</body>
</html>
