<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>르노코리아 티에이오토 공식 대리점</title>

  <script
    type="text/javascript"
    src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0&apiKey=0AF8F2A3-2F71-3FEC-9310-ADB256604DDE"
    defer
  ></script>

  <style>
    :root {
      --ink: #15171a;
      --muted: #666;
      --line: rgba(0, 0, 0, 0.12);
      --pin: #ffcf00;
      --panel: #fff;
      --shadow: 0 16px 45px rgba(0, 0, 0, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    button, a { font: inherit; }

    /* ── Layout ── */
    .map-app {
      min-height: 100vh;
      padding: 34px 20px;
      background: #fff;
    }

    .map-title {
      width: min(1240px, 100%);
      margin: 0 auto 24px;
      color: var(--ink);
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      line-height: 1.18;
      text-align: center;
    }

    .locator-layout {
      position: relative;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      width: min(1240px, 100%);
      margin: 0 auto;
      align-items: stretch;
    }

    /* ── Dealer List ── */
    .dealer-list {
      height: min(680px, calc(100vh - 150px));
      min-height: 560px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    .list-inner {
      padding: 16px;
    }

    /* ── Accordion Group ── */
    .list-group {
      border: 1px solid var(--line);
      margin-bottom: 8px;
    }

    .list-group:last-child { margin-bottom: 0; }

    .group-toggle {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border: none;
      background: #f5f5f5;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      text-align: left;
      user-select: none;
      transition: background 0.15s;
    }

    .group-toggle:hover { background: #ebebeb; }

    .group-toggle .arrow {
      font-size: 11px;
      transition: transform 0.22s ease;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .group-toggle.open .arrow {
      transform: rotate(180deg);
    }

    .group-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.28s ease;
    }

    .group-body.open {
      max-height: 2000px;
    }

    /* ── Dealer Item ── */
    .dealer-item {
      display: block;
      width: 100%;
      margin: 0;
      padding: 11px 14px;
      border: none;
      border-top: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: background 0.1s;
    }

    .dealer-item:hover,
    .dealer-item.active {
      background: #fafafa;
      outline: 2px solid var(--ink);
      outline-offset: -2px;
    }

    .dealer-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      line-height: 1.35;
    }

    .dealer-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    /* ── Map Shell ── */
    .map-shell {
      position: relative;
      min-width: 0;
      background: #fff;
    }

    .map-viewport {
      position: relative;
      width: 100%;
      height: min(680px, calc(100vh - 150px));
      min-height: 560px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #eee;
    }

    #vmap {
      width: 100%;
      height: 100%;
    }

    /* ── Marker ── */
    .dealer-marker {
      position: relative;
      width: 30px;
      height: 30px;
      pointer-events: auto;
    }

    .dealer-pin {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 25px;
      height: 25px;
      border: 2px solid var(--ink);
      border-radius: 50% 50% 50% 0;
      background: var(--pin);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transform: translateX(-50%) rotate(-45deg);
      transition: box-shadow 0.12s;
    }

    .dealer-pin::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
      transform: translate(-50%, -50%);
    }

    .dealer-pin:hover,
    .dealer-pin.active {
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
    }

    .dealer-name {
      position: absolute;
      left: 50%;
      bottom: 34px;
      z-index: 10;
      padding: 7px 10px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 0.12s ease;
    }

    .dealer-marker:hover .dealer-name { opacity: 1; }

    /* ── Popup ── */
    .dealer-popup {
      position: absolute;
      z-index: 100;
      width: min(380px, calc(100vw - 32px));
      border: 1px solid rgba(0, 0, 0, 0.14);
      background: var(--panel);
      box-shadow: var(--shadow);
      user-select: text;
      overflow: hidden;
    }

    .dealer-popup[hidden] { display: none; }

    /* Photo — 16:9, cropped to popup width */
    .popup-photo {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #ddd;
    }

    .popup-photo.visible { display: block; }

    .popup-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .popup-body { padding: 20px; }

    .dealer-popup h1 {
      margin: 0 0 14px;
      font-size: 22px;
      line-height: 1.25;
    }

    .info {
      display: grid;
      gap: 8px;
      margin: 0 0 15px;
      font-size: 14px;
      line-height: 1.55;
    }

    .info div {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 8px;
    }

    .info dt {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .info dd { margin: 0; color: var(--ink); }

    .description {
      margin: 0 0 17px;
      padding-top: 15px;
      border-top: 1px solid rgba(0, 0, 0, 0.14);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .description:empty { display: none; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .actions a,
    .actions span {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .actions a:hover {
      background: var(--ink);
      color: #fff;
    }

    .actions span.disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    /* ── Skeleton ── */
    .skeleton-list { padding: 16px; }

    .skeleton-group { margin-bottom: 10px; }

    .skeleton-header {
      height: 38px;
      margin-bottom: 6px;
      border-radius: 2px;
      animation: shimmer 1.2s infinite linear;
      background: linear-gradient(90deg, #eee 25%, #e0e0e0 50%, #eee 75%);
      background-size: 200% 100%;
    }

    .skeleton-item {
      height: 56px;
      margin-bottom: 4px;
      border-radius: 2px;
      animation: shimmer 1.2s infinite linear;
      background: linear-gradient(90deg, #f5f5f5 25%, #eee 50%, #f5f5f5 75%);
      background-size: 200% 100%;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Status ── */
    .status {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 120;
      width: min(360px, calc(100vw - 32px));
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
      transform: translateX(-50%);
    }

    .status:empty { display: none; }

    /* ── Mobile ── */
    @media (max-width: 820px) {
      .map-app { padding: 24px 12px; }

      .map-title { margin-bottom: 18px; font-size: 26px; }

      .locator-layout {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .dealer-list {
        height: auto;
        min-height: 0;
        max-height: 220px;
      }

      .list-inner { padding: 12px; }

      .map-viewport {
        height: calc(100vh - 360px);
        min-height: 520px;
      }

      .dealer-popup {
        position: fixed;
        left: 50% !important;
        top: 50% !important;
        width: calc(100vw - 28px);
        max-height: 80vh;
        overflow: auto;
        transform: translate(-50%, -50%);
      }

      .dealer-popup h1 { font-size: 19px; }
    }
  </style>
</head>

<body>
  <main class="map-app">
    <h1 class="map-title">르노코리아 티에이오토 공식 대리점</h1>

    <section class="locator-layout">
      <aside class="dealer-list" aria-label="대리점 목록">
        <div class="list-inner" id="dealerList">
          <!-- skeleton -->
          <div class="skeleton-list" id="skeletonList">
            <div class="skeleton-group">
              <div class="skeleton-header"></div>
              <div class="skeleton-item"></div>
              <div class="skeleton-item"></div>
              <div class="skeleton-item"></div>
            </div>
            <div class="skeleton-group">
              <div class="skeleton-header"></div>
              <div class="skeleton-item"></div>
              <div class="skeleton-item"></div>
            </div>
            <div class="skeleton-group">
              <div class="skeleton-header"></div>
              <div class="skeleton-item"></div>
            </div>
          </div>
        </div>
      </aside>

      <section class="map-shell">
        <div class="map-viewport" id="mapViewport">
          <div id="vmap"></div>
        </div>

        <article class="dealer-popup" id="popup" hidden>
          <div class="popup-photo" id="popupPhoto">
            <img id="popupImage" alt="" loading="lazy" />
          </div>

          <div class="popup-body">
            <h1 id="popupName"></h1>

            <dl class="info">
              <div>
                <dt>주소</dt>
                <dd id="popupAddress"></dd>
              </div>
              <div>
                <dt>전화번호</dt>
                <dd id="popupPhone"></dd>
              </div>
              <div>
                <dt>오시는 길</dt>
                <dd id="popupDirections"></dd>
              </div>
            </dl>

            <p class="description" id="popupDescription"></p>
            <div class="actions" id="popupActions"></div>
          </div>
        </article>

        <div class="status" id="status"></div>
      </section>
    </section>
  </main>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxal4nT-aee_i_hp7_g28G5lwZt0tHjNfCTvDnggOzao_ib00jN9pa_PslWyYNUjtZyFA/exec";
    const groupOrder = ["서울 대리점", "경기 대리점", "인천 대리점", "강원 대리점"];

    const dealerList      = document.getElementById("dealerList");
    const skeletonList    = document.getElementById("skeletonList");
    const mapShell        = document.querySelector(".map-shell");
    const mapViewport     = document.getElementById("mapViewport");
    const status          = document.getElementById("status");
    const popup           = document.getElementById("popup");
    const popupPhoto      = document.getElementById("popupPhoto");
    const popupImage      = document.getElementById("popupImage");
    const popupName       = document.getElementById("popupName");
    const popupAddress    = document.getElementById("popupAddress");
    const popupPhone      = document.getElementById("popupPhone");
    const popupDirections = document.getElementById("popupDirections");
    const popupDescription = document.getElementById("popupDescription");
    const popupActions    = document.getElementById("popupActions");

    let vmap = null;
    let activePin = null;
    let activeCoordinate = null;
    let activeListItem = null;
    const markerById = new Map();
    const dealerById = new Map();

    /* ── Init ── */
    function waitForVworld(timeout = 8000) {
      return new Promise((resolve, reject) => {
        if (window.vw && window.ol) { resolve(); return; }
        const start = Date.now();
        const check = () => {
          if (window.vw && window.ol) { resolve(); return; }
          if (Date.now() - start > timeout) { reject(new Error("VWorld timeout")); return; }
          setTimeout(check, 100);
        };
        setTimeout(check, 100);
      });
    }

    async function init() {
      // 지도 초기화와 데이터 로드를 병렬 실행
      const [, dealers] = await Promise.all([
        waitForVworld().then(createMap).catch((e) => {
          status.textContent = "VWorld 지도를 불러오지 못했습니다. 인증키와 도메인 설정을 확인해주세요.";
          throw e;
        }),
        loadDealers().catch((e) => {
          status.textContent = "대리점 정보를 불러오지 못했습니다. Apps Script 배포 URL과 접근 권한을 확인해주세요.";
          console.error(e);
          return [];
        })
      ]).catch(() => [null, []]);

      skeletonList.remove();

      if (!dealers || !dealers.length) {
        status.textContent = status.textContent || "표시할 대리점 정보가 없습니다.";
        return;
      }

      status.textContent = "";
      renderList(dealers);
      renderMarkers(dealers);
    }

    window.addEventListener("DOMContentLoaded", init);
    window.addEventListener("resize", () => {
      if (activeCoordinate) positionPopup(activeCoordinate);
    });

    /* ── Map ── */
    function createMap() {
      vw.ol3.MapOptions = {
        basemapType: vw.ol3.BasemapType.GRAPHIC,
        controlDensity: vw.ol3.DensityType.EMPTY,
        interactionDensity: vw.ol3.DensityType.BASIC,
        controlsAutoArrange: true,
        homePosition: vw.ol3.CameraPosition,
        initPosition: vw.ol3.CameraPosition
      };

      vmap = new vw.ol3.Map("vmap", vw.ol3.MapOptions);
      const view = vmap.getView();

      if (isMobile()) {
        view.setCenter(ol.proj.fromLonLat([127.15, 37.55]));
        view.setZoom(10);
      } else {
        view.setCenter(ol.proj.fromLonLat([127.42, 37.6]));
        view.setZoom(10);
      }

      vmap.on("singleclick", (event) => {
        const target = event.originalEvent && event.originalEvent.target;
        if (target && target.closest && target.closest(".dealer-marker")) return;
        closePopup();
      });

      vmap.on("moveend", () => {
        if (activeCoordinate) positionPopup(activeCoordinate);
      });
    }

    /* ── Data ── */
    async function loadDealers() {
      const payload = await loadJsonp(SHEET_API_URL);
      return normalizePayload(payload);
    }

    function loadJsonp(url) {
      return new Promise((resolve, reject) => {
        const cbName = `dealerMap_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const src = new URL(url);
        src.searchParams.set("callback", cbName);

        const timer = setTimeout(() => {
          delete window[cbName];
          script.remove();
          reject(new Error("JSONP timeout"));
        }, 15000);

        window[cbName] = (payload) => {
          clearTimeout(timer);
          delete window[cbName];
          script.remove();
          resolve(payload);
        };

        script.onerror = () => {
          clearTimeout(timer);
          delete window[cbName];
          script.remove();
          reject(new Error("JSONP load failed"));
        };

        script.src = src.toString();
        document.head.appendChild(script);
      });
    }

    function normalizePayload(payload) {
      const rows = Array.isArray(payload) ? payload : payload.dealers;
      if (!Array.isArray(rows)) return [];

      return rows
        .map((d, i) => ({
          id: d.id || `dealer-${i + 1}`,
          category: clean(d.category),
          region: clean(d.region || d.category),
          name: clean(d.name),
          address: clean(d.address),
          phone: clean(d.phone),
          directions: clean(d.directions),
          description: clean(d.description),
          testDriveUrl: clean(d.testDriveUrl),
          eventUrl: clean(d.eventUrl),
          imageUrl: normalizeImageUrl(clean(d.imageUrl || d.photoUrl || d.image || "")),
          lat: Number(d.lat),
          lng: Number(d.lng)
        }))
        .filter((d) => d.name && Number.isFinite(d.lat) && Number.isFinite(d.lng));
    }

    /* ── List (Accordion) ── */
    function renderList(dealers) {
      dealerList.innerHTML = "";

      const grouped = new Map();
      dealers.forEach((dealer) => {
        const key = dealer.category || dealer.region || "기타";
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(dealer);
      });

      const orderedGroups = [
        ...groupOrder.filter((g) => grouped.has(g)),
        ...[...grouped.keys()].filter((g) => !groupOrder.includes(g))
      ];

      orderedGroups.forEach((group, gIdx) => {
        const section = document.createElement("section");
        section.className = "list-group";

        // Toggle button
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "group-toggle" + (gIdx === 0 ? " open" : "");
        toggle.innerHTML = `<span>${escapeHtml(group)}</span><span class="arrow">▼</span>`;

        // Body
        const body = document.createElement("div");
        body.className = "group-body" + (gIdx === 0 ? " open" : "");

        toggle.addEventListener("click", () => {
          const isOpen = body.classList.contains("open");
          body.classList.toggle("open", !isOpen);
          toggle.classList.toggle("open", !isOpen);
        });

        grouped.get(group).forEach((dealer) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "dealer-item";
          item.dataset.dealerId = dealer.id;
          item.innerHTML = `
            <strong>${escapeHtml(dealer.name)}</strong>
            <span>${escapeHtml(dealer.address)}</span>
          `;
          item.addEventListener("click", () => focusDealer(dealer.id));
          body.append(item);
        });

        section.append(toggle, body);
        dealerList.append(section);
      });
    }

    /* ── Markers ── */
    function renderMarkers(dealers) {
      dealers.forEach((dealer) => {
        const coordinate = ol.proj.fromLonLat([dealer.lng, dealer.lat]);
        const marker = createMarkerElement(dealer);

        dealerById.set(dealer.id, { dealer, coordinate });
        markerById.set(dealer.id, marker);

        const overlay = new ol.Overlay({
          element: marker,
          positioning: "bottom-center",
          position: coordinate,
          stopEvent: true
        });

        marker.querySelector(".dealer-pin").addEventListener("click", (event) => {
          event.stopPropagation();
          showDealer(dealer, coordinate, marker.querySelector(".dealer-pin"));
        });

        vmap.addOverlay(overlay);
      });
    }

    function createMarkerElement(dealer) {
      const marker = document.createElement("div");
      marker.className = "dealer-marker";

      const pin = document.createElement("button");
      pin.type = "button";
      pin.className = "dealer-pin";
      pin.setAttribute("aria-label", `${dealer.name} 상세보기`);

      const label = document.createElement("div");
      label.className = "dealer-name";
      label.textContent = dealer.name;

      marker.append(pin, label);
      return marker;
    }

    /* ── Focus: list → pin (지도 이동 + 팝업) ── */
    function focusDealer(id) {
      const entry = dealerById.get(id);
      const marker = markerById.get(id);
      if (!entry || !marker) return;

      const view = vmap.getView();
      const targetZoom = Math.max(view.getZoom(), isMobile() ? 13 : 14);

      // 지도가 이동 완료된 뒤 팝업 위치 재계산
      view.animate({ center: entry.coordinate, zoom: targetZoom, duration: 320 }, () => {
        showDealer(entry.dealer, entry.coordinate, marker.querySelector(".dealer-pin"));
      });
    }

    /* ── Show Popup ── */
    function showDealer(dealer, coordinate, pin) {
      if (activePin) activePin.classList.remove("active");
      if (activeListItem) activeListItem.classList.remove("active");

      activePin = pin;
      activeCoordinate = coordinate;
      activePin.classList.add("active");

      activeListItem = dealerList.querySelector(`[data-dealer-id="${CSS.escape(dealer.id)}"]`);
      if (activeListItem) {
        // 해당 그룹 아코디언이 닫혀 있으면 열기
        const groupBody = activeListItem.closest(".group-body");
        if (groupBody && !groupBody.classList.contains("open")) {
          groupBody.classList.add("open");
          groupBody.previousElementSibling.classList.add("open");
        }
        activeListItem.classList.add("active");
        activeListItem.scrollIntoView({ block: "nearest" });
      }

      popupName.textContent = dealer.name;
      popupAddress.textContent = dealer.address || "-";
      popupPhone.textContent = dealer.phone || "-";
      popupDirections.textContent = dealer.directions || "-";
      popupDescription.textContent = dealer.description || "";

      if (dealer.imageUrl) {
        popupImage.src = dealer.imageUrl;
        popupImage.alt = `${dealer.name} 사진`;
        popupPhoto.classList.add("visible");
      } else {
        popupPhoto.classList.remove("visible");
        popupImage.removeAttribute("src");
        popupImage.alt = "";
      }

      popupActions.innerHTML = "";
      if (dealer.testDriveUrl) {
        popupActions.append(createLink("시승 신청하기", dealer.testDriveUrl));
      } else {
        popupActions.append(createDisabledButton("시승 신청하기"));
      }
      if (dealer.eventUrl) {
        popupActions.append(createLink("진행중인 이벤트", dealer.eventUrl));
      }

      popup.hidden = false;
      positionPopup(coordinate);
    }

    /* ── Popup position ── */
    function positionPopup(coordinate) {
      if (popup.hidden || !vmap) return;
      if (isMobile()) return;

      const pixel = vmap.getPixelFromCoordinate(coordinate);
      const shellRect = mapShell.getBoundingClientRect();
      const viewportRect = mapViewport.getBoundingClientRect();

      popup.style.left = "0px";
      popup.style.top  = "0px";

      const popupRect = popup.getBoundingClientRect();
      const gap    = 16;
      const margin = 12;

      let x = viewportRect.left - shellRect.left + pixel[0] + gap;
      let y = viewportRect.top  - shellRect.top  + pixel[1] - popupRect.height / 2;

      const maxX = shellRect.width  - popupRect.width  - margin;
      const maxY = Math.max(margin, viewportRect.height - popupRect.height - margin);

      if (x > maxX) {
        x = viewportRect.left - shellRect.left + pixel[0] - popupRect.width - gap;
      }

      popup.style.left = `${clamp(x, margin, maxX)}px`;
      popup.style.top  = `${clamp(y, margin, maxY)}px`;
    }

    function closePopup() {
      popup.hidden = true;
      activeCoordinate = null;
      if (activePin)      { activePin.classList.remove("active");      activePin = null; }
      if (activeListItem) { activeListItem.classList.remove("active"); activeListItem = null; }
    }

    /* ── Helpers ── */
    function createLink(text, href) {
      const a = document.createElement("a");
      a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = text;
      return a;
    }

    function createDisabledButton(text) {
      const s = document.createElement("span");
      s.className = "disabled"; s.textContent = text;
      return s;
    }

    function normalizeImageUrl(url) {
      if (!url) return "";
      const m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
      return url;
    }

    function isMobile() { return window.matchMedia("(max-width: 820px)").matches; }
    function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
    function clean(v) { return String(v || "").trim(); }

    function escapeHtml(v) {
      return String(v).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]
      );
    }
  </script>
</body>
</html>
