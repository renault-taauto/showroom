<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>르노 대리점 지도</title>
  <style>
    :root {
      --ink: #15171a;
      --muted: #666;
      --pin: #ffcf00;
      --panel: rgba(255, 255, 255, 0.97);
      --shadow: 0 16px 45px rgba(0, 0, 0, 0.2);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      color: var(--ink);
      font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    button,
    a { font: inherit; }

    .map-app {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      overflow: hidden;
      background: transparent;
      padding: 22px;
    }

    .map-stage {
      position: relative;
      width: min(920px, 96vw);
      aspect-ratio: 1030 / 590;
      overflow: hidden;
      background: transparent;
      touch-action: none;
      user-select: none;
    }

    .map-content {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.12));
      pointer-events: none;
    }

    .zoom-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 40;
      display: flex;
      gap: 6px;
    }

    .zoom-controls button {
      width: 38px;
      height: 38px;
      border: 1px solid #15171a;
      border-radius: 6px;
      background: #fff;
      color: #15171a;
      cursor: pointer;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }

    .zoom-controls button:hover {
      background: #15171a;
      color: #fff;
    }

    .pin {
      position: absolute;
      z-index: 5;
      width: 24px;
      height: 24px;
      border: 2px solid var(--ink);
      border-radius: 50% 50% 50% 0;
      background: var(--pin);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transform: translate(-50%, -100%) rotate(-45deg);
      transition: scale 0.14s ease, box-shadow 0.14s ease;
    }

    .pin::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
      transform: translate(-50%, -50%);
    }

    .pin:hover,
    .pin.active {
      z-index: 8;
      scale: 1.18;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
    }

    .pin-name {
      position: absolute;
      z-index: 9;
      padding: 7px 10px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -12px);
      transition: opacity 0.12s ease;
    }

    .pin:hover + .pin-name { opacity: 1; }

    .popup {
      position: absolute;
      z-index: 20;
      width: min(360px, calc(100vw - 32px));
      padding: 20px;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      transform: translate(16px, -50%);
      user-select: text;
    }

    .popup.left {
      transform: translate(calc(-100% - 16px), -50%);
    }

    .popup[hidden] { display: none; }

    .popup h1 {
      margin: 0 0 14px;
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .info {
      display: grid;
      gap: 8px;
      margin: 0 0 15px;
      font-size: 14px;
      line-height: 1.55;
    }

    .info div {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 8px;
    }

    .info dt {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      color: var(--ink);
    }

    .description {
      margin: 0 0 17px;
      padding-top: 15px;
      border-top: 1px solid rgba(0, 0, 0, 0.14);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .actions a,
    .actions span {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid #15171a;
      border-radius: 6px;
      background: #fff;
      color: #15171a;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .actions a:hover {
      background: #15171a;
      color: #fff;
    }

    .actions span.disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .status {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 30;
      width: min(360px, calc(100vw - 32px));
      padding: 16px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .status:empty { display: none; }

    @media (max-width: 720px) {
      .map-app { padding: 10px; }
      .map-stage { width: 100%; }

      .popup,
      .popup.left {
        position: fixed;
        left: 12px !important;
        right: 12px;
        bottom: 12px;
        top: auto !important;
        width: auto;
        max-height: 48vh;
        overflow: auto;
        transform: none;
      }

      .popup h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="map-app">
    <section class="map-stage" id="mapStage" aria-label="르노 대리점 지도">
      <div class="map-content" id="mapContent">
        <svg class="map-svg" viewBox="300 0 1030 590" role="img" aria-label="대한민국 북부 지도">
          <image
            href="https://upload.wikimedia.org/wikipedia/commons/b/b2/South_Korea_location_map.svg"
            x="0"
            y="0"
            width="1771.627"
            height="1672.414"
            preserveAspectRatio="none"
          ></image>
        </svg>

        <article class="popup" id="popup" hidden>
          <h1 id="popupName"></h1>
          <dl class="info">
            <div>
              <dt>주소</dt>
              <dd id="popupAddress"></dd>
            </div>
            <div>
              <dt>전화번호</dt>
              <dd id="popupPhone"></dd>
            </div>
            <div>
              <dt>오시는 길</dt>
              <dd id="popupDirections"></dd>
            </div>
          </dl>
          <p class="description" id="popupDescription"></p>
          <div class="actions" id="popupActions"></div>
        </article>
      </div>

      <div class="zoom-controls" aria-label="지도 확대 축소">
        <button type="button" id="zoomIn" aria-label="확대">+</button>
        <button type="button" id="zoomOut" aria-label="축소">-</button>
        <button type="button" id="zoomReset" aria-label="초기화">↺</button>
      </div>

      <div class="status" id="status">대리점 정보를 불러오는 중입니다.</div>
    </section>
  </main>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwKxHf3rmSjGrfFRpp-VVH1hJs3M7gK0NPFS1UX-Xgyl1ULHU4bhiT6nLM8YbwuD_hrHw/exec";

    const mapInfo = {
      imageWidth: 1771.627,
      imageHeight: 1672.414,
      cropX: 300,
      cropY: 0,
      cropWidth: 1030,
      cropHeight: 590,
      minLat: 33.0,
      maxLat: 38.9,
      minLng: 124.5,
      maxLng: 132.0
    };

    const stage = document.querySelector("#mapStage");
    const content = document.querySelector("#mapContent");
    const status = document.querySelector("#status");
    const popup = document.querySelector("#popup");
    const popupName = document.querySelector("#popupName");
    const popupAddress = document.querySelector("#popupAddress");
    const popupPhone = document.querySelector("#popupPhone");
    const popupDirections = document.querySelector("#popupDirections");
    const popupDescription = document.querySelector("#popupDescription");
    const popupActions = document.querySelector("#popupActions");

    const view = { scale: 1, x: 0, y: 0 };

    let activePin = null;
    let isDragging = false;
    let didDrag = false;
    let dragStart = { x: 0, y: 0 };
    let viewStart = { x: 0, y: 0 };

    stage.addEventListener("pointerdown", startDrag);
    stage.addEventListener("pointermove", moveDrag);
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    stage.addEventListener("click", (event) => {
      if (didDrag) {
        didDrag = false;
        return;
      }

      if (
        event.target.closest(".pin") ||
        event.target.closest(".popup") ||
        event.target.closest(".zoom-controls")
      ) {
        return;
      }

      closePopup();
    });

    popup.addEventListener("click", (event) => event.stopPropagation());

    document.querySelector("#zoomIn").addEventListener("click", (event) => {
      event.stopPropagation();
      zoomBy(1.25);
    });

    document.querySelector("#zoomOut").addEventListener("click", (event) => {
      event.stopPropagation();
      zoomBy(0.8);
    });

    document.querySelector("#zoomReset").addEventListener("click", (event) => {
      event.stopPropagation();
      view.scale = 1;
      view.x = 0;
      view.y = 0;
      applyTransform();
    });

    loadDealers()
      .then((dealers) => {
        const visibleDealers = dealers.filter(isInsideCrop);

        if (!visibleDealers.length) {
          status.textContent = "표시할 대리점 좌표가 없습니다. Apps Script 응답에 lat, lng가 있는지 확인해주세요.";
          return;
        }

        status.textContent = "";
        renderPins(visibleDealers);
      })
      .catch((error) => {
        status.textContent = "대리점 정보를 불러오지 못했습니다. Apps Script 배포 URL과 접근 권한을 확인해주세요.";
        console.error(error);
      });

    async function loadDealers() {
      try {
        const response = await fetch(SHEET_API_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        return normalizePayload(payload);
      } catch (error) {
        const payload = await loadJsonp(SHEET_API_URL);
        return normalizePayload(payload);
      }
    }

    function loadJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = `dealerMap_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const src = new URL(url);

        src.searchParams.set("callback", callbackName);

        window[callbackName] = (payload) => {
          delete window[callbackName];
          script.remove();
          resolve(payload);
        };

        script.onerror = () => {
          delete window[callbackName];
          script.remove();
          reject(new Error("JSONP load failed"));
        };

        script.src = src.toString();
        document.head.appendChild(script);
      });
    }

    function normalizePayload(payload) {
      const rows = Array.isArray(payload) ? payload : payload.dealers;
      if (!Array.isArray(rows)) return [];

      return rows
        .map((dealer, index) => ({
          id: dealer.id || `dealer-${index + 1}`,
          category: clean(dealer.category),
          region: clean(dealer.region || dealer.category),
          name: clean(dealer.name),
          address: clean(dealer.address),
          phone: clean(dealer.phone),
          directions: clean(dealer.directions),
          description: clean(dealer.description),
          testDriveUrl: clean(dealer.testDriveUrl),
          eventUrl: clean(dealer.eventUrl),
          lat: Number(dealer.lat),
          lng: Number(dealer.lng)
        }))
        .filter((dealer) => dealer.name && Number.isFinite(dealer.lat) && Number.isFinite(dealer.lng));
    }

    function renderPins(dealers) {
      dealers.forEach((dealer) => {
        const position = project(dealer);
        const pin = document.createElement("button");
        const label = document.createElement("div");

        pin.type = "button";
        pin.className = "pin";
        pin.style.left = `${position.x}%`;
        pin.style.top = `${position.y}%`;
        pin.setAttribute("aria-label", `${dealer.name} 상세보기`);

        pin.addEventListener("click", (event) => {
          event.stopPropagation();
          showDealer(dealer, pin, position);
        });

        label.className = "pin-name";
        label.textContent = dealer.name;
        label.style.left = `${position.x}%`;
        label.style.top = `${position.y}%`;

        content.append(pin, label);
      });
    }

    function showDealer(dealer, pin, position) {
      if (activePin) activePin.classList.remove("active");

      activePin = pin;
      activePin.classList.add("active");

      popupName.textContent = dealer.name;
      popupAddress.textContent = dealer.address || "-";
      popupPhone.textContent = dealer.phone || "-";
      popupDirections.textContent = dealer.directions || "-";
      popupDescription.textContent = dealer.description || "";

      popupActions.innerHTML = "";

      if (dealer.testDriveUrl) {
        popupActions.append(createLink("시승 신청하기", dealer.testDriveUrl));
      } else {
        popupActions.append(createDisabledButton("시승 신청하기"));
      }

      if (dealer.eventUrl) {
        popupActions.append(createLink("진행중인 이벤트", dealer.eventUrl));
      }

      popup.style.left = `${position.x}%`;
      popup.style.top = `${position.y}%`;
      popup.classList.toggle("left", position.x > 58);
      popup.hidden = false;
    }

    function closePopup() {
      popup.hidden = true;

      if (activePin) {
        activePin.classList.remove("active");
        activePin = null;
      }
    }

    function createLink(text, href) {
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = text;
      return link;
    }

    function createDisabledButton(text) {
      const button = document.createElement("span");
      button.className = "disabled";
      button.textContent = text;
      return button;
    }

    function project(dealer) {
      const imageX = ((dealer.lng - mapInfo.minLng) / (mapInfo.maxLng - mapInfo.minLng)) * mapInfo.imageWidth;
      const imageY = ((mapInfo.maxLat - dealer.lat) / (mapInfo.maxLat - mapInfo.minLat)) * mapInfo.imageHeight;
      const x = ((imageX - mapInfo.cropX) / mapInfo.cropWidth) * 100;
      const y = ((imageY - mapInfo.cropY) / mapInfo.cropHeight) * 100;

      return { x, y };
    }

    function isInsideCrop(dealer) {
      const position = project(dealer);
      return position.x >= 0 && position.x <= 100 && position.y >= 0 && position.y <= 100;
    }

    function startDrag(event) {
      if (
        event.target.closest(".pin") ||
        event.target.closest(".popup") ||
        event.target.closest(".zoom-controls")
      ) {
        return;
      }

      isDragging = true;
      didDrag = false;
      dragStart = { x: event.clientX, y: event.clientY };
      viewStart = { x: view.x, y: view.y };
      stage.setPointerCapture(event.pointerId);
    }

    function moveDrag(event) {
      if (!isDragging) return;

      const dx = event.clientX - dragStart.x;
      const dy = event.clientY - dragStart.y;

      if (Math.abs(dx) + Math.abs(dy) > 4) didDrag = true;

      view.x = viewStart.x + dx;
      view.y = viewStart.y + dy;
      clampView();
      applyTransform();
    }

    function endDrag(event) {
      if (!isDragging) return;

      isDragging = false;
      stage.releasePointerCapture(event.pointerId);
    }

    function zoomBy(factor) {
      const rect = stage.getBoundingClientRect();
      const center = {
        x: rect.width / 2,
        y: rect.height / 2
      };

      const nextScale = clamp(view.scale * factor, 1, 4);
      const ratio = nextScale / view.scale;

      view.x = center.x - (center.x - view.x) * ratio;
      view.y = center.y - (center.y - view.y) * ratio;
      view.scale = nextScale;

      clampView();
      applyTransform();
    }

    function clampView() {
      const rect = stage.getBoundingClientRect();
      const scaledWidth = rect.width * view.scale;
      const scaledHeight = rect.height * view.scale;

      if (view.scale <= 1) {
        view.x = 0;
        view.y = 0;
        return;
      }

      view.x = clamp(view.x, rect.width - scaledWidth, 0);
      view.y = clamp(view.y, rect.height - scaledHeight, 0);
    }

    function applyTransform() {
      content.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function clean(value) {
      return String(value || "").trim();
    }
  </script>
</body>
</html>
