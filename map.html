<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>르노코리아 티에이오토 공식 대리점</title>

  <script
    type="text/javascript"
    src="https://map.vworld.kr/js/vworldMapInit.js.do?version=2.0&apiKey=0AF8F2A3-2F71-3FEC-9310-ADB256604DDE"
  ></script>

  <style>
    :root {
      --ink: #15171a;
      --muted: #666;
      --line: rgba(0, 0, 0, 0.12);
      --pin: #ffcf00;
      --panel: #fff;
      --shadow: 0 16px 45px rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    .map-app {
      min-height: 100vh;
      padding: 34px 20px;
      background: #fff;
    }

    .map-title {
      width: min(1240px, 100%);
      margin: 0 auto 24px;
      color: var(--ink);
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 0;
      text-align: center;
    }

    .locator-layout {
      position: relative;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 18px;
      width: min(1240px, 100%);
      margin: 0 auto;
      align-items: stretch;
    }

    .dealer-list {
      height: min(680px, calc(100vh - 150px));
      min-height: 560px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    .list-inner {
      padding: 16px;
    }

    .list-group + .list-group {
      margin-top: 20px;
    }

    .list-group h2 {
      margin: 0 0 10px;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 900;
    }

    .dealer-item {
      display: block;
      width: 100%;
      margin: 0;
      padding: 11px 10px;
      border: 1px solid transparent;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }

    .dealer-item:hover,
    .dealer-item.active {
      border-color: var(--ink);
      background: #fafafa;
    }

    .dealer-item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      line-height: 1.35;
    }

    .dealer-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .map-shell {
      position: relative;
      min-width: 0;
      background: #fff;
    }

    .map-viewport {
      position: relative;
      width: 100%;
      height: min(680px, calc(100vh - 150px));
      min-height: 560px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
    }

    #vmap {
      width: 100%;
      height: 100%;
      background: #fff;
    }

    .dealer-marker {
      position: relative;
      width: 30px;
      height: 30px;
      pointer-events: auto;
    }

    .dealer-pin {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 25px;
      height: 25px;
      border: 2px solid var(--ink);
      border-radius: 50% 50% 50% 0;
      background: var(--pin);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      transform: translateX(-50%) rotate(-45deg);
    }

    .dealer-pin::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
      transform: translate(-50%, -50%);
    }

    .dealer-pin:hover,
    .dealer-pin.active {
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.34);
    }

    .dealer-name {
      position: absolute;
      left: 50%;
      bottom: 34px;
      z-index: 10;
      padding: 7px 10px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #fff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      transition: opacity 0.12s ease;
    }

    .dealer-marker:hover .dealer-name {
      opacity: 1;
    }

    .dealer-popup {
      position: absolute;
      z-index: 100;
      width: min(380px, calc(100vw - 32px));
      border: 1px solid rgba(0, 0, 0, 0.14);
      background: var(--panel);
      box-shadow: var(--shadow);
      user-select: text;
      overflow: hidden;
    }

    .dealer-popup[hidden] {
      display: none;
    }

    .popup-photo {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #eee;
      display: none;
    }

    .popup-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .popup-body {
      padding: 20px;
    }

    .dealer-popup h1 {
      margin: 0 0 14px;
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .info {
      display: grid;
      gap: 8px;
      margin: 0 0 15px;
      font-size: 14px;
      line-height: 1.55;
    }

    .info div {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 8px;
    }

    .info dt {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .info dd {
      margin: 0;
      color: var(--ink);
    }

    .description {
      margin: 0 0 17px;
      padding-top: 15px;
      border-top: 1px solid rgba(0, 0, 0, 0.14);
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .actions a,
    .actions span {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .actions a:hover {
      background: var(--ink);
      color: #fff;
    }

    .actions span.disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .status {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 120;
      width: min(360px, calc(100vw - 32px));
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
      transform: translateX(-50%);
    }

    .status:empty {
      display: none;
    }

    @media (max-width: 820px) {
      .map-app {
        padding: 24px 12px;
      }

      .map-title {
        margin-bottom: 18px;
        font-size: 26px;
      }

      .locator-layout {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .dealer-list {
        height: auto;
        min-height: 0;
        max-height: 220px;
      }

      .list-inner {
        padding: 12px;
      }

      .map-viewport {
        height: calc(100vh - 360px);
        min-height: 520px;
      }

      .dealer-popup {
        position: fixed;
        left: 50% !important;
        top: 50% !important;
        width: calc(100vw - 28px);
        max-height: 72vh;
        overflow: auto;
        transform: translate(-50%, -50%);
      }

      .dealer-popup h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="map-app">
    <h1 class="map-title">르노코리아 티에이오토 공식 대리점</h1>

    <section class="locator-layout">
      <aside class="dealer-list" aria-label="대리점 목록">
        <div class="list-inner" id="dealerList"></div>
      </aside>

      <section class="map-shell">
        <div class="map-viewport" id="mapViewport">
          <div id="vmap"></div>
        </div>

        <article class="dealer-popup" id="popup" hidden>
          <div class="popup-photo" id="popupPhoto">
            <img id="popupImage" alt="" />
          </div>

          <div class="popup-body">
            <h1 id="popupName"></h1>

            <dl class="info">
              <div>
                <dt>주소</dt>
                <dd id="popupAddress"></dd>
              </div>
              <div>
                <dt>전화번호</dt>
                <dd id="popupPhone"></dd>
              </div>
              <div>
                <dt>오시는 길</dt>
                <dd id="popupDirections"></dd>
              </div>
            </dl>

            <p class="description" id="popupDescription"></p>
            <div class="actions" id="popupActions"></div>
          </div>
        </article>

        <div class="status" id="status"></div>
      </section>
    </section>
  </main>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwKxHf3rmSjGrfFRpp-VVH1hJs3M7gK0NPFS1UX-Xgyl1ULHU4bhiT6nLM8YbwuD_hrHw/exec";

    const groupOrder = ["서울 대리점", "경기 대리점", "인천 대리점", "강원 대리점"];

    const dealerList = document.querySelector("#dealerList");
    const mapShell = document.querySelector(".map-shell");
    const mapViewport = document.querySelector("#mapViewport");
    const status = document.querySelector("#status");
    const popup = document.querySelector("#popup");
    const popupPhoto = document.querySelector("#popupPhoto");
    const popupImage = document.querySelector("#popupImage");
    const popupName = document.querySelector("#popupName");
    const popupAddress = document.querySelector("#popupAddress");
    const popupPhone = document.querySelector("#popupPhone");
    const popupDirections = document.querySelector("#popupDirections");
    const popupDescription = document.querySelector("#popupDescription");
    const popupActions = document.querySelector("#popupActions");

    let vmap = null;
    let activePin = null;
    let activeCoordinate = null;
    let activeListItem = null;
    let markerById = new Map();
    let dealerById = new Map();

    window.addEventListener("load", init);
    window.addEventListener("resize", () => {
      if (activeCoordinate) positionPopup(activeCoordinate);
    });

    function init() {
      if (!window.vw || !window.ol) {
        status.textContent = "VWorld 지도를 불러오지 못했습니다. 인증키와 도메인 설정을 확인해주세요.";
        return;
      }

      createMap();

      loadDealers()
        .then((dealers) => {
          if (!dealers.length) {
            status.textContent = "표시할 대리점 정보가 없습니다.";
            return;
          }

          status.textContent = "";
          renderList(dealers);
          renderMarkers(dealers);
        })
        .catch((error) => {
          status.textContent = "대리점 정보를 불러오지 못했습니다. Apps Script 배포 URL과 접근 권한을 확인해주세요.";
          console.error(error);
        });
    }

    function createMap() {
      vw.ol3.MapOptions = {
        basemapType: vw.ol3.BasemapType.GRAPHIC,
        controlDensity: vw.ol3.DensityType.EMPTY,
        interactionDensity: vw.ol3.DensityType.BASIC,
        controlsAutoArrange: true,
        homePosition: vw.ol3.CameraPosition,
        initPosition: vw.ol3.CameraPosition
      };

      vmap = new vw.ol3.Map("vmap", vw.ol3.MapOptions);

      const view = vmap.getView();

      if (isMobile()) {
        view.setCenter(ol.proj.fromLonLat([127.15, 37.55]));
        view.setZoom(10);
      } else {
        view.setCenter(ol.proj.fromLonLat([127.42, 37.6]));
        view.setZoom(10);
      }

      vmap.on("singleclick", function(event) {
        const target = event.originalEvent && event.originalEvent.target;
        if (target && target.closest && target.closest(".dealer-marker")) return;
        closePopup();
      });

      vmap.on("moveend", function() {
        if (activeCoordinate) positionPopup(activeCoordinate);
      });
    }

    async function loadDealers() {
      const payload = await loadJsonp(SHEET_API_URL);
      return normalizePayload(payload);
    }

    function loadJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = `dealerMap_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement("script");
        const src = new URL(url);

        src.searchParams.set("callback", callbackName);

        window[callbackName] = (payload) => {
          delete window[callbackName];
          script.remove();
          resolve(payload);
        };

        script.onerror = () => {
          delete window[callbackName];
          script.remove();
          reject(new Error("JSONP load failed"));
        };

        script.src = src.toString();
        document.head.appendChild(script);
      });
    }

    function normalizePayload(payload) {
      const rows = Array.isArray(payload) ? payload : payload.dealers;
      if (!Array.isArray(rows)) return [];

      return rows
        .map((dealer, index) => ({
          id: dealer.id || `dealer-${index + 1}`,
          category: clean(dealer.category),
          region: clean(dealer.region || dealer.category),
          name: clean(dealer.name),
          address: clean(dealer.address),
          phone: clean(dealer.phone),
          directions: clean(dealer.directions),
          description: clean(dealer.description),
          testDriveUrl: clean(dealer.testDriveUrl),
          eventUrl: clean(dealer.eventUrl),
          imageUrl: normalizeImageUrl(clean(dealer.imageUrl || dealer.photoUrl || dealer.image)),
          lat: Number(dealer.lat),
          lng: Number(dealer.lng)
        }))
        .filter((dealer) => dealer.name && Number.isFinite(dealer.lat) && Number.isFinite(dealer.lng));
    }

    function renderList(dealers) {
      dealerList.innerHTML = "";

      const grouped = new Map();
      dealers.forEach((dealer) => {
        const key = dealer.category || dealer.region || "기타";
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(dealer);
      });

      const orderedGroups = [
        ...groupOrder.filter((group) => grouped.has(group)),
        ...[...grouped.keys()].filter((group) => !groupOrder.includes(group))
      ];

      orderedGroups.forEach((group) => {
        const section = document.createElement("section");
        section.className = "list-group";

        const title = document.createElement("h2");
        title.textContent = group;
        section.append(title);

        grouped.get(group).forEach((dealer) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "dealer-item";
          item.dataset.dealerId = dealer.id;
          item.innerHTML = `
            <strong>${escapeHtml(dealer.name)}</strong>
            <span>${escapeHtml(dealer.address)}</span>
          `;

          item.addEventListener("click", () => focusDealer(dealer.id));

          section.append(item);
        });

        dealerList.append(section);
      });
    }

    function renderMarkers(dealers) {
      dealers.forEach((dealer) => {
        const coordinate = ol.proj.fromLonLat([dealer.lng, dealer.lat]);
        const marker = createMarkerElement(dealer);

        dealerById.set(dealer.id, { dealer, coordinate });
        markerById.set(dealer.id, marker);

        const overlay = new ol.Overlay({
          element: marker,
          positioning: "bottom-center",
          position: coordinate,
          stopEvent: true
        });

        marker.querySelector(".dealer-pin").addEventListener("click", (event) => {
          event.stopPropagation();
          showDealer(dealer, coordinate, marker.querySelector(".dealer-pin"));
        });

        vmap.addOverlay(overlay);
      });
    }

    function createMarkerElement(dealer) {
      const marker = document.createElement("div");
      marker.className = "dealer-marker";

      const pin = document.createElement("button");
      pin.type = "button";
      pin.className = "dealer-pin";
      pin.setAttribute("aria-label", `${dealer.name} 상세보기`);

      const label = document.createElement("div");
      label.className = "dealer-name";
      label.textContent = dealer.name;

      marker.append(pin, label);

      return marker;
    }

    function focusDealer(id) {
      const entry = dealerById.get(id);
      const marker = markerById.get(id);
      if (!entry || !marker) return;

      const view = vmap.getView();
      const targetZoom = Math.max(view.getZoom(), isMobile() ? 12 : 11);

      view.animate({
        center: entry.coordinate,
        zoom: targetZoom,
        duration: 280
      });

      showDealer(entry.dealer, entry.coordinate, marker.querySelector(".dealer-pin"));
    }

    function showDealer(dealer, coordinate, pin) {
      if (activePin) activePin.classList.remove("active");
      if (activeListItem) activeListItem.classList.remove("active");

      activePin = pin;
      activeCoordinate = coordinate;
      activePin.classList.add("active");

      activeListItem = dealerList.querySelector(`[data-dealer-id="${CSS.escape(dealer.id)}"]`);
      if (activeListItem) {
        activeListItem.classList.add("active");
        activeListItem.scrollIntoView({ block: "nearest" });
      }

      popupName.textContent = dealer.name;
      popupAddress.textContent = dealer.address || "-";
      popupPhone.textContent = dealer.phone || "-";
      popupDirections.textContent = dealer.directions || "-";
      popupDescription.textContent = dealer.description || "";

      if (dealer.imageUrl) {
        popupPhoto.style.display = "block";
        popupImage.src = dealer.imageUrl;
        popupImage.alt = `${dealer.name} 사진`;
      } else {
        popupPhoto.style.display = "none";
        popupImage.removeAttribute("src");
        popupImage.alt = "";
      }

      popupActions.innerHTML = "";

      if (dealer.testDriveUrl) {
        popupActions.append(createLink("시승 신청하기", dealer.testDriveUrl));
      } else {
        popupActions.append(createDisabledButton("시승 신청하기"));
      }

      if (dealer.eventUrl) {
        popupActions.append(createLink("진행중인 이벤트", dealer.eventUrl));
      }

      popup.hidden = false;

      if (isMobile()) {
        vmap.getView().animate({
          center: coordinate,
          duration: 220
        });
      }

      positionPopup(coordinate);
    }

    function positionPopup(coordinate) {
      if (popup.hidden || !vmap) return;

      if (isMobile()) {
        popup.style.left = "50%";
        popup.style.top = "50%";
        return;
      }

      const pixel = vmap.getPixelFromCoordinate(coordinate);
      const shellRect = mapShell.getBoundingClientRect();
      const viewportRect = mapViewport.getBoundingClientRect();

      popup.style.left = "0px";
      popup.style.top = "0px";

      const popupRect = popup.getBoundingClientRect();
      const gap = 16;
      const margin = 12;

      let x = viewportRect.left - shellRect.left + pixel[0] + gap;
      let y = viewportRect.top - shellRect.top + pixel[1] - popupRect.height / 2;

      const maxX = shellRect.width - popupRect.width - margin;
      const maxY = Math.max(margin, viewportRect.height - popupRect.height - margin);

      if (x > maxX) {
        x = viewportRect.left - shellRect.left + pixel[0] - popupRect.width - gap;
      }

      x = clamp(x, margin, maxX);
      y = clamp(y, margin, maxY);

      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;
    }

    function closePopup() {
      popup.hidden = true;
      activeCoordinate = null;

      if (activePin) {
        activePin.classList.remove("active");
        activePin = null;
      }

      if (activeListItem) {
        activeListItem.classList.remove("active");
        activeListItem = null;
      }
    }

    function createLink(text, href) {
      const link = document.createElement("a");
      link.href = href;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = text;
      return link;
    }

    function createDisabledButton(text) {
      const button = document.createElement("span");
      button.className = "disabled";
      button.textContent = text;
      return button;
    }

    function normalizeImageUrl(url) {
      if (!url) return "";

      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if (driveMatch) {
        return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
      }

      return url;
    }

    function isMobile() {
      return window.matchMedia("(max-width: 820px)").matches;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function clean(value) {
      return String(value || "").trim();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }
  </script>
</body>
</html>
