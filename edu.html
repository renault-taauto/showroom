<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renault Visitor Tracker</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 120px;
      padding: 20px;
      background: #fff;
      font-family: Arial, sans-serif;
    }
    .widget {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #111;
    }
    .logo {
      display: block;
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="방문 기록 위젯">
    <img
      class="logo"
      src="https://raw.githubusercontent.com/renault-taauto/showroom/main/renault/logo.png"
      alt="Renault"
    >
  </main>

  <script>
    // 기존에 전달받은 GAS 웹앱 주소를 그대로 사용합니다.
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxeAb0XCmlguVGV5WunqGATyiYiw8HVZ1lXjP4Oic2ru4T72-MB0jKsXclVXko5woEK/exec';

    function getVisitorId() {
      const key = 'renault_visitor_id';
      try {
        let id = localStorage.getItem(key);
        if (!id) {
          id = makeVisitorId_();
          localStorage.setItem(key, id);
        }
        return id;
      } catch (_) {
        return makeVisitorId_();
      }
    }

    function makeVisitorId_() {
      return (window.crypto && crypto.randomUUID && crypto.randomUUID()) ||
        `v-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function getDevice() {
      return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
        ? '모바일'
        : 'PC';
    }

    function getBrowser() {
      const ua = navigator.userAgent;
      if (/Edg\//.test(ua)) return 'Edge';
      if (/Chrome\//.test(ua)) return 'Chrome';
      if (/Firefox\//.test(ua)) return 'Firefox';
      if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return 'Safari';
      return '기타';
    }

    async function getCity() {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 2500);
        const response = await fetch('https://ipapi.co/json/', {
          cache: 'no-store',
          signal: controller.signal
        });
        clearTimeout(timeout);
        if (!response.ok) return '';
        const data = await response.json();
        return data.city || '';
      } catch (_) {
        return '';
      }
    }

    async function recordVisit() {
      try {
        if (!GAS_WEB_APP_URL) return;

        const payload = {
          visitorId: getVisitorId(),
          city: await getCity(),
          device: getDevice(),
          browser: getBrowser(),
          referrer: document.referrer || '',
          pageUrl: document.referrer || ''
        };

        const body = JSON.stringify(payload);
        const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });

        if (navigator.sendBeacon) {
          navigator.sendBeacon(GAS_WEB_APP_URL, blob);
        } else {
          await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body,
            keepalive: true
          });
        }
      } catch (_) {
      }
    }

    recordVisit();
  </script>
</body>
</html>
