<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renault Visitor Tracker</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 120px;
      padding: 20px;
      background: #fff;
      font-family: Arial, sans-serif;
    }
    .widget {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #111;
    }
    .logo {
      display: block;
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .status {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: #666;
    }
  </style>
</head>
<body>
  <main class="widget" aria-label="방문 기록 위젯">
    <img
      class="logo"
      src="https://raw.githubusercontent.com/renault-taauto/showroom/main/renault/logo.png"
      alt="Renault"
    >
    <p class="status" id="status">방문 기록 중</p>
  </main>

  <script>
    // GAS 웹앱 배포 후 아래 주소를 교체하세요.
    const GAS_WEB_APP_URL = 'YOUR_GAS_WEB_APP_URL';
    const PAGE_ID = 'renault-public-page';

    function getVisitorId() {
      const key = 'renault_visitor_id';
      let id = localStorage.getItem(key);
      if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) ||
          `v-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem(key, id);
      }
      return id;
    }

    function getDevice() {
      return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
        ? '모바일'
        : 'PC';
    }

    function getBrowser() {
      const ua = navigator.userAgent;
      if (/Edg\//.test(ua)) return 'Edge';
      if (/Chrome\//.test(ua)) return 'Chrome';
      if (/Firefox\//.test(ua)) return 'Firefox';
      if (/Safari\//.test(ua) && !/Chrome\//.test(ua)) return 'Safari';
      return '기타';
    }

    async function getCity() {
      try {
        const response = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
        if (!response.ok) return '';
        const data = await response.json();
        return data.city || '';
      } catch (_) {
        return '';
      }
    }

    async function recordVisit() {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL === 'https://script.google.com/macros/s/AKfycbxeAb0XCmlguVGV5WunqGATyiYiw8HVZ1lXjP4Oic2ru4T72-MB0jKsXclVXko5woEK/exec') {
        document.getElementById('status').textContent = 'GAS 주소를 입력하세요';
        return;
      }

      const payload = {
        visitorId: getVisitorId(),
        city: await getCity(),
        device: getDevice(),
        browser: getBrowser(),
        referrer: document.referrer || '',
        pageId: PAGE_ID
      };

      try {
        // text/plain은 브라우저의 CORS 사전 요청을 피하기 위한 방식입니다.
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          keepalive: true
        });
        document.getElementById('status').textContent = '방문 기록 완료';
      } catch (_) {
        document.getElementById('status').textContent = '방문 기록 대기 중';
      }
    }

    recordVisit();
  </script>
</body>
</html>
