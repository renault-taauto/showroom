<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comments</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:transparent;color:#37352f;font:14px/1.45 Arial,sans-serif}
    .wrap{width:100%;max-width:760px;margin:auto}.bar{display:flex;align-items:center;gap:5px;min-height:36px;border-bottom:1px solid #e9e9e7;padding:4px 0}.title{font-size:14px}.space-id{color:#b0afac;font-size:10px}.setup{display:none;gap:8px}.setup.show{display:flex}.setup input{flex:1}.setup button{display:none}.comment-prompt{display:none;align-items:center;gap:30px;height:38px;color:#b0afac;cursor:text;border-bottom:1px solid #e9e9e7}.comment-prompt.show{display:flex}.comment-prompt:hover{color:#787774}.comment{display:flex;align-items:center;gap:7px;min-height:36px;padding:7px 0;border-bottom:1px solid #e9e9e7}.reply{padding-left:22px}.author{font-weight:600;white-space:nowrap}.content{flex:1;min-width:0;overflow-wrap:anywhere}.time{color:#9b9a97;font-size:12px;white-space:nowrap}.actions{display:flex;gap:2px}button{border:0;border-radius:0;padding:2px 4px;background:transparent;color:#787774;cursor:pointer}button:hover{color:#37352f;text-decoration:underline}.form{display:none;align-items:center;gap:7px;min-height:38px;border-bottom:1px solid #e9e9e7}.form.open{display:flex}input{min-width:0;border:0;border-bottom:1px solid #d3d3d0;border-radius:0;padding:6px 2px;outline:0;background:transparent}.name{width:110px}.text{flex:1}.pw{width:112px}.private{display:none;align-items:center;gap:7px}.private.open{display:flex}.message{padding:8px 0;color:#9b9a97;font-size:13px}@media(max-width:560px){.comment,.form{flex-wrap:wrap}.content{flex-basis:100%;order:3}.form .text{flex-basis:100%;order:3}.time{margin-left:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <div id="setup" class="setup"><input id="spaceInput" placeholder="식별 ID" maxlength="100"><button id="spaceConfirm" type="button">확인</button></div>
    <div id="header" class="bar" hidden><span class="title">댓글 <small id="spaceId" class="space-id"></small></span></div>
    <div id="prompt" class="comment-prompt"><span>작성자</span><span>댓글 추가</span></div>
    <form id="writeForm" class="form"><input class="name" name="author" maxlength="40" placeholder="작성자" required><input class="text" name="content" maxlength="1000" placeholder="댓글 추가" required><span id="private" class="private"><input class="pw" name="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="비밀번호 4자리" required><button>등록</button><button type="button" id="cancel">취소</button></span></form>
    <section id="list"></section>
  </main>
  <script>
    const GAS_URL='https://script.google.com/macros/s/AKfycbxeAb0XCmlguVGV5WunqGATyiYiw8HVZ1lXjP4Oic2ru4T72-MB0jKsXclVXko5woEK/exec';
    const STORAGE_KEY='renault_comment_space';
    const pageId=new URLSearchParams(location.search).get('page_id')||document.referrer||'default';
    let activeSpace=null;
    const qs=s=>document.querySelector(s),setup=qs('#setup'),input=qs('#spaceInput'),prompt=qs('#prompt'),form=qs('#writeForm'),list=qs('#list');
    const queryId=new URLSearchParams(location.search).get('space_id'),stored=readSpace_();
    if(queryId)findSpace_(queryId);else if(stored)findSpace_(stored.id);else showSetup_();
    qs('#spaceConfirm').onclick=()=>findSpace_(input.value.trim());
    prompt.onclick=()=>{prompt.classList.remove('show');form.classList.add('open');form.querySelector('.name').focus()};
    qs('#cancel').onclick=resetForm_;
    form.querySelector('[name="content"]').oninput=e=>qs('#private').classList.toggle('open',Boolean(e.target.value.trim()));
    form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));if(!/^\d{4}$/.test(d.password))return alert('비밀번호는 숫자 4자리로 입력하세요.');await send_({action:'create',spaceId:activeSpace.id,pageId,parentId:'',author:d.author,content:d.content,password:d.password});resetForm_();setTimeout(load_,500)};
    function findSpace_(id){if(!id)return showSetup_();jsonp_('space',{id},data=>{if(!data.ok)return showSetup_('등록되지 않은 식별 ID입니다.');activeSpace=data.space;saveSpace_(activeSpace);setup.classList.remove('show');qs('#header').hidden=false;qs('#spaceId').textContent=activeSpace.id;prompt.classList.add('show');load_()})}
    function showSetup_(message){setup.classList.add('show');qs('#header').hidden=true;prompt.classList.remove('show');if(message)input.placeholder=message}
    function saveSpace_(space){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(space));history.replaceState(null,'',`${location.pathname}?space_id=${encodeURIComponent(space.id)}`)}catch(_){} }
    function readSpace_(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(_){return null}}
    function resetForm_(){form.reset();qs('#private').classList.remove('open');form.classList.remove('open');if(activeSpace)prompt.classList.add('show')}
    function jsonp_(action,params,done){const cb='cb_'+Date.now();window[cb]=data=>{delete window[cb];script.remove();done(data)};const script=document.createElement('script');script.src=`${GAS_URL}?action=${action}&callback=${cb}&${new URLSearchParams(params)}`;script.onerror=()=>{delete window[cb];script.remove();showSetup_('연결할 수 없습니다.')};document.body.appendChild(script)}
    function send_(payload){return fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true})}
    function load_(){if(!activeSpace)return;jsonp_('list',{spaceId:activeSpace.id},data=>render_(data.comments||[]))}
    function render_(comments){list.replaceChildren();comments.filter(c=>!c.parentId).forEach(c=>{list.appendChild(row_(c,false));comments.filter(r=>r.parentId===c.id).forEach(r=>list.appendChild(row_(r,true)))})}
    function row_(c,isReply){const row=document.createElement('article');row.className='comment'+(isReply?' reply':'');const a=document.createElement('strong');a.className='author';a.textContent=c.author;const t=document.createElement('span');t.className='content';t.textContent=c.content;const time=document.createElement('time');time.className='time';time.textContent=new Date(c.createdAt).toLocaleString('ko-KR');const actions=document.createElement('span');actions.className='actions';const reply=document.createElement('button');reply.textContent='답글';reply.onclick=()=>inline_(row,c.id,true);const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>inline_(row,c.id,false,c);actions.append(reply,edit);row.append(a,t,time,actions);return row}
    function inline_(row,id,isReply,original){if(row.nextElementSibling?.classList.contains('form'))return;const f=document.createElement('form');f.className='form open';f.innerHTML=isReply?'<input class="name" name="author" maxlength="40" placeholder="작성자" required><input class="text" name="content" maxlength="1000" placeholder="답글" required><input class="pw" name="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="비밀번호 4자리" required><button>등록</button><button type="button">취소</button>':`<input class="text" name="content" maxlength="1000" value="${escape_(original.content)}" required><input class="pw" name="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="비밀번호 4자리" required><button>저장</button><button type="button">취소</button>`;f.querySelector('button[type="button"]').onclick=()=>f.remove();f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(!/^\d{4}$/.test(d.password))return alert('비밀번호는 숫자 4자리로 입력하세요.');await send_(isReply?{action:'create',spaceId:activeSpace.id,pageId,parentId:id,author:d.author,content:d.content,password:d.password}:{action:'edit',id,content:d.content,password:d.password});f.remove();setTimeout(load_,500)};row.after(f)}
    function escape_(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  </script>
</body>
</html>
