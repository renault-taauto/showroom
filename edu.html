<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comments</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;background:transparent;color:#37352f;font:14px/1.45 Arial,sans-serif}
    .wrap{width:100%;max-width:760px;margin:auto}.bar,.comment,.form{display:flex;align-items:center;gap:7px;min-height:36px;border-bottom:1px solid #e9e9e7}
    .bar{justify-content:space-between;padding:4px 0}.label{color:#787774;font-size:13px}.comment{padding:7px 0}.reply{padding-left:22px}.author{font-weight:600;white-space:nowrap}.content{flex:1;min-width:0;overflow-wrap:anywhere}.time{color:#9b9a97;font-size:12px;white-space:nowrap}.actions{display:flex;gap:2px}button{border:0;border-radius:4px;padding:5px 7px;background:transparent;color:#787774;cursor:pointer}button:hover{background:#f1f1ef}.primary{background:#37352f;color:#fff}.primary:hover{background:#222;color:#fff}.form{display:none;padding:5px 0}.form.open{display:flex}input{min-width:0;border:1px solid #d3d3d0;border-radius:4px;padding:6px 8px;outline:0}.name{width:110px}.text{flex:1}.pw{width:112px}.empty,.message{padding:10px 0;color:#9b9a97;font-size:13px}.space{flex:1;min-width:0}.space input{width:100%}
    @media(max-width:560px){.bar,.comment,.form{flex-wrap:wrap}.content{flex-basis:100%;order:3}.form .text{flex-basis:100%;order:3}.time{margin-left:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <div id="selectBar" class="bar">
      <span class="space"><input id="spaceName" placeholder="식별 이름을 입력하세요" maxlength="100"></span>
      <button id="register" class="primary" type="button">등록</button>
      <button id="confirm" type="button">확인</button>
    </div>
    <div id="commentBar" class="bar" hidden>
      <span class="label" id="selectedName"></span>
      <button id="writeButton" class="primary" type="button">댓글 작성</button>
    </div>
    <form id="writeForm" class="form">
      <input class="name" name="author" maxlength="40" placeholder="작성자" required>
      <input class="text" name="content" maxlength="1000" placeholder="댓글을 입력하세요" required>
      <input class="pw" name="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="비밀번호 4자리" required>
      <button class="primary">등록</button><button type="button" data-close>취소</button>
    </form>
    <section id="list" aria-live="polite"></section>
  </main>
  <script>
    const GAS_URL='https://script.google.com/macros/s/AKfycbxeAb0XCmlguVGV5WunqGATyiYiw8HVZ1lXjP4Oic2ru4T72-MB0jKsXclVXko5woEK/exec';
    const STORAGE_KEY='renault_comment_space';
    const pageId=new URLSearchParams(location.search).get('page_id')||document.referrer||'default';
    let activeSpace=null;
    const list=document.getElementById('list'), writeForm=document.getElementById('writeForm');
    const saved=readSpace_(); if(saved) selectSpace_(saved);
    document.getElementById('register').onclick=()=>registerSpace_();
    document.getElementById('confirm').onclick=()=>confirmSpace_();
    document.getElementById('writeButton').onclick=()=>{writeForm.classList.add('open');writeForm.querySelector('input').focus()};
    document.querySelector('[data-close]').onclick=()=>writeForm.classList.remove('open');
    writeForm.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(writeForm));if(!/^\d{4}$/.test(d.password))return alert('비밀번호는 숫자 4자리로 입력하세요.');await send_({action:'create',spaceId:activeSpace.id,pageId,parentId:'',author:d.author,content:d.content,password:d.password});writeForm.reset();writeForm.classList.remove('open');setTimeout(load_,500)};

    function registerSpace_(){const name=document.getElementById('spaceName').value.trim();if(!name)return alert('식별 이름을 입력하세요.');jsonp_('register',name,data=>{if(data.exists)return alert('이미 등록된 이름입니다. 기존 내용을 불러오려면 확인을 누르세요.');if(!data.ok)return alert(data.error||'등록하지 못했습니다.');saveSpace_(data.space);selectSpace_(data.space)})}
    function confirmSpace_(){const name=document.getElementById('spaceName').value.trim();if(!name)return alert('식별 이름을 입력하세요.');jsonp_('space',name,data=>{if(!data.ok)return alert('등록된 식별 이름이 없습니다.');saveSpace_(data.space);selectSpace_(data.space)})}
    function selectSpace_(space){activeSpace=space;document.getElementById('selectBar').hidden=true;document.getElementById('commentBar').hidden=false;document.getElementById('selectedName').textContent=space.name;load_()}
    function readSpace_(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(_){return null}}
    function saveSpace_(space){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(space))}catch(_){} }
    function jsonp_(action,name,done){const cb='cb_'+Date.now();window[cb]=data=>{delete window[cb];script.remove();done(data)};const script=document.createElement('script');script.src=`${GAS_URL}?action=${action}&name=${encodeURIComponent(name)}&callback=${cb}`;script.onerror=()=>{delete window[cb];script.remove();alert('GAS에 연결하지 못했습니다.')};document.body.appendChild(script)}
    function send_(payload){return fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true})}
    function load_(){if(!activeSpace)return;const cb='list_'+Date.now();window[cb]=data=>{delete window[cb];script.remove();render_(data.comments||[])};const script=document.createElement('script');script.src=`${GAS_URL}?action=list&spaceId=${encodeURIComponent(activeSpace.id)}&callback=${cb}`;script.onerror=()=>{list.innerHTML='<div class="message">댓글을 불러오지 못했습니다.</div>'};document.body.appendChild(script)}
    function render_(comments){list.replaceChildren();if(!comments.length){list.innerHTML='<div class="empty">첫 댓글을 남겨보세요.</div>';return}comments.filter(c=>!c.parentId).forEach(c=>{list.appendChild(row_(c,false));comments.filter(r=>r.parentId===c.id).forEach(r=>list.appendChild(row_(r,true)))})}
    function row_(c,isReply){const row=document.createElement('article');row.className='comment'+(isReply?' reply':'');const a=document.createElement('strong');a.className='author';a.textContent=c.author;const text=document.createElement('span');text.className='content';text.textContent=c.content;const time=document.createElement('time');time.className='time';time.textContent=new Date(c.createdAt).toLocaleString('ko-KR');const actions=document.createElement('span');actions.className='actions';const reply=document.createElement('button');reply.textContent='답글';reply.onclick=()=>inline_(row,c.id,true);const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>inline_(row,c.id,false,c);actions.append(reply,edit);row.append(a,text,time,actions);return row}
    function inline_(row,id,isReply,original){if(row.nextElementSibling?.classList.contains('form'))return;const f=document.createElement('form');f.className='form open';f.innerHTML=isReply?'<input class="name" name="author" maxlength="40" placeholder="작성자" required><input class="text" name="content" maxlength="1000" placeholder="답글" required><input class="pw" name="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="비밀번호 4자리" required><button class="primary">등록</button><button type="button">취소</button>':`<input class="text" name="content" maxlength="1000" value="${escape_(original.content)}" required><input class="pw" name="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="비밀번호 4자리" required><button class="primary">저장</button><button type="button">취소</button>`;f.querySelector('button[type="button"]').onclick=()=>f.remove();f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(!/^\d{4}$/.test(d.password))return alert('비밀번호는 숫자 4자리로 입력하세요.');await send_(isReply?{action:'create',spaceId:activeSpace.id,pageId,parentId:id,author:d.author,content:d.content,password:d.password}:{action:'edit',id,content:d.content,password:d.password});f.remove();setTimeout(load_,500)};row.after(f)}
    function escape_(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  </script>
</body>
</html>
