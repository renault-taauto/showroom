<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LG 디스플레이 특별 구매 혜택</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000}.creative{position:relative;width:min(100%,1241px);margin:auto;line-height:0}.creative>img{display:block;width:100%;height:auto}.call-area{position:absolute;left:8.4%;top:56.5%;width:79.5%;height:4.4%;z-index:2;display:block;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.call-area:focus-visible{outline:4px solid #1677ff;outline-offset:-4px}body.debug .call-area{background:#f003;outline:2px solid red}</style></head>
<body><main class="creative"><img src="https://raw.githubusercontent.com/renault-taauto/showroom/main/20260715/LG%20D.png" width="1241" height="2015" alt="LG 디스플레이 특별 구매 혜택"><a id="callButton" class="call-area" href="tel:01077777737" aria-label="010-7777-7737 전화 걸기"></a></main>
<script>const COMPANY='lgd',PAGE_ID='rkmbukilsan_lgd',PHONE_NUMBER='01077777737',GAS_URL='https://script.google.com/macros/s/AKfycbyoHOS9rcMS75z-3mWJflzSnJYyGcxwQ1Lqcu6jYdq2fZOJxHa6nHVu8_cQxrwVpMH1/exec';
function makeId(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}function sessionId(){try{let v=sessionStorage.getItem('traffic_session_id');if(!v){v=makeId('s');sessionStorage.setItem('traffic_session_id',v)}return v}catch(e){return makeId('s')}}const SESSION_ID=sessionId(),TRACKING_PIXELS=[];function query(eventName){return new URLSearchParams({company:COMPANY,event:eventName,event_id:makeId('e'),session_id:SESSION_ID,page_id:PAGE_ID,page_url:location.href,referrer:document.referrer,user_agent:navigator.userAgent,language:navigator.language||'',timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',screen:screen.width+'x'+screen.height,client_time:new Date().toISOString()})}function track(eventName){const url=GAS_URL+'?'+query(eventName);if(window.fetch){return fetch(url,{method:'GET',mode:'no-cors',keepalive:true,cache:'no-store'}).catch(function(){})}const pixel=new Image();TRACKING_PIXELS.push(pixel);pixel.onload=pixel.onerror=function(){const i=TRACKING_PIXELS.indexOf(pixel);if(i>-1)TRACKING_PIXELS.splice(i,1)};pixel.src=url;return Promise.resolve()}document.getElementById('callButton').addEventListener('click',function(e){e.preventDefault();track('call_click');setTimeout(function(){location.href='tel:'+PHONE_NUMBER},350)});track('view');</script></body></html>
