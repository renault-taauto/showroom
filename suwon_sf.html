<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>르노코리아 스타필드수원점</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f6f6;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }

    .banner-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e8e8e8;
      color: #777;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      padding: 24px;
    }

    .info {
      padding: 24px 20px 18px;
      border-bottom: 1px solid #eee;
    }

    .manager {
      margin: 0 0 7px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .branch {
      margin: 0 0 16px;
      font-size: 17px;
      font-weight: 700;
      color: #333;
    }

    .detail-list {
      display: grid;
      gap: 9px;
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 10px;
    }

    .detail-label {
      color: #777;
      font-weight: 700;
    }

    .detail-value {
      color: #111;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 18px 20px 24px;
    }

    .action-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
    }

    .call {
      background: #111;
      color: #fff;
    }

    .sms {
      background: #efefef;
      color: #111;
    }

    @media (max-width: 360px) {
      .info {
        padding: 22px 16px 16px;
      }

      .actions {
        padding: 16px;
      }

      .action-link {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="banner" aria-label="르노코리아 스타필드수원점 배너">
      <img src="https://raw.githubusercontent.com/renault-taauto/showroom/main/suwon_sf.png" alt="르노코리아 스타필드수원점 안내">
    </section>

    <section class="info" aria-label="지점 정보">
      <h1 class="manager">박홍준 지점장</h1>
      <p class="branch">르노코리아 스타필드수원점</p>

      <dl class="detail-list">
        <div class="detail-row">
          <dt class="detail-label">전화</dt>
          <dd class="detail-value">010-3161-1761</dd>
        </div>
        <div class="detail-row">
          <dt class="detail-label">주소</dt>
          <dd class="detail-value">경기 수원시 장안구 수성로 175</dd>
        </div>
      </dl>
    </section>

    <nav class="actions" aria-label="연락하기">
      <a class="action-link call" href="tel:01031611761">전화걸기</a>
      <a class="action-link sms" href="sms:01031611761?body=%EB%84%A4%EC%9D%B4%EB%B2%84%20%EB%B8%94%EB%A1%9C%EA%B7%B8%20%EB%B3%B4%EA%B3%A0%20%EC%97%B0%EB%9D%BD%EB%93%9C%EB%A6%BD%EB%8B%88%EB%8B%A4.">문자보내기</a>
    </nav>
  </main>
</body>
</html>
