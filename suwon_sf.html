<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>르노코리아 스타필드수원점</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f6f6;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    main {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }

    .banner-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e8e8e8;
      color: #777;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      padding: 24px;
    }

    .info {
      padding: 24px 20px 18px;
      border-bottom: 1px solid #eee;
    }

    .manager {
      margin: 0 0 7px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .branch {
      margin: 0 0 16px;
      font-size: 17px;
      font-weight: 700;
      color: #333;
    }

    .detail-list {
      display: grid;
      gap: 9px;
      margin: 0;
      font-size: 15px;
      line-height: 1.55;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 10px;
    }

    .detail-label {
      color: #777;
      font-weight: 700;
    }

    .detail-value {
      color: #111;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 18px 20px 24px;
    }

    .action-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
    }

    .call {
      background: #111;
      color: #fff;
    }

    .sms {
      background: #efefef;
      color: #111;
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      z-index: 20;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 14px 14px 0 0;
      padding: 20px 18px 28px;
    }

    .modal-title {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 800;
    }

    .modal-sub {
      margin: 0 0 16px;
      color: #777;
      font-size: 13px;
      line-height: 1.45;
    }

    .field {
      display: block;
      margin-bottom: 12px;
    }

    .field span {
      display: block;
      margin-bottom: 5px;
      color: #444;
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 9px 10px;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 15px;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 8px;
      margin-top: 4px;
    }

    .modal-button {
      min-height: 46px;
      border-radius: 8px;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .modal-cancel {
      border: 1px solid #ddd;
      background: #fff;
      color: #111;
    }

    .modal-confirm {
      border: 0;
      background: #111;
      color: #fff;
    }

    .modal-confirm:disabled {
      background: #cfcfcf;
      color: #777;
      cursor: not-allowed;
    }

    .privacy-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 2px 0 14px;
      color: #555;
      font-size: 12px;
      line-height: 1.45;
    }

    .privacy-check input {
      width: 16px;
      height: 16px;
      margin: 1px 0 0;
      flex: 0 0 auto;
    }

    @media (max-width: 360px) {
      .info {
        padding: 22px 16px 16px;
      }

      .actions {
        padding: 16px;
      }

      .action-link {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="banner" aria-label="르노코리아 스타필드수원점 배너">
      <img src="https://raw.githubusercontent.com/renault-taauto/showroom/main/suwon_sf.png" alt="르노코리아 스타필드수원점 안내">
    </section>

    <section class="info" aria-label="지점 정보">
      <h1 class="manager">박홍준 지점장</h1>
      <p class="branch">르노코리아 스타필드수원점</p>

      <dl class="detail-list">
        <div class="detail-row">
          <dt class="detail-label">전화</dt>
          <dd class="detail-value">010-3161-1761</dd>
        </div>
        <div class="detail-row">
          <dt class="detail-label">주소</dt>
          <dd class="detail-value">경기 수원시 장안구 수성로 175</dd>
        </div>
      </dl>
    </section>

    <nav class="actions" aria-label="연락하기">
      <a class="action-link call" href="tel:01031611761" onclick="trackCall()">전화걸기</a>
      <button class="action-link sms" type="button" onclick="openSmsModal()">문자보내기</button>
    </nav>
  </main>

  <div class="modal-overlay" id="smsModal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="smsTitle">
      <h2 class="modal-title" id="smsTitle">문자 보내기</h2>
      <p class="modal-sub">선택한 내용이 문자에 함께 입력됩니다.</p>

      <label class="field">
        <span>이름</span>
        <input type="text" id="smsName" placeholder="성함을 입력해주세요">
      </label>

      <label class="field">
        <span>관심 차종</span>
        <select id="smsCar">
          <option value="">선택해주세요</option>
          <option>필랑트</option>
          <option>그랑 콜레오스</option>
          <option>아르카나</option>
        </select>
      </label>

      <label class="field">
        <span>연령대</span>
        <select id="smsAge">
          <option value="">선택해주세요</option>
          <option>20대</option>
          <option>30대</option>
          <option>40대</option>
          <option>50대</option>
          <option>60대 이상</option>
        </select>
      </label>

      <label class="field">
        <span>연락 가능 시간대</span>
        <select id="smsTime">
          <option value="">선택해주세요</option>
          <option>오전 (10시-12시)</option>
          <option>점심 (12시-14시)</option>
          <option>오후 (14시-18시)</option>
          <option>저녁 (18시-20시)</option>
          <option>언제든지 가능</option>
        </select>
      </label>

      <label class="privacy-check">
        <input type="checkbox" id="privacyAgree" onchange="updateSmsButton()">
        <span>개인정보 수집·이용에 동의합니다. (필수)</span>
      </label>

      <div class="modal-actions">
        <button class="modal-button modal-cancel" type="button" onclick="closeSmsModal()">취소</button>
        <button class="modal-button modal-confirm" id="sendSmsButton" type="button" onclick="sendSms()" disabled>문자 보내기</button>
      </div>
    </section>
  </div>

  <script>
    const phoneNumber = '01031611761';
    const WEB_APP_URL = '여기에_GAS_웹앱_URL을_넣어주세요';
    const branchInfo = {
      branch: '르노코리아 스타필드수원점',
      manager: '박홍준',
      phone: '010-3161-1761',
      address: '경기 수원시 장안구 수성로 175'
    };

    function getSessionId() {
      const key = 'suwonSfSessionId';
      let value = sessionStorage.getItem(key);

      if (!value) {
        value = Date.now().toString(36) + Math.random().toString(36).slice(2);
        sessionStorage.setItem(key, value);
      }

      return value;
    }

    function sendToSheet(type, data) {
      if (!WEB_APP_URL || WEB_APP_URL.indexOf('여기에_') === 0) {
        return;
      }

      const payload = Object.assign({
        type: type,
        page: location.href,
        referrer: document.referrer || '',
        userAgent: navigator.userAgent || '',
        sessionId: getSessionId()
      }, branchInfo, data || {});

      const body = JSON.stringify(payload);

      if (navigator.sendBeacon) {
        navigator.sendBeacon(https://script.google.com/macros/s/AKfycbyNQlTxHZTvTeqc9r5GsuMB0j39YdjSweaCMcVwWbPgXPiUDBbwiEgZdfp4VLB5yVjfsA/exec, new Blob([body], { type: 'text/plain;charset=UTF-8' }));
        return;
      }

      fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: body
      }).catch(function() {});
    }

    function trackCall() {
      sendToSheet('call', {
        event: 'call_click',
        consent: ''
      });
    }

    function openSmsModal() {
      document.getElementById('smsModal').classList.add('show');
      updateSmsButton();
      document.getElementById('smsName').focus();
    }

    function closeSmsModal() {
      document.getElementById('smsModal').classList.remove('show');
    }

    function updateSmsButton() {
      document.getElementById('sendSmsButton').disabled = !document.getElementById('privacyAgree').checked;
    }

    function sendSms() {
      const name = document.getElementById('smsName').value.trim();
      const car = document.getElementById('smsCar').value;
      const age = document.getElementById('smsAge').value;
      const time = document.getElementById('smsTime').value;
      const privacyAgree = document.getElementById('privacyAgree').checked;

      if (!name) {
        alert('이름을 입력해주세요.');
        return;
      }

      if (!car) {
        alert('관심 차종을 선택해주세요.');
        return;
      }

      if (!age) {
        alert('연령대를 선택해주세요.');
        return;
      }

      if (!time) {
        alert('연락 가능 시간대를 선택해주세요.');
        return;
      }

      if (!privacyAgree) {
        alert('개인정보 수집·이용에 동의해주세요.');
        return;
      }

      const body =
        '네이버 블로그 보고 연락드립니다.\n' +
        '이름: ' + name + '\n' +
        '관심 차종: ' + car + '\n' +
        '연령대: ' + age + '\n' +
        '연락 가능 시간대: ' + time;

      sendToSheet('sms', {
        event: 'sms_send',
        customerName: name,
        car: car,
        age: age,
        contactTime: time,
        consent: 'Y'
      });

      window.location.href = 'sms:' + phoneNumber + '?body=' + encodeURIComponent(body);
      closeSmsModal();
    }

    document.getElementById('smsModal').addEventListener('click', function(event) {
      if (event.target === this) {
        closeSmsModal();
      }
    });
  </script>
</body>
</html>
