<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>블로그 포스팅 자료 제출</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f6f7f9;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;line-height:1.5}
    .app{max-width:880px;margin:0 auto;padding:22px 14px 48px}
    h1{margin:0;font-size:24px}
    p{margin:6px 0 0;color:#697586}
    .top{display:flex;justify-content:space-between;gap:14px;align-items:flex-end}
    .status{min-height:22px;color:#697586;font-size:13px}
    .error{color:#b42318;font-weight:800}
    .bar{height:8px;background:#e5e9f0;border-radius:99px;overflow:hidden;margin:16px 0}
    .bar span{display:block;height:100%;background:#0f766e;transition:.18s}
    form{background:#fff;border:1px solid #d8dee8;border-radius:8px;box-shadow:0 14px 36px rgba(20,28,38,.08);overflow:hidden}
    .step{display:none;padding:22px}
    .step.active{display:block}
    h2{margin:0 0 16px;font-size:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:flex;flex-direction:column;gap:7px;min-width:0}
    .full{grid-column:1/-1}
    label,.label{font-weight:800;font-size:14px}
    .hint{font-size:13px;color:#697586}
    input,select,textarea{width:100%;min-height:46px;border:1px solid #d8dee8;border-radius:8px;background:#fff;color:#1f2933;padding:10px 12px;font:inherit;outline:none}
    textarea{min-height:112px;resize:vertical}
    textarea::placeholder,input::placeholder{color:#9aa4b2}
    input:focus,select:focus,textarea:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip input{position:absolute;opacity:0;pointer-events:none}
    .chip span{display:inline-flex;align-items:center;min-height:38px;border:1px solid #d8dee8;border-radius:99px;padding:8px 12px;background:#fff;font-size:14px;cursor:pointer}
    .chip input:checked+span{border-color:#0f766e;background:#eef7f5;color:#0b5f59;font-weight:800}
    .lookup{display:grid;grid-template-columns:1fr auto;gap:8px}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid #d8dee8;background:#fbfcfd}
    .btns{display:flex;gap:8px;margin-left:auto}
    button{min-height:44px;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}
    .primary{background:#0f766e;color:#fff}
    .secondary{background:#e8edf3;color:#223044}
    .ghost{background:transparent;color:#697586}
    button:disabled{opacity:.55;cursor:not-allowed}
    .result{display:none;margin-top:14px;padding:15px;border:1px solid #a7d7ce;border-radius:8px;background:#eef7f5}
    .result.active{display:block}
    .result a{color:#0b5f59;font-weight:800;word-break:break-all}
    .file-list{display:grid;gap:6px;margin-top:6px}
    .file-item{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid #d8dee8;border-radius:8px;padding:8px 10px;background:#fbfcfd;font-size:13px}
    .file-item button{min-height:30px;padding:4px 8px;background:#edf1f6;color:#44546a}
    @media(max-width:720px){
      .app{padding:16px 10px 34px}
      .top{display:block}
      h1{font-size:21px}
      .grid,.lookup{grid-template-columns:1fr}
      .step{padding:18px 14px}
      .actions{position:sticky;bottom:0;z-index:5;align-items:stretch;padding:12px}
      .btns{width:100%}
      .btns button{flex:1}
    }
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <div>
      <h1>블로그 포스팅 자료 제출</h1>
      <p>출고 후기 제작에 필요한 기본 정보와 사진을 제출합니다.</p>
    </div>
    <div class="status" id="progressText">1 / 5</div>
  </div>
  <div class="bar"><span id="progressBar"></span></div>

  <form id="briefForm">
    <!-- Step 1: 영업담당 정보 -->
    <section class="step active">
      <h2>영업담당 정보</h2>
      <div class="grid">
        <div class="field full">
          <div class="label">등록 방식</div>
          <div class="chips">
            <label class="chip"><input type="radio" name="profileMode" value="existing" checked><span>기존 불러오기</span></label>
            <label class="chip"><input type="radio" name="profileMode" value="new"><span>새로 등록</span></label>
          </div>
        </div>

        <div class="field">
          <label for="salesName">영업담당 이름 *</label>
          <div class="lookup">
            <input id="salesName" required autocomplete="name">
            <button class="secondary" type="button" id="lookupBtn">불러오기</button>
          </div>
          <div class="hint">기존 담당자는 이름 입력 후 불러오기를 누르세요.</div>
        </div>

        <div class="field">
          <label for="position">직책</label>
          <select id="position"><option value="">직책 선택</option></select>
        </div>

        <div class="field full">
          <label for="agency">대리점 *</label>
          <select id="agency" required><option value="">대리점 선택</option></select>
        </div>

        <div class="field full">
          <label for="personalUrl">본인 URL</label>
          <input id="personalUrl" type="url" inputmode="url">
        </div>

        <div class="field full">
          <label for="businessCardFile">본인명함</label>
          <input id="businessCardFile" type="file" accept="image/*">
          <input id="businessCardUrl" type="hidden">
        </div>
      </div>
    </section>

    <!-- Step 2: 차량 정보 -->
    <section class="step">
      <h2>차량 정보</h2>
      <div class="grid">
        <div class="field">
          <label for="deliveryDate">출고 날짜 *</label>
          <input id="deliveryDate" type="date" required>
        </div>

        <div class="field">
          <label for="vehicleModel">모델 *</label>
          <select id="vehicleModel" required><option value="">모델 선택</option></select>
        </div>

        <div class="field">
          <label for="trim">트림 *</label>
          <select id="trim" required><option value="">트림 선택</option></select>
        </div>

        <div class="field">
          <label for="color">색상 *</label>
          <select id="color" required><option value="">색상 선택</option></select>
        </div>

        <div class="field full">
          <label for="wheel">휠</label>
          <select id="wheel"><option value="">휠 선택</option></select>
        </div>
      </div>
    </section>

    <!-- Step 3: 사진 -->
    <section class="step">
      <h2>사진</h2>
      <div class="field">
        <label for="inspectionFiles">검수 진행 사진 *</label>
        <input id="inspectionFiles" type="file" accept="image/*" multiple>
        <div class="hint">최소 6장 이상 업로드해주세요. 추가 선택해도 기존 목록은 유지됩니다.</div>
        <div id="fileCount" class="hint">선택된 사진이 없습니다.</div>
        <div id="fileList" class="file-list"></div>
      </div>
    </section>

    <!-- Step 4: 고객 히스토리 -->
    <section class="step">
      <h2>고객 히스토리</h2>
      <div class="grid">
        <div class="field full">
          <div class="label">방문 경로</div>
          <div class="chips" id="visitRoutes"></div>
        </div>

        <div class="field full">
          <label for="customerHistory">고객과의 히스토리</label>
          <textarea id="customerHistory" placeholder="ex) 여러 차량들을 고민하시다가 마지막에 필랑트를 시승하시고 구매 확정&#10;ex2) 이전에 QM6를 타다가 그랑 콜레오스로 재구매한 고객&#10;- 고객님과의 관계가 있다면 추가 작성. (소개, 재구매 등)"></textarea>
        </div>

        <div class="field full">
          <div class="label">만족포인트</div>
          <div class="chips" id="satisfactionPoints"></div>
        </div>

        <div class="field full">
          <label for="deliveryMood">차량 인도 분위기</label>
          <textarea id="deliveryMood" placeholder="예시) 색상 만족도가 매우 높았음, 첫차라 매우 설렘, 가족들이 모두 만족 등"></textarea>
        </div>
      </div>
    </section>

    <!-- Step 5: 제출 확인 -->
    <section class="step">
      <h2>제출 확인</h2>
      <div id="reviewBox" class="result active"></div>
      <div id="resultBox" class="result"></div>
    </section>

    <div class="actions">
      <div id="statusText" class="status"></div>
      <div class="btns">
        <button class="ghost" type="button" id="prevBtn" style="display:none">이전</button>
        <button class="primary" type="button" id="nextBtn">다음</button>
        <button class="primary" type="submit" id="submitBtn" style="display:none">제출</button>
      </div>
    </div>
  </form>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw1lGs5ibJxnS_fAwTbQLUv7nt-jxkjKUefawn0qgm8fD4i-5WOqc1XZglM6aw40hkv/exec';

const state = {
  step: 0,
  total: 5,
  options: null,
  salespersonId: '',
  submitting: false,
  inspectionFiles: []
};

const $ = id => document.getElementById(id);

document.addEventListener('DOMContentLoaded', init);

async function init() {
  $('deliveryDate').value = new Date().toISOString().slice(0, 10);
  $('prevBtn').onclick = prevStep;
  $('nextBtn').onclick = nextStep;
  $('lookupBtn').onclick = lookupSalesperson;

  document.querySelectorAll('input[name="profileMode"]').forEach(input => {
    input.onchange = syncProfileMode;
  });

  $('vehicleModel').onchange = refreshVehicleChildren;
  $('trim').onchange = refreshWheels;
  $('inspectionFiles').onchange = addInspectionFiles;
  $('briefForm').onsubmit = submitForm;

  // ── 초기 상태 적용 (기존 불러오기가 기본 체크이므로 버튼 보임)
  syncProfileMode();
  renderStep();

  try {
    setStatus('선택지를 불러오는 중입니다.');
    const res = await apiGet({ action: 'options' });
    if (!res.ok) throw new Error(res.error || '선택지를 불러오지 못했습니다.');
    state.options = res.data;
    populate(res.data);
    setStatus('');
  } catch (error) {
    // API 실패 시 폼은 계속 사용 가능하도록 에러만 표시
    showError('선택지를 불러오지 못했습니다. 네트워크를 확인하거나 직접 입력해주세요.');
  }
}

function populate(o) {
  fillSelect('agency', [...(o.agencies || [])].sort((a, b) => a.localeCompare(b, 'ko')), '대리점 선택');
  fillSelect('position', o.positions || [], '직책 선택');
  fillSelect('vehicleModel', Object.keys(o.vehicles || {}), '모델 선택');
  renderChecks('visitRoutes', 'visitRoutes', o.visitRoutes || []);
  renderChecks('satisfactionPoints', 'satisfactionPoints', o.satisfactionPoints || []);
  refreshVehicleChildren();
}

function fillSelect(id, values, placeholder) {
  $(id).innerHTML = `<option value="">${esc(placeholder)}</option>` +
    (values || []).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
}

function renderChecks(containerId, name, values) {
  $(containerId).innerHTML = (values || []).map(v =>
    `<label class="chip"><input type="checkbox" name="${name}" value="${esc(v)}"><span>${esc(v)}</span></label>`
  ).join('');
}

// ── 핵심 수정: 새로 등록 선택 시 불러오기 버튼 숨김
function syncProfileMode() {
  const mode = document.querySelector('input[name="profileMode"]:checked').value;
  const lookupBtn = $('lookupBtn');

  if (mode === 'new') {
    lookupBtn.style.display = 'none';
    state.salespersonId = '';
  } else {
    lookupBtn.style.display = '';
  }
}

async function lookupSalesperson() {
  const name = $('salesName').value.trim();
  if (!name) return showError('영업담당 이름을 먼저 입력해주세요.');

  try {
    setStatus('영업담당 정보를 불러오는 중입니다.');
    const res = await apiGet({ action: 'findSalesperson', name });
    if (!res.ok) throw new Error(res.error || '영업담당 정보를 불러오지 못했습니다.');
    const matches = res.data || [];

    if (!matches.length) {
      state.salespersonId = '';
      document.querySelector('input[name="profileMode"][value="new"]').checked = true;
      syncProfileMode();
      setStatus('기존 기록이 없습니다. 새로 등록으로 진행할 수 있습니다.');
      return;
    }

    const p = matches[0];
    state.salespersonId = p.id;
    $('salesName').value = p.name || name;
    setValueIfExists('position', p.position);
    setValueIfExists('agency', p.agency);
    $('personalUrl').value = p.personalUrl || '';
    $('businessCardUrl').value = p.businessCardUrl || '';
    document.querySelector('input[name="profileMode"][value="existing"]').checked = true;
    syncProfileMode();
    setStatus('기존 영업담당 정보를 불러왔습니다.');
  } catch (error) {
    showError(error);
  }
}

function setValueIfExists(id, value) {
  if (value && [...$(id).options].some(o => o.value === value)) $(id).value = value;
}

function refreshVehicleChildren() {
  const vehicle = state.options && state.options.vehicles[$('vehicleModel').value];
  fillSelect('trim', vehicle ? vehicle.trims : [], '트림 선택');
  fillSelect('color', vehicle ? vehicle.colors : [], '색상 선택');
  refreshWheels();
}

function refreshWheels() {
  const model = $('vehicleModel').value;
  const trim = $('trim').value;
  const vehicle = state.options && state.options.vehicles[model];
  let wheels = vehicle ? vehicle.wheels : [];

  if (model.includes('그랑 콜레오스') && (trim === '에스카파드' || trim === '에스카파드 4WD')) {
    wheels = ['20" 다크 틴티드 하이랜드 알로이 휠', '20" 다크 틴티드 투톤 피크 알로이 휠'];
  }

  fillSelect('wheel', wheels, '휠 선택');
}

function addInspectionFiles() {
  [...$('inspectionFiles').files].forEach(file => {
    const key = `${file.name}_${file.size}_${file.lastModified}`;
    if (!state.inspectionFiles.some(item => item.key === key)) {
      state.inspectionFiles.push({ key, file });
    }
  });
  $('inspectionFiles').value = '';
  renderFileList();
}

function renderFileList() {
  $('fileCount').textContent = state.inspectionFiles.length
    ? `${state.inspectionFiles.length}장 선택됨`
    : '선택된 사진이 없습니다.';
  $('fileList').innerHTML = state.inspectionFiles.map((item, index) => `
    <div class="file-item">
      <span>${index + 1}. ${esc(item.file.name)}</span>
      <button type="button" onclick="removeInspectionFile(${index})">삭제</button>
    </div>
  `).join('');
}

function removeInspectionFile(index) {
  state.inspectionFiles.splice(index, 1);
  renderFileList();
}

function nextStep() {
  if (validateCurrentStep() && state.step < state.total - 1) {
    state.step++;
    renderStep();
  }
}

function prevStep() {
  if (state.step > 0) {
    state.step--;
    renderStep();
  }
}

function renderStep() {
  document.querySelectorAll('.step').forEach((s, i) => s.classList.toggle('active', i === state.step));
  $('progressText').textContent = `${state.step + 1} / ${state.total}`;
  $('progressBar').style.width = `${(state.step + 1) / state.total * 100}%`;
  $('prevBtn').style.display = state.step ? '' : 'none';
  $('nextBtn').style.display = state.step === state.total - 1 ? 'none' : '';
  $('submitBtn').style.display = state.step === state.total - 1 ? '' : 'none';
  if (state.step === state.total - 1) renderReview();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function validateCurrentStep() {
  clearError();
  const active = document.querySelector('.step.active');

  for (const field of active.querySelectorAll('[required]')) {
    if (!field.value) {
      field.focus();
      showError('필수 항목을 입력해주세요.');
      return false;
    }
  }

  if (state.step === 2 && state.inspectionFiles.length < 6) {
    showError('검수 진행 사진은 최소 6장 이상 선택해주세요.');
    return false;
  }

  return true;
}

function renderReview() {
  $('reviewBox').innerHTML = `
    <b>${esc($('salesName').value || '-')}</b> / ${esc($('agency').value || '-')} / ${esc($('position').value || '-')}<br>
    ${esc($('vehicleModel').value || '-')} ${esc($('trim').value || '')} ${esc($('color').value || '')}<br>
    사진: ${state.inspectionFiles.length}장
  `;
}

async function submitForm(event) {
  event.preventDefault();
  if (!validateCurrentStep() || state.submitting) return;

  state.submitting = true;
  $('submitBtn').disabled = true;
  setStatus('사진을 준비하고 제출하는 중입니다.');

  try {
    const payload = await buildPayload();
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    const result = await res.json();
    if (!result.ok) throw new Error(result.error || '제출에 실패했습니다.');

    showResult(result.data);
    setStatus('');
  } catch (error) {
    showError(error);
  } finally {
    state.submitting = false;
    $('submitBtn').disabled = false;
  }
}

async function buildPayload() {
  const card = $('businessCardFile').files[0];

  return {
    salespersonId: state.salespersonId,
    salesName: $('salesName').value.trim(),
    position: $('position').value,
    agency: $('agency').value,
    personalUrl: $('personalUrl').value.trim(),
    businessCardUrl: $('businessCardUrl').value.trim(),
    businessCardFile: card ? await fileToPayload(card) : null,
    deliveryDate: $('deliveryDate').value,
    vehicleModel: $('vehicleModel').value,
    trim: $('trim').value,
    color: $('color').value,
    wheel: $('wheel').value,
    inspectionFiles: await Promise.all(state.inspectionFiles.map(item => fileToPayload(item.file))),
    visitRoutes: checkedValues('visitRoutes'),
    customerHistory: $('customerHistory').value.trim(),
    satisfactionPoints: checkedValues('satisfactionPoints'),
    deliveryMood: $('deliveryMood').value.trim()
  };
}

function checkedValues(name) {
  return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(input => input.value);
}

function fileToPayload(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({
      name: file.name,
      mimeType: file.type || 'application/octet-stream',
      data: reader.result
    });
    reader.onerror = () => reject(new Error(`${file.name} 파일을 읽지 못했습니다.`));
    reader.readAsDataURL(file);
  });
}

function showResult(result) {
  $('resultBox').innerHTML = `
    <b>${esc(result.message || '제출이 완료되었습니다.')}</b>
    ${result.resultFolderUrl ? `<p><a href="${esc(result.resultFolderUrl)}" target="_blank" rel="noopener">결과물 폴더 열기</a></p>` : ''}
    <p>제목: ${esc(result.deliveryTitle || '')}</p>
    <p><button type="button" class="primary" onclick="resetFormForNewSubmission()">추가 제출</button></p>
  `;
  $('resultBox').classList.add('active');
  $('submitBtn').disabled = true;
}

// ── 핵심 수정: 함수가 전역 스코프에 위치해야 onclick에서 호출 가능
function resetFormForNewSubmission() {
  document.getElementById('briefForm').reset();

  state.step = 0;
  state.salespersonId = '';
  state.submitting = false;
  state.inspectionFiles = [];

  renderFileList();
  clearError();

  $('resultBox').classList.remove('active');
  $('resultBox').innerHTML = '';

  $('deliveryDate').value = new Date().toISOString().slice(0, 10);

  refreshVehicleChildren();
  syncProfileMode();
  renderStep();
}

async function apiGet(params) {
  const url = new URL(API_URL);
  Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
  const res = await fetch(url.toString());
  return res.json();
}

function setStatus(message) {
  $('statusText').className = 'status';
  $('statusText').textContent = message || '';
}

function showError(error) {
  $('statusText').className = 'status error';
  $('statusText').textContent = error && error.message ? error.message : String(error);
}

function clearError() {
  if ($('statusText').classList.contains('error')) setStatus('');
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  }[c]));
}
</script>
</body>
</html>
