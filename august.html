<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>시승 가능 차량 리스트</title>
  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      color: #111;
      background: #fff;
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      word-break: keep-all;
    }

    button { font: inherit; }

    .promotion-heading {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 13px 16px 11px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -.03em;
    }

    .hero-carousel {
      position: relative;
      width: min(100%, 560px);
      margin: 0 auto;
      overflow: hidden;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .hero-track {
      display: flex;
      transition: transform .42s ease;
      will-change: transform;
    }

    .hero-slide {
      display: block;
      width: 100%;
      min-width: 100%;
      height: auto;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .hero-pagination {
      position: absolute;
      left: 50%;
      bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(70, 70, 70, .48);
    }

    .hero-pagination[hidden] { display: none; }

    .hero-dot {
      width: 6px;
      height: 6px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .hero-dot[aria-current="true"] {
      border-color: #fff;
      background: #111;
    }

    .hero-toggle {
      width: 15px;
      height: 11px;
      margin-left: 1px;
      padding: 0 0 0 4px;
      border: 0;
      border-left: 1px solid rgba(255, 255, 255, .65);
      color: #fff;
      background: transparent;
      font-size: 8px;
      line-height: 11px;
      cursor: pointer;
    }

    .wrap {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 11px 18px 38px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.35;
      letter-spacing: -.04em;
    }

    .guide {
      width: fit-content;
      max-width: 100%;
      margin: 24px auto 0;
      font-size: clamp(8px, 2.7vw, 13px);
      line-height: 1.5;
      white-space: nowrap;
    }

    .model-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 5px;
    }

    .model-button,
    .vehicle-button,
    .dealer-button {
      padding: 0;
      border: 0;
      border-radius: 0;
      color: #111;
      background: transparent;
      text-decoration: none;
      cursor: pointer;
    }

    .model-column { min-width: 0; }

    .model-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 5px;
      object-fit: contain;
    }

    .model-button {
      min-height: 32px;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.25;
    }

    .model-button[aria-expanded="true"] { font-weight: 800; }

    .model-button:focus-visible,
    .vehicle-button:focus-visible,
    .dealer-button:focus-visible {
      outline: 2px solid #111;
      outline-offset: 4px;
    }

    .vehicles {
      margin-top: 0;
    }

    .vehicle-row { margin: 7px 0; }

    .vehicle-button {
      font-size: 16px;
      line-height: 1.4;
    }

    .dealers {
      margin: 7px 0 13px;
      font-size: 13px;
    }

    .dealer-button {
      display: block;
      margin: 7px auto;
    }

    .alert-layer[hidden] { display: none; }

    .alert-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .42);
    }

    .alert-box {
      width: min(100%, 310px);
      padding: 22px 20px 17px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .22);
    }

    .alert-box h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
    }

    .alert-dealers .dealer-button {
      width: 100%;
      min-height: 42px;
      margin: 0;
      border-top: 1px solid #e5e5e5;
      font-weight: 700;
    }

    .alert-close {
      width: 100%;
      min-height: 38px;
      margin-top: 5px;
      border: 0;
      color: #777;
      background: transparent;
      font-size: 13px;
      cursor: pointer;
    }

    @media (max-width: 390px) {
      .wrap { padding-inline: 11px; }
      h1 { font-size: 25px; }
      .model-list { gap: 4px; }
      .model-button { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header class="promotion-heading">르노코리아 진행중인 프로모션</header>
  <section id="heroCarousel" class="hero-carousel" aria-label="시승 서비스 안내 이미지">
    <div id="heroTrack" class="hero-track"></div>
    <div id="heroPagination" class="hero-pagination" aria-label="배너 선택"></div>
  </section>
  <main class="wrap">
    <h1>시승 가능 차량 리스트</h1>

    <div id="modelList" class="model-list" aria-label="차종 선택"></div>
    <p class="guide">* 원하시는 차량의 기종, 색상을 누르면 바로 시승신청 링크로 넘어갑니다.</p>
  </main>

  <div id="dealerAlert" class="alert-layer" hidden>
    <section class="alert-box" role="dialog" aria-modal="true" aria-labelledby="alertTitle">
      <h2 id="alertTitle">대리점을 선택해주세요</h2>
      <div id="alertDealers" class="alert-dealers"></div>
      <button id="alertClose" class="alert-close" type="button">취소</button>
    </section>
  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPV1qjf5Z9vt8BtoGNUTtkVCHjF2GjY1U4Y0xadZ-lASg59WJZgUkPUI9KoaOFwdySlw/exec';
    const CACHE_KEY = 'renault-test-drive-vehicles-v1';
    const HEADER_IMAGE_BASE = 'https://raw.githubusercontent.com/renault-taauto/showroom/main/renault/';
    const HEADER_IMAGES = [
      HEADER_IMAGE_BASE + '1.png',
      HEADER_IMAGE_BASE + '2.png',
      HEADER_IMAGE_BASE + '3.png'
    ];

    const heroCarousel = document.getElementById('heroCarousel');
    const heroTrack = document.getElementById('heroTrack');
    const heroPagination = document.getElementById('heroPagination');
    const modelList = document.getElementById('modelList');
    const dealerAlert = document.getElementById('dealerAlert');
    const alertDealers = document.getElementById('alertDealers');
    const alertClose = document.getElementById('alertClose');
    const MODEL_ORDER = ['필랑트', '그랑 콜레오스', '아르카나'];
    const MODEL_IMAGES = {
      '필랑트': 'https://raw.githubusercontent.com/renault-taauto/showroom/main/renault/filante.png',
      '그랑 콜레오스': 'https://raw.githubusercontent.com/renault-taauto/showroom/main/renault/koleos.png',
      '아르카나': 'https://raw.githubusercontent.com/renault-taauto/showroom/main/renault/arkana.png'
    };
    const FALLBACK_DEALER_URLS = {
      '구리대리점': 'https://e-renaultkorea.com/?s=794',
      '중랑대리점': 'https://e-renaultkorea.com/?s=845',
      '의정부금오대리점': 'https://e-renaultkorea.com/?s=750',
      '노원대리점': 'https://e-renaultkorea.com/?s=788'
    };
    const INITIAL_VEHICLES = [
      { model: '그랑 콜레오스 그레이', fuel: '', color: '', dealers: [{ name: '구리대리점', url: '' }] },
      { model: '그랑 콜레오스 화이트', fuel: '', color: '', dealers: [{ name: '구리대리점', url: '' }] },
      { model: '아르카나', fuel: '하이브리드', color: '화이트', dealers: [{ name: '구리대리점', url: '' }] },
      { model: '필랑트 블랙', fuel: '', color: '', dealers: [{ name: '중랑대리점', url: '' }] },
      { model: '필랑트', fuel: '하이브리드', color: '블랙', dealers: [
        { name: '구리대리점', url: '' },
        { name: '중랑대리점', url: '' }
      ] }
    ];
    let vehicles = [];
    let heroIndex = 0;
    let heroTimer = null;
    let heroToggle = null;
    let heroUserPaused = false;
    let swipeStartX = null;

    function setupHeroCarousel() {
      stopHeroTimer();
      heroIndex = 0;
      const slideUrls = HEADER_IMAGES.length > 1
        ? [...HEADER_IMAGES, HEADER_IMAGES[0]]
        : HEADER_IMAGES;

      heroTrack.replaceChildren(...slideUrls.map((url, index) => {
        const image = document.createElement('img');
        image.className = 'hero-slide';
        image.src = url;
        image.alt = '르노 시승 서비스 안내 ' + (index + 1);
        image.draggable = false;
        if (index === 0) image.fetchPriority = 'high';
        return image;
      }));

      const dots = HEADER_IMAGES.map((url, index) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'hero-dot';
        dot.setAttribute('aria-label', (index + 1) + '번 배너 보기');
        dot.addEventListener('click', event => {
          event.stopPropagation();
          showHero(index);
          restartHeroTimer();
        });
        return dot;
      });

      heroToggle = document.createElement('button');
      heroToggle.type = 'button';
      heroToggle.className = 'hero-toggle';
      heroToggle.textContent = heroUserPaused ? '▶' : 'Ⅱ';
      heroToggle.setAttribute('aria-label', heroUserPaused ? '자동 재생 시작' : '자동 재생 정지');
      heroToggle.addEventListener('click', event => {
        event.stopPropagation();
        heroUserPaused = !heroUserPaused;
        heroToggle.textContent = heroUserPaused ? '▶' : 'Ⅱ';
        heroToggle.setAttribute('aria-label', heroUserPaused ? '자동 재생 시작' : '자동 재생 정지');
        if (heroUserPaused) stopHeroTimer();
        else startHeroTimer();
      });

      heroPagination.replaceChildren(...dots, heroToggle);

      heroPagination.hidden = HEADER_IMAGES.length < 2;
      showHero(0);
      startHeroTimer();
    }

    async function discoverAdditionalHeaderImages() {
      for (let number = HEADER_IMAGES.length + 1; number <= 20; number += 1) {
        const url = HEADER_IMAGE_BASE + number + '.png';
        const exists = await imageExists(url);
        if (!exists) break;
        HEADER_IMAGES.push(url);
      }

      if (HEADER_IMAGES.length > 3) setupHeroCarousel();
    }

    function imageExists(url) {
      return new Promise(resolve => {
        const image = new Image();
        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);
        image.src = url + '?check=' + Math.floor(Date.now() / 300000);
      });
    }

    function showHero(index) {
      if (!HEADER_IMAGES.length) return;
      heroIndex = (index + HEADER_IMAGES.length) % HEADER_IMAGES.length;
      heroTrack.style.transition = 'transform .42s ease';
      heroTrack.style.transform = 'translateX(-' + (heroIndex * 100) + '%)';
      updateHeroDots();
    }

    function updateHeroDots() {
      heroPagination.querySelectorAll('.hero-dot').forEach((dot, dotIndex) => {
        dot.setAttribute('aria-current', String(dotIndex === heroIndex));
      });
    }

    function advanceHero() {
      if (HEADER_IMAGES.length < 2) return;

      if (heroIndex < HEADER_IMAGES.length - 1) {
        showHero(heroIndex + 1);
        return;
      }

      heroIndex = 0;
      updateHeroDots();
      heroTrack.style.transition = 'transform .42s ease';
      heroTrack.style.transform = 'translateX(-' + (HEADER_IMAGES.length * 100) + '%)';

      setTimeout(() => {
        heroTrack.style.transition = 'none';
        heroTrack.style.transform = 'translateX(0)';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            heroTrack.style.transition = 'transform .42s ease';
          });
        });
      }, 430);
    }

    function startHeroTimer() {
      if (HEADER_IMAGES.length < 2 || heroTimer || heroUserPaused) return;
      heroTimer = setInterval(advanceHero, 3000);
    }

    function stopHeroTimer() {
      clearInterval(heroTimer);
      heroTimer = null;
    }

    function restartHeroTimer() {
      stopHeroTimer();
      startHeroTimer();
    }

    heroCarousel.addEventListener('pointerdown', event => {
      swipeStartX = event.clientX;
      stopHeroTimer();
    });

    heroCarousel.addEventListener('pointerup', event => {
      if (swipeStartX !== null) {
        const distance = event.clientX - swipeStartX;
        if (Math.abs(distance) >= 38) {
          if (distance < 0) advanceHero();
          else showHero(heroIndex - 1);
        }
      }
      swipeStartX = null;
      startHeroTimer();
    });

    heroCarousel.addEventListener('pointercancel', () => {
      swipeStartX = null;
      startHeroTimer();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopHeroTimer();
      else startHeroTimer();
    });

    window.receiveVehicleData = function (result) {
      document.getElementById('vehicleDataScript')?.remove();

      if (!result || !result.ok) return;

      vehicles = Array.isArray(result.vehicles)
        ? mergeDuplicateVehicles(result.vehicles.map(normalizeVehicle))
        : [];
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(result.vehicles || [])); } catch (error) {}
      renderModels();
    };

    function loadVehicles() {
      const script = document.createElement('script');
      script.id = 'vehicleDataScript';
      script.src = GAS_WEB_APP_URL + '?callback=receiveVehicleData&_=' + Date.now();
      script.onerror = function () {};
      document.head.appendChild(script);
    }

    function renderModels() {
      const availableModels = new Set(vehicles.map(vehicle => vehicle.model).filter(Boolean));
      const models = [
        ...MODEL_ORDER.filter(model => availableModels.has(model)),
        ...[...availableModels]
          .filter(model => !MODEL_ORDER.includes(model))
          .sort((a, b) => a.localeCompare(b, 'ko'))
      ];

      modelList.replaceChildren(...models.map(model => {
        const column = document.createElement('div');
        column.className = 'model-column';

        const image = document.createElement('img');
        image.className = 'model-image';
        image.src = MODEL_IMAGES[model] || '';
        image.alt = model;
        image.decoding = 'async';
        if (!MODEL_IMAGES[model]) image.hidden = true;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'model-button';
        button.textContent = model;
        button.setAttribute('aria-expanded', 'false');

        const vehicleArea = document.createElement('div');
        vehicleArea.className = 'vehicles';
        vehicleArea.hidden = true;

        button.addEventListener('click', () => toggleModel(model, button, vehicleArea));
        column.append(image, button, vehicleArea);
        return column;
      }));

    }

    function toggleModel(model, button, vehicleArea) {
      trackEvent({ event: 'click', target: 'model', model });
      const willOpen = button.getAttribute('aria-expanded') !== 'true';
      modelList.querySelectorAll('.model-button').forEach(item => item.setAttribute('aria-expanded', 'false'));
      modelList.querySelectorAll('.vehicles').forEach(area => {
        area.hidden = true;
        area.replaceChildren();
      });
      if (!willOpen) return;

      const selected = vehicles.filter(vehicle => vehicle.model === model);
      selected.sort((a, b) => vehicleDisplayName(a).localeCompare(vehicleDisplayName(b), 'ko'));
      button.setAttribute('aria-expanded', 'true');
      vehicleArea.hidden = false;
      vehicleArea.replaceChildren(...selected.map(createVehicleRow));
    }

    function normalizeVehicle(vehicle) {
      const item = {
        ...vehicle,
        dealers: Array.isArray(vehicle.dealers)
          ? vehicle.dealers.map(dealer => ({
              ...dealer,
              url: dealer.url || FALLBACK_DEALER_URLS[String(dealer.name || '').trim()] || ''
            }))
          : []
      };
      const rawModel = String(item.model || '').trim();

      if (rawModel === '콜레오스') {
        item.model = '그랑 콜레오스';
      } else if (rawModel.startsWith('콜레오스 ')) {
        item.model = '그랑 콜레오스';
        item.color = [rawModel.slice('콜레오스 '.length), item.color]
          .filter(Boolean).join(' ');
      } else {
        const knownModel = MODEL_ORDER.find(model => rawModel === model || rawModel.startsWith(model + ' '));
        if (knownModel && rawModel !== knownModel) {
          item.model = knownModel;
          item.color = [rawModel.slice(knownModel.length).trim(), item.color]
          .filter(Boolean).join(' ');
        }
      }

      if (item.model === '필랑트') {
        item.fuel = '하이브리드';
      } else if (
        (item.model === '그랑 콜레오스' || item.model === '아르카나') &&
        !item.fuel
      ) {
        item.fuel = '가솔린';
      }

      return item;
    }

    function mergeDuplicateVehicles(items) {
      const merged = new Map();

      items.forEach(vehicle => {
        const key = [vehicle.model, vehicle.fuel, vehicle.color]
          .map(value => String(value || '').trim().toLowerCase())
          .join('|');

        if (!merged.has(key)) {
          merged.set(key, { ...vehicle, dealers: [] });
        }

        const target = merged.get(key);
        (vehicle.dealers || []).forEach(dealer => {
          if (!target.dealers.some(saved => saved.name === dealer.name)) {
            target.dealers.push(dealer);
          }
        });
      });

      return [...merged.values()];
    }

    function createVehicleRow(vehicle) {
      const row = document.createElement('div');
      row.className = 'vehicle-row';

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'vehicle-button';
      button.textContent = vehicleDisplayName(vehicle);

      button.addEventListener('click', function () {
        const dealers = Array.isArray(vehicle.dealers) ? vehicle.dealers : [];
        const linkedDealers = dealers.filter(dealer => dealer.url);

        if (dealers.length === 1 && linkedDealers.length === 1) {
          goToDealer(vehicle, linkedDealers[0]);
          return;
        }

        trackEvent({
          event: 'click', target: 'vehicle', model: vehicle.model,
          fuel: vehicle.fuel, color: vehicle.color
        });
        showDealerAlert(vehicle, linkedDealers);
      });

      row.appendChild(button);
      return row;
    }

    function vehicleDisplayName(vehicle) {
      return [vehicle.fuel, vehicle.color].filter(Boolean).join(' ') || '시승 신청';
    }

    function showDealerAlert(vehicle, dealers) {
      alertDealers.replaceChildren();
      dealers.forEach(dealer => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'dealer-button';
        button.textContent = dealer.name;
        button.addEventListener('click', () => goToDealer(vehicle, dealer));
        alertDealers.appendChild(button);
      });
      dealerAlert.hidden = false;
      document.body.style.overflow = 'hidden';
      alertClose.focus();
    }

    function closeDealerAlert() {
      dealerAlert.hidden = true;
      document.body.style.overflow = '';
    }

    function goToDealer(vehicle, dealer) {
      trackEvent({
        event: 'click', target: 'dealer', model: vehicle.model,
        fuel: vehicle.fuel, color: vehicle.color,
        dealer: dealer.name, url: dealer.url
      }, () => { window.location.href = dealer.url; });
    }

    function trackEvent(data, callback) {
      const callbackName = 'trackingCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      let finished = false;

      const finish = function () {
        if (finished) return;
        finished = true;
        script.remove();
        try { delete window[callbackName]; } catch (error) {}
        if (callback) callback();
      };

      window[callbackName] = finish;
      const params = new URLSearchParams({
        action: 'track',
        callback: callbackName,
        page: location.href,
        ...data
      });
      script.src = GAS_WEB_APP_URL + '?' + params.toString();
      script.onerror = finish;
      document.head.appendChild(script);
      setTimeout(finish, callback ? 450 : 3000);
    }

    function loadInitialVehicles() {
      let initialData = INITIAL_VEHICLES;
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
        if (Array.isArray(cached) && cached.length) {
          initialData = cached;
        }
      } catch (error) {}

      vehicles = mergeDuplicateVehicles(initialData.map(normalizeVehicle));
      renderModels();
    }

    setupHeroCarousel();
    discoverAdditionalHeaderImages();
    loadInitialVehicles();
    loadVehicles();
    trackEvent({ event: 'view', target: 'page' });

    alertClose.addEventListener('click', closeDealerAlert);
    dealerAlert.addEventListener('click', event => {
      if (event.target === dealerAlert) closeDealerAlert();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !dealerAlert.hidden) closeDealerAlert();
    });
  </script>
</body>
</html>
