<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>시승 가능 차량 리스트</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #6f6f6f;
      --line: #dedede;
      --soft: #f5f5f3;
      --accent: #f3d51c;
      --accent-ink: #1b1b1b;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #ececea;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 540px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: 30px 20px calc(36px + env(safe-area-inset-bottom));
      background: #fff;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7.5vw, 36px);
      line-height: 1.18;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .model-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 25px 0 0;
    }

    .model-tab {
      min-height: 54px;
      padding: 11px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .model-tab:active { transform: scale(.98); }

    .model-tab[aria-selected="true"] {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .model-tab:focus-visible,
    .vehicle-card:focus-visible,
    .dealer-button:focus-visible,
    .modal-close:focus-visible {
      outline: 3px solid rgba(243, 213, 28, .75);
      outline-offset: 2px;
    }

    .results {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .results-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .results-title h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -.03em;
    }

    .count { color: var(--muted); font-size: 13px; }

    .vehicle-list { display: grid; gap: 10px; }

    .vehicle-card {
      width: 100%;
      padding: 17px 46px 17px 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      position: relative;
      text-align: left;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
    }

    .vehicle-card::after {
      content: "›";
      position: absolute;
      top: 50%;
      right: 18px;
      transform: translateY(-53%);
      font-size: 30px;
      font-weight: 300;
    }

    .vehicle-name { display: block; font-size: 17px; font-weight: 800; }
    .vehicle-meta { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; }

    .state {
      min-height: 130px;
      display: grid;
      place-items: center;
      padding: 24px;
      border-radius: 14px;
      text-align: center;
      color: var(--muted);
      background: var(--soft);
      font-size: 14px;
      line-height: 1.6;
    }

    .state.error { color: var(--danger); }

    .modal[hidden] { display: none; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      align-items: end;
      background: rgba(0, 0, 0, .48);
    }

    .modal-panel {
      width: min(100%, 540px);
      max-height: 78dvh;
      margin: 0 auto;
      overflow: auto;
      padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
      border-radius: 22px 22px 0 0;
      background: #fff;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, .18);
    }

    .modal-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
    }

    .modal-head h2 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
    .modal-copy { margin: 7px 0 18px; color: var(--muted); font-size: 14px; }

    .modal-close {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border: 0;
      border-radius: 50%;
      background: var(--soft);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .dealer-list { display: grid; gap: 9px; }

    .dealer-button {
      width: 100%;
      min-height: 54px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-align: left;
      color: var(--accent-ink);
      background: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    .dealer-button:first-child { border-color: var(--accent); background: #fffdee; }
    .dealer-button[disabled] { color: #999; background: var(--soft); cursor: not-allowed; }

    @media (min-width: 541px) {
      body { padding: 28px 0; }
      .app { min-height: calc(100dvh - 56px); border-radius: 22px; box-shadow: 0 12px 45px rgba(0,0,0,.09); }
      .modal { align-items: center; padding: 24px; }
      .modal-panel { border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">RENAULT TEST DRIVE</p>
    <h1>시승 가능 차량 리스트</h1>
    <p class="intro">원하시는 차종을 선택해 주세요. 차량을 누르면 해당 대리점의 시승 신청 페이지로 이동합니다.</p>

    <div id="modelTabs" class="model-tabs" role="tablist" aria-label="차종 선택"></div>

    <section class="results" aria-live="polite">
      <div class="results-title">
        <h2 id="resultHeading">차량을 선택해 주세요</h2>
        <span id="resultCount" class="count"></span>
      </div>
      <div id="vehicleList" class="vehicle-list">
        <div class="state">시승 가능 차량 정보를 불러오는 중입니다.</div>
      </div>
    </section>
  </main>

  <div id="dealerModal" class="modal" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">대리점 선택</h2>
          <p id="modalCopy" class="modal-copy"></p>
        </div>
        <button id="modalClose" class="modal-close" type="button" aria-label="닫기">×</button>
      </div>
      <div id="dealerList" class="dealer-list"></div>
    </section>
  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxPV1qjf5Z9vt8BtoGNUTtkVCHjF2GjY1U4Y0xadZ-lASg59WJZgUkPUI9KoaOFwdySlw/exec';

    const state = { vehicles: [], selectedModel: '' };
    const tabsEl = document.getElementById('modelTabs');
    const listEl = document.getElementById('vehicleList');
    const headingEl = document.getElementById('resultHeading');
    const countEl = document.getElementById('resultCount');
    const modalEl = document.getElementById('dealerModal');
    const modalCopyEl = document.getElementById('modalCopy');
    const dealerListEl = document.getElementById('dealerList');
    const closeEl = document.getElementById('modalClose');
    let lastFocusedElement = null;

    window.receiveVehicleData = function (data) {
      document.getElementById('gasJsonp')?.remove();
      if (!data || !data.ok) {
        showError(data?.message || '차량 정보를 불러오지 못했습니다.');
        return;
      }
      state.vehicles = Array.isArray(data.vehicles) ? data.vehicles : [];
      renderModelTabs();
      showInitialState();
    };

    function loadVehicles() {
      if (GAS_WEB_APP_URL.includes('여기에_배포_ID')) {
        showError('index.html의 GAS_WEB_APP_URL을 배포 주소로 교체해 주세요.');
        return;
      }
      const script = document.createElement('script');
      script.id = 'gasJsonp';
      script.src = GAS_WEB_APP_URL + '?callback=receiveVehicleData&t=' + Date.now();
      script.onerror = function () { showError('차량 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); };
      document.head.appendChild(script);
    }

    function renderModelTabs() {
      const models = [...new Set(state.vehicles.map(item => item.model))]
        .filter(Boolean)
        .sort((a, b) => a.localeCompare(b, 'ko'));

      tabsEl.replaceChildren(...models.map(model => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'model-tab';
        button.role = 'tab';
        button.textContent = model;
        button.setAttribute('aria-selected', 'false');
        button.addEventListener('click', () => selectModel(model));
        return button;
      }));

      if (!models.length) showError('현재 등록된 시승 가능 차량이 없습니다.');
    }

    function selectModel(model) {
      state.selectedModel = model;
      [...tabsEl.children].forEach(tab => {
        tab.setAttribute('aria-selected', String(tab.textContent === model));
      });

      const vehicles = state.vehicles.filter(item => item.model === model);
      headingEl.textContent = model + ' 시승 가능 차량';
      countEl.textContent = vehicles.length + '종';

      if (!vehicles.length) {
        listEl.innerHTML = '<div class="state">현재 시승 가능한 차량이 없습니다.</div>';
        return;
      }

      listEl.replaceChildren(...vehicles.map(createVehicleCard));
    }

    function createVehicleCard(vehicle) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'vehicle-card';

      const name = document.createElement('span');
      name.className = 'vehicle-name';
      name.textContent = [vehicle.fuel, vehicle.color].filter(Boolean).join(' · ') || vehicle.model;

      const meta = document.createElement('span');
      meta.className = 'vehicle-meta';
      meta.textContent = vehicle.dealers.length > 1
        ? vehicle.dealers.length + '개 대리점에서 시승 가능'
        : (vehicle.dealers[0]?.name || '대리점 정보 확인 필요');

      button.append(name, meta);
      button.addEventListener('click', () => chooseVehicle(vehicle, button));
      return button;
    }

    function chooseVehicle(vehicle, sourceButton) {
      const validDealers = vehicle.dealers.filter(dealer => dealer.url);
      if (vehicle.dealers.length === 1 && validDealers.length === 1) {
        goToDealer(validDealers[0].url);
        return;
      }

      lastFocusedElement = sourceButton;
      modalCopyEl.textContent = vehicle.label + ' 시승을 원하는 대리점을 선택해 주세요.';
      dealerListEl.replaceChildren(...vehicle.dealers.map(dealer => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'dealer-button';
        button.textContent = dealer.url ? dealer.name : dealer.name + ' · 링크 준비 중';
        button.disabled = !dealer.url;
        if (dealer.url) button.addEventListener('click', () => goToDealer(dealer.url));
        return button;
      }));
      modalEl.hidden = false;
      document.body.style.overflow = 'hidden';
      closeEl.focus();
    }

    function goToDealer(url) {
      window.location.href = url;
    }

    function closeModal() {
      modalEl.hidden = true;
      document.body.style.overflow = '';
      lastFocusedElement?.focus();
    }

    function showInitialState() {
      headingEl.textContent = '차량을 선택해 주세요';
      countEl.textContent = '';
      listEl.innerHTML = '<div class="state">위에서 차종을 선택하면<br>시승 가능한 차량이 표시됩니다.</div>';
    }

    function showError(message) {
      tabsEl.replaceChildren();
      headingEl.textContent = '안내';
      countEl.textContent = '';
      listEl.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'state error';
      box.textContent = message;
      listEl.appendChild(box);
    }

    closeEl.addEventListener('click', closeModal);
    modalEl.addEventListener('click', event => {
      if (event.target === modalEl) closeModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !modalEl.hidden) closeModal();
    });

    loadVehicles();
  </script>
</body>
</html>
