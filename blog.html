<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>영업담당 앱</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:#fff}.screen{display:none;min-height:100vh;padding:calc(env(safe-area-inset-top) + 22px) 18px 28px}.screen.active{display:flex}.auth{flex-direction:column;justify-content:center;gap:22px}.home{flex-direction:column;gap:16px;background:#f6f7f9}.brand,.panel,.form,.page{display:grid;gap:14px}.mark{width:48px;height:48px;border-radius:15px;background:#111827;color:#fff;display:grid;place-items:center;font-size:21px}h1{margin:0;font-size:26px}h2{margin:0;font-size:20px}h3{margin:0;font-size:15px}p{margin:0;color:#667085;font-size:14px;line-height:1.45}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px;border-radius:14px;background:#eef1f5}.tab{min-height:42px;border-radius:11px;background:transparent;color:#667085}.tab.active{background:#fff;color:#111827;box-shadow:0 4px 14px rgba(15,23,42,.08)}.field{display:grid;gap:7px}label{font-size:13px;color:#344054}input,select,textarea{width:100%;min-height:52px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;padding:12px 14px;color:#101828;font-size:16px;outline:none}textarea{min-height:108px;resize:vertical}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#667085 50%),linear-gradient(135deg,#667085 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 14px) 23px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}input:focus,select:focus,textarea:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}.primary,.secondary,.ghost{width:100%;min-height:52px;border-radius:14px}.primary{background:#111827;color:#fff}.secondary{background:#eef1f5;color:#111827}.ghost{background:transparent;color:#667085}button:disabled{opacity:.55}.status{min-height:20px;color:#667085;font-size:13px;white-space:pre-wrap;line-height:1.45}.status.error{color:#d92d20}.status.ok{color:#067647}.status.warn{color:#b54708}.hint{font-size:12px;color:#98a2b3}.card{border:1px solid #eaecf0;border-radius:14px;padding:14px;display:grid;gap:10px;background:#fff}.app-top,.section-head,.back-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.user-title{display:grid;gap:3px}.menu-btn,.back-btn{width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid #eaecf0}.menu-icon{width:20px;height:14px;display:grid;gap:4px}.menu-icon span{display:block;height:2px;border-radius:99px;background:#111827}.banner{overflow:hidden;border-radius:18px;background:#111827;color:#fff;min-height:118px;display:grid;align-content:end;padding:18px;text-align:left;width:100%}.banner-title{font-size:18px;font-weight:700}.banner-desc{color:rgba(255,255,255,.75);font-size:13px;margin-top:4px}.small-btn{min-height:34px;padding:7px 10px;border-radius:10px;background:#eef1f5;color:#111827;font-size:12px}.list{display:grid;gap:8px}.list-item{background:#fff;border:1px solid #eaecf0;border-radius:14px;padding:13px;display:grid;gap:5px}.list-title{font-size:14px;color:#111827}.list-meta{font-size:12px;color:#667085}.empty{padding:18px;border-radius:14px;background:#fff;border:1px dashed #d0d5dd;color:#98a2b3;text-align:center;font-size:13px}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick-actions button{min-height:68px;border-radius:18px;background:#fff;border:1px solid #eaecf0;text-align:left;padding:14px;color:#111827}.drawer-dim{position:fixed;inset:0;background:rgba(17,24,39,.42);display:none;z-index:20}.drawer-dim.active{display:block}.drawer{position:fixed;top:0;right:0;width:min(320px,86vw);height:100vh;background:#fff;z-index:21;transform:translateX(100%);transition:.2s ease;padding:calc(env(safe-area-inset-top) + 20px) 18px 24px;display:flex;flex-direction:column;gap:14px}.drawer.active{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer-close{width:38px;height:38px;border-radius:12px;background:#eef1f5}.drawer-menu{display:grid;gap:2px}.drawer-menu button{width:100%;min-height:44px;background:#fff;color:#111827;text-align:left;padding:0}.page{display:none}.page.active{display:grid}.file-name{font-size:12px;color:#667085}
  </style>
</head>
<body>
  <main class="app">
    <section id="authScreen" class="screen auth active">
      <div class="brand">
        <div class="mark">B</div>
        <h1>영업담당 로그인</h1>
        <p>등록된 영업담당만 사용할 수 있습니다.</p>
        <p class="hint">빌드: 2026-06-07-profile-notice-2</p>
        <p id="apiStatus" class="status">Supabase 연결 확인 중입니다.</p>
      </div>
      <div class="panel">
        <div class="tabs">
          <button id="loginTab" class="tab active" type="button" onclick="setMode('login')">로그인</button>
          <button id="registerTab" class="tab" type="button" onclick="setMode('register')">최초 가입</button>
        </div>
        <form id="authForm" class="form">
          <div class="field"><label for="name">이름</label><input id="name" autocomplete="name" required></div>
          <div class="field"><label for="agency">소속 대리점</label><select id="agency" required><option value="">대리점 선택</option></select></div>
          <div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><div id="passwordHint" class="hint">가입 때 만든 비밀번호를 입력하세요.</div></div>
          <div id="status" class="status"></div>
          <button id="submitBtn" class="primary" type="submit">로그인</button>
          <button class="secondary" type="button" onclick="checkMember()">가입 가능 확인</button>
        </form>
      </div>
    </section>

    <section id="homeScreen" class="screen home">
      <div id="mainPage" class="page active">
        <div class="app-top">
          <div class="user-title"><h2 id="homeTitle">홈</h2><p id="homeSubtitle"></p></div>
          <button class="menu-btn" type="button" onclick="openDrawer()" aria-label="메뉴 열기"><span class="menu-icon"><span></span><span></span><span></span></span></button>
        </div>
        <button class="banner" type="button" onclick="openPage('requestPage')"><div class="banner-title">블로그 원고 제작 요청</div><div class="banner-desc">필요한 원고를 바로 요청하세요.</div></button>
        <div class="card"><div class="section-head"><h3>공지사항</h3><button class="small-btn" type="button" onclick="loadAppHome()">새로고침</button></div><div id="noticeList" class="list"></div></div>
        <div class="quick-actions"><button type="button" onclick="openPage('requestPage')">블로그 원고<br>제작 요청</button><button type="button" onclick="openPage('postsPage')">완료된 원고<br>리스트</button></div>
        <div class="card"><div class="section-head"><h3>완료된 원고</h3><button class="small-btn" type="button" onclick="openPage('postsPage')">전체보기</button></div><div id="completedPostList" class="list"></div></div>
      </div>

      <div id="profilePage" class="page">
        <div class="back-row"><button class="back-btn" type="button" onclick="openPage('mainPage')">‹</button><h2>내 정보</h2></div>
        <div class="card form">
          <div id="profileGuide" class="status warn" style="display:none">내 정보가 비어 있어 먼저 등록해야 합니다.</div>
          <div class="field"><label>이름</label><input id="profileName" disabled></div>
          <div class="field"><label>소속 대리점</label><input id="profileAgency" disabled></div>
          <div class="field"><label>업로드 블로그</label><select id="profileUploadBlog" onchange="toggleProfileFields()"><option value="">선택</option><option value="본인 블로그">본인 블로그</option><option value="지점 블로그">지점 블로그</option></select></div>
          <div id="blogUrlField" class="field"><label>블로그 URL</label><input id="profileBlogUrl" placeholder="본인 블로그 URL"></div>
          <div id="testDriveUrlField" class="field"><label>시승신청 URL</label><input id="profileTestDriveUrl" placeholder="본인 시승신청 URL"></div>
          <div id="businessCardField" class="field"><label>본인 명함 이미지</label><input id="profileBusinessCardFile" type="file" accept="image/*"><div id="businessCardName" class="file-name"></div></div>
          <div id="profileStatus" class="status"></div>
          <button class="primary" type="button" onclick="saveMyInfo()">저장하고 시작</button>
        </div>
      </div>

      <div id="requestPage" class="page">
        <div class="back-row"><button class="back-btn" type="button" onclick="openPage('mainPage')">‹</button><h2>블로그 원고 제작 요청</h2></div>
        <div class="card form">
          <div class="field"><label>업로드 블로그</label><select id="requestUploadBlog"><option value="">선택</option><option value="본인 블로그">본인 블로그</option><option value="지점 블로그">지점 블로그</option></select></div>
          <div class="field"><label>요청 제목</label><input id="requestTitle" placeholder="예: QM6 시승 후기 원고"></div>
          <div class="field"><label>키워드</label><input id="requestKeyword" placeholder="넣고 싶은 키워드"></div>
          <div class="field"><label>차종</label><input id="requestVehicle" placeholder="차종"></div>
          <div class="field"><label>요청 메모</label><textarea id="requestMemo" placeholder="필요한 내용이 있으면 입력하세요."></textarea></div>
          <div id="requestStatus" class="status"></div>
          <button class="primary" type="button" onclick="requestBlogDraft()">요청하기</button>
        </div>
      </div>

      <div id="postsPage" class="page">
        <div class="back-row"><button class="back-btn" type="button" onclick="openPage('mainPage')">‹</button><h2>나의 원고 리스트</h2></div>
        <div id="myPostList" class="list"></div>
      </div>
    </section>
  </main>

  <div id="drawerDim" class="drawer-dim" onclick="closeDrawer()"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-head"><h2>메뉴</h2><button class="drawer-close" type="button" onclick="closeDrawer()">×</button></div>
    <div class="drawer-menu">
      <button type="button" onclick="openPageFromDrawer('profilePage')">내 정보</button>
      <button type="button" onclick="openPageFromDrawer('postsPage')">나의 원고 리스트</button>
      <button type="button" onclick="openPageFromDrawer('mainPage')">업로드 콘텐츠</button>
      <button type="button" onclick="openPageFromDrawer('mainPage')">시책 점수 확인</button>
      <button type="button" onclick="openPageFromDrawer('mainPage')">블로그 스킨제작 요청</button>
      <button type="button" onclick="logout()">로그아웃</button>
    </div>
  </aside>

  <script>
    const SUPABASE_URL = 'https://gwajgqdqwovwuqhwoebq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sR1pzsDldppwVEUMQUNOnQ_x0TE_lMv';
    const SESSION_KEY = 'salesLoginSession_v2';

    const state = { mode: 'login', loading: false, user: null, appHome: null };
    const $ = id => document.getElementById(id);

    init();

    function init() {
      $('authForm').addEventListener('submit', handleSubmit);
      $('profileBusinessCardFile').addEventListener('change', () => {
        const file = $('profileBusinessCardFile').files[0];
        $('businessCardName').textContent = file ? file.name : '';
      });
      const saved = readSession();
      if (saved && saved.name && saved.agency) {
        state.user = saved;
        showHome();
      }
      boot();
    }

    async function boot() {
      if (!isConfigured()) {
        $('apiStatus').className = 'status error';
        $('apiStatus').textContent = 'Supabase URL과 anon key를 먼저 입력해야 합니다.';
        return;
      }
      await loadAgencies();
      $('apiStatus').className = 'status ok';
      $('apiStatus').textContent = 'Supabase 연결 준비 완료';
    }

    function isConfigured() {
      return SUPABASE_URL.indexOf('YOUR_') === -1 && SUPABASE_ANON_KEY.indexOf('YOUR_') === -1;
    }

    async function loadAgencies() {
      try {
        const agencies = await rpc('list_agencies', {});
        $('agency').innerHTML = '<option value="">대리점 선택</option>' + (agencies || []).map(item => `<option value="${esc(item.agency)}">${esc(item.agency)}</option>`).join('');
      } catch (error) {
        $('apiStatus').className = 'status error';
        $('apiStatus').textContent = error.message || String(error);
      }
    }

    function setMode(mode) {
      state.mode = mode;
      $('loginTab').classList.toggle('active', mode === 'login');
      $('registerTab').classList.toggle('active', mode === 'register');
      $('submitBtn').textContent = mode === 'login' ? '로그인' : '비밀번호 생성';
      $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
      $('passwordHint').textContent = mode === 'login' ? '가입 때 만든 비밀번호를 입력하세요.' : '영문과 숫자를 포함한 4~8자로 생성하세요.';
      showStatus('');
    }

    async function checkMember() {
      const values = getFormValues();
      if (!values.name || !values.agency) return showStatus('이름과 소속 대리점을 입력해주세요.', 'error');
      await withLoading(async () => {
        showStatus('가입 가능 여부를 확인하는 중입니다.');
        const data = await rpc('check_sales_member', { p_name: values.name, p_agency: values.agency });
        if (!data.exists) return showStatus(data.message || '등록 가능한 영업담당이 아닙니다.', 'error');
        if (data.active === false) return showStatus(data.message || '비활성 처리된 영업담당입니다.', 'error');
        showStatus(data.registered ? '이미 가입되어 있습니다. 로그인해주세요.' : '가입 가능합니다. 비밀번호를 생성해주세요.', 'ok');
      });
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const values = getFormValues();
      if (!values.name || !values.agency || !values.password) return showStatus('모든 항목을 입력해주세요.', 'error');
      await withLoading(async () => {
        showStatus(state.mode === 'login' ? '로그인 중입니다.' : '가입 처리 중입니다.');
        const data = await rpc(state.mode === 'login' ? 'login_sales_member' : 'register_sales_member', {
          p_name: values.name,
          p_agency: values.agency,
          p_password: values.password,
        });
        if (state.mode === 'login' && data.loggedIn !== true) throw new Error('로그인 응답이 올바르지 않습니다.');
        if (state.mode === 'register' && data.registered !== true) throw new Error('가입 응답이 올바르지 않습니다.');

        const notionPageId = data.notionPageId || '';
        let successMessage = state.mode === 'register' ? '가입에 성공했습니다' : '로그인되었습니다.';
        state.user = { name: data.name || values.name, agency: data.agency || values.agency, notionPageId, message: successMessage, loggedAt: new Date().toISOString() };
        saveSession(state.user);
        showHome();
        runPostLoginSync({
          shouldSync: state.mode === 'register' || !notionPageId,
          name: data.name || values.name,
          agency: data.agency || values.agency,
          password: values.password,
          notionPageId,
        });
      });
    }

    function getFormValues() {
      return { name: $('name').value.trim(), agency: $('agency').value.trim(), password: $('password').value.trim() };
    }

    async function rpc(name, body) {
      const res = await fetchWithRetry(`${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${name}`, {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { throw new Error(`Supabase 응답이 JSON이 아닙니다.\n${text.slice(0, 160)}`); }
      if (!res.ok) throw new Error((data && (data.message || data.error_description || data.error)) || `Supabase 오류 (${res.status})`);
      return data;
    }

    async function completeSignup(payload) {
      const data = await gasAction('completeSignup', payload);
      return data || {};
    }

    function runPostLoginSync(payload) {
      if (!payload || !payload.shouldSync) return;

      completeSignup({
        name: payload.name,
        agency: payload.agency,
        password: payload.password,
        notionPageId: payload.notionPageId,
      })
        .then(syncData => {
          if (syncData && syncData.notionPageId) {
            state.user.notionPageId = syncData.notionPageId;
            saveSession(state.user);
          }
          return loadAppHome();
        })
        .catch(error => {
          console.warn('post login sync failed', error);
        });
    }

    async function gasAction(action, body) {
      const res = await fetchWithRetry(`${SUPABASE_URL.replace(/\/$/, '')}/functions/v1/gas-action`, {
        method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...(body || {}) }),
      });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { throw new Error(`GAS 프록시 응답이 JSON이 아닙니다.\n${text.slice(0, 160)}`); }
      if (!res.ok || !data || data.ok !== true) throw new Error((data && (data.message || data.error)) || `GAS 프록시 오류 (${res.status})`);
      return data.data;
    }

    async function fetchWithRetry(url, options, retries = 2) {
      let lastError;
      for (let i = 0; i <= retries; i++) {
        try {
          return await Promise.race([fetch(url, options), new Promise((_, reject) => setTimeout(() => reject(new Error('요청 시간이 초과되었습니다.')), 30000))]);
        } catch (error) {
          lastError = error;
          if (i < retries) await new Promise(resolve => setTimeout(resolve, 1200 * (i + 1)));
        }
      }
      throw lastError;
    }

    function showHome() {
      $('authScreen').classList.remove('active');
      $('homeScreen').classList.add('active');
      $('homeTitle').textContent = `${state.user.name}님`;
      $('homeSubtitle').textContent = state.user.agency || state.user.message || '';
      openPage('mainPage');
      loadAppHome();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    async function loadAppHome() {
      try {
        const data = await gasAction('getAppHome', { name: state.user.name, agency: state.user.agency });
        state.appHome = data || {};
        renderProfile(state.appHome.profile || {});
        renderNotices(state.appHome.notices || []);
        renderCompletedPosts(state.appHome.completedPosts || []);
        if (state.appHome.profile && state.appHome.profile.needsProfile) {
          $('profileGuide').style.display = 'block';
          openPage('profilePage');
        }
      } catch (error) {
        renderNotices([]);
        renderCompletedPosts([]);
      }
    }

    function renderProfile(profile) {
      $('profileName').value = profile.name || state.user.name || '';
      $('profileAgency').value = profile.agency || state.user.agency || '';
      $('profileUploadBlog').value = profile.uploadBlog || '';
      $('profileBlogUrl').value = profile.blogUrl || '';
      $('profileTestDriveUrl').value = profile.testDriveUrl || '';
      $('businessCardName').textContent = profile.businessCardImage ? '기존 명함 이미지 등록됨' : '';
      toggleProfileFields();
      if (profile.uploadBlog) $('requestUploadBlog').value = profile.uploadBlog;
    }

    function renderNotices(notices) {
      const box = $('noticeList');
      if (!notices || notices.length === 0) return box.innerHTML = '<div class="empty">등록된 공지사항이 없습니다.</div>';
      box.innerHTML = notices.map(item => `<a class="list-item" href="${esc(item.url || '#')}" target="_blank" rel="noopener"><div class="list-title">${item.pinned ? '고정 · ' : ''}${esc(item.title)}</div><div class="list-meta">${esc(item.date || '')}</div></a>`).join('');
    }

    function renderCompletedPosts(posts) {
      const box = $('completedPostList');
      if (!posts || posts.length === 0) return box.innerHTML = '<div class="empty">완료된 원고가 없습니다.</div>';
      box.innerHTML = posts.map(post => `<div class="list-item"><div class="list-title">${esc(post.title || '제목 없음')}</div><div class="list-meta">${esc(post.date || '')} · ${esc(post.status || '')}</div>${post.url ? `<a href="${esc(post.url)}" target="_blank" rel="noopener">원고 열기</a>` : ''}</div>`).join('');
    }

    function renderMyPosts(posts) {
      const box = $('myPostList');
      if (!posts || posts.length === 0) return box.innerHTML = '<div class="empty">원고 요청 내역이 없습니다.</div>';
      box.innerHTML = posts.map(post => `<div class="list-item"><div class="list-title">${esc(post.title || '제목 없음')}</div><div class="list-meta">${esc(post.date || '')} · ${esc(post.status || '')} · ${esc(post.uploadBlog || '')}</div>${post.memo ? `<p>${esc(post.memo)}</p>` : ''}${post.url ? `<a href="${esc(post.url)}" target="_blank" rel="noopener">원고 열기</a>` : ''}</div>`).join('');
    }

    async function saveMyInfo() {
      $('profileStatus').className = 'status';
      $('profileStatus').textContent = '저장 중입니다.';
      try {
        const file = $('profileBusinessCardFile').files[0];
        const fileData = file ? await readFileAsDataUrl(file) : '';
        const result = await gasAction('saveMyInfo', {
          name: state.user.name,
          agency: state.user.agency,
          uploadBlog: $('profileUploadBlog').value.trim(),
          blogUrl: $('profileBlogUrl').value.trim(),
          testDriveUrl: $('profileTestDriveUrl').value.trim(),
          businessCardData: fileData,
          businessCardName: file ? file.name : '',
        });
        $('profileStatus').className = 'status ok';
        $('profileStatus').textContent = result.message || '저장되었습니다.';
        $('profileGuide').style.display = 'none';
        await loadAppHome();
        openPage('mainPage');
      } catch (error) {
        $('profileStatus').className = 'status error';
        $('profileStatus').textContent = error.message || String(error);
      }
    }

    async function requestBlogDraft() {
      $('requestStatus').className = 'status';
      $('requestStatus').textContent = '요청 중입니다.';
      try {
        const result = await gasAction('requestBlogDraft', {
          name: state.user.name,
          agency: state.user.agency,
          uploadBlog: $('requestUploadBlog').value.trim(),
          title: $('requestTitle').value.trim(),
          keyword: $('requestKeyword').value.trim(),
          vehicle: $('requestVehicle').value.trim(),
          memo: $('requestMemo').value.trim(),
        });
        $('requestStatus').className = 'status ok';
        $('requestStatus').textContent = result.message || '요청되었습니다.';
        $('requestTitle').value = '';
        $('requestKeyword').value = '';
        $('requestVehicle').value = '';
        $('requestMemo').value = '';
        await loadAppHome();
      } catch (error) {
        $('requestStatus').className = 'status error';
        $('requestStatus').textContent = error.message || String(error);
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('명함 이미지를 읽지 못했습니다.'));
        reader.readAsDataURL(file);
      });
    }

    function toggleProfileFields() {
      const type = $('profileUploadBlog').value;
      $('blogUrlField').style.display = type === '본인 블로그' ? 'grid' : 'none';
      $('testDriveUrlField').style.display = type === '지점 블로그' ? 'grid' : 'none';
      $('businessCardField').style.display = type === '지점 블로그' ? 'grid' : 'none';
    }

    function openDrawer(){ $('drawerDim').classList.add('active'); $('drawer').classList.add('active'); }
    function closeDrawer(){ $('drawerDim').classList.remove('active'); $('drawer').classList.remove('active'); }
    function openPageFromDrawer(pageId){ closeDrawer(); openPage(pageId); }
    function openPage(pageId) {
      document.querySelectorAll('#homeScreen .page').forEach(page => page.classList.remove('active'));
      $(pageId).classList.add('active');
      if (pageId === 'postsPage') gasAction('getMyPosts', { name: state.user.name, agency: state.user.agency }).then(posts => renderMyPosts(Array.isArray(posts) ? posts : [])).catch(() => renderMyPosts([]));
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      state.user = null;
      $('homeScreen').classList.remove('active');
      $('authScreen').classList.add('active');
      closeDrawer();
      showStatus('');
    }
    async function withLoading(fn) {
      if (state.loading) return;
      state.loading = true;
      setButtonsDisabled(true);
      try { await fn(); } catch (error) { showStatus(error.message || String(error), 'error'); } finally { state.loading = false; setButtonsDisabled(false); }
    }
    function setButtonsDisabled(disabled){ document.querySelectorAll('button').forEach(button => { button.disabled = disabled; }); }
    function showStatus(message, type){ $('status').className = `status ${type || ''}`; $('status').textContent = message || ''; }
    function saveSession(user){ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }
    function readSession(){ try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch { return null; } }
    function esc(value){ return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
  </script>
</body>
</html>
