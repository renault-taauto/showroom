<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>영업담당 로그인</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
    button,input,select{font:inherit}
    button{border:0;cursor:pointer}
    .app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:#fff}
    .screen{display:none;min-height:100vh;padding:calc(env(safe-area-inset-top) + 22px) 18px 28px}
    .screen.active{display:flex}
    .auth{flex-direction:column;justify-content:center;gap:22px}
    .home{flex-direction:column;gap:18px}
    .brand{display:grid;gap:8px}
    .mark{width:48px;height:48px;border-radius:15px;background:#111827;color:#fff;display:grid;place-items:center;font-size:21px}
    h1{margin:0;font-size:26px;letter-spacing:0}
    h2{margin:0;font-size:20px}
    p{margin:0;color:#667085;font-size:14px;line-height:1.45}
    .panel{display:grid;gap:14px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px;border-radius:14px;background:#eef1f5}
    .tab{min-height:42px;border-radius:11px;background:transparent;color:#667085}
    .tab.active{background:#fff;color:#111827;box-shadow:0 4px 14px rgba(15,23,42,.08)}
    .form{display:grid;gap:12px}
    .field{display:grid;gap:7px}
    label{font-size:13px;color:#344054}
    input,select{width:100%;min-height:52px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;padding:12px 14px;color:#101828;font-size:16px;outline:none}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#667085 50%),linear-gradient(135deg,#667085 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 14px) 23px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
    input:focus,select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
    .primary,.secondary,.ghost{width:100%;min-height:52px;border-radius:14px}
    .primary{background:#111827;color:#fff}
    .secondary{background:#eef1f5;color:#111827}
    .ghost{background:transparent;color:#667085}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{min-height:20px;color:#667085;font-size:13px;white-space:pre-wrap;line-height:1.45}
    .status.error{color:#d92d20}
    .status.ok{color:#067647}
    .status.warn{color:#b54708}
    .hint{font-size:12px;color:#98a2b3;line-height:1.4}
    .card{border:1px solid #eaecf0;border-radius:14px;padding:14px;display:grid;gap:10px}
    .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
    .row span:first-child{color:#667085}
    .sync-status{font-size:12px;padding:8px 12px;border-radius:10px;background:#f9fafb;border:1px solid #eaecf0;display:grid;gap:4px}
    .sync-row{display:flex;align-items:center;gap:6px;color:#667085}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:#d0d5dd;flex-shrink:0}
    .sync-dot.ok{background:#17b26a}
    .sync-dot.error{background:#d92d20}
    .sync-dot.loading{background:#f79009;animation:blink .8s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</head>
<body>
  <main class="app">
    <section id="authScreen" class="screen auth active">
      <div class="brand">
        <div class="mark">B</div>
        <h1>영업담당 로그인</h1>
        <p>등록된 영업담당만 사용할 수 있습니다.</p>
        <p class="hint">빌드: 2026-06-07-sync-fix-1</p>
        <p id="apiStatus" class="status">연결 확인 중입니다.</p>
      </div>

      <div class="panel">
        <div class="tabs">
          <button id="loginTab" class="tab active" type="button" onclick="setMode('login')">로그인</button>
          <button id="registerTab" class="tab" type="button" onclick="setMode('register')">최초 가입</button>
        </div>

        <div class="form">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="agency">소속 대리점</label>
            <select id="agency" required>
              <option value="">대리점 선택</option>
            </select>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <div id="passwordHint" class="hint">가입 때 만든 비밀번호를 입력하세요.</div>
          </div>
          <div id="status" class="status"></div>
          <button id="submitBtn" class="primary" type="button" onclick="handleSubmit()">로그인</button>
          <button class="secondary" type="button" onclick="checkMember()">가입 가능 확인</button>
        </div>
      </div>
    </section>

    <section id="homeScreen" class="screen home">
      <div>
        <h2 id="homeTitle">로그인 완료</h2>
        <p id="homeSubtitle"></p>
      </div>
      <div class="card">
        <div class="row"><span>이름</span><span id="homeName"></span></div>
        <div class="row"><span>소속 대리점</span><span id="homeAgency"></span></div>
        <div class="row"><span>노션 페이지</span><span id="homeNotion"></span></div>
      </div>
      <div id="syncStatus" class="sync-status" style="display:none">
        <div class="sync-row"><span id="sheetDot" class="sync-dot"></span><span id="sheetLabel">구글시트 동기화</span></div>
        <div class="sync-row"><span id="notionDot" class="sync-dot"></span><span id="notionLabel">노션 페이지</span></div>
      </div>
      <button class="secondary" type="button" onclick="logout()">로그아웃</button>
    </section>
  </main>

  <script>

    const SUPABASE_URL = 'https://gwajgqdqwovwuqhwoebq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sR1pzsDldppwVEUMQUNOnQ_x0TE_lMv';

    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw1hylOBMK47x2SmHyPJd--bytoGfY-8tKokUrkY4x3Vj8ag0GrFk5LLxYBHtBnv-xt/exec';

    // GAS completeSignup 액션의 SYNC_SECRET (없으면 빈 문자열)
    const SYNC_SECRET = '';
    // ─────────────────────────────────────────────

    const SESSION_KEY = 'salesLoginSession_v3';

    const state = {
      mode: 'login',
      loading: false,
      user: null,
    };

    const $ = id => document.getElementById(id);

    init();

    function init() {
      const saved = readSession();
      if (saved && saved.name && saved.agency) {
        state.user = saved;
        showHome();
      }
      boot();
    }

    async function boot() {
      if (!isConfigured()) {
        $('apiStatus').className = 'status error';
        $('apiStatus').textContent = 'Supabase URL과 anon key를 먼저 입력해야 합니다.';
        return;
      }
      await loadAgencies();
    }

    function isConfigured() {
      return SUPABASE_URL.indexOf('YOUR_') === -1 && SUPABASE_ANON_KEY.indexOf('YOUR_') === -1;
    }

    async function loadAgencies() {
      try {
        const agencies = await rpc('list_agencies', {});
        $('agency').innerHTML = '<option value="">대리점 선택</option>' +
          (agencies || []).map(item => `<option value="${esc(item.agency)}">${esc(item.agency)}</option>`).join('');
        $('apiStatus').className = 'status ok';
        $('apiStatus').textContent = '연결 준비 완료';
      } catch (error) {
        $('apiStatus').className = 'status error';
        $('apiStatus').textContent = error.message || String(error);
      }
    }

    function setMode(mode) {
      state.mode = mode;
      $('loginTab').classList.toggle('active', mode === 'login');
      $('registerTab').classList.toggle('active', mode === 'register');
      $('submitBtn').textContent = mode === 'login' ? '로그인' : '비밀번호 생성';
      $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
      $('passwordHint').textContent = mode === 'login'
        ? '가입 때 만든 비밀번호를 입력하세요.'
        : '영문과 숫자를 포함한 4~8자로 생성하세요.';
      showStatus('');
    }

    async function checkMember() {
      const values = getFormValues();
      if (!values.name || !values.agency) {
        showStatus('이름과 소속 대리점을 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showStatus('가입 가능 여부를 확인하는 중입니다.');
        const data = await rpc('check_sales_member', {
          p_name: values.name,
          p_agency: values.agency,
        });

        if (!data.exists) {
          showStatus(data.message || '등록 가능한 영업담당이 아닙니다.', 'error');
          return;
        }
        if (data.active === false) {
          showStatus(data.message || '비활성 처리된 영업담당입니다.', 'error');
          return;
        }
        showStatus(
          data.registered ? '이미 가입되어 있습니다. 로그인해주세요.' : '가입 가능합니다. 비밀번호를 생성해주세요.',
          'ok'
        );
      });
    }

    async function handleSubmit() {
      const values = getFormValues();
      if (!values.name || !values.agency || !values.password) {
        showStatus('모든 항목을 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        const isRegister = state.mode === 'register';
        showStatus(isRegister ? '가입 처리 중입니다.' : '로그인 중입니다.');

        // 1단계: Supabase RPC
        const data = await rpc(
          isRegister ? 'register_sales_member' : 'login_sales_member',
          { p_name: values.name, p_agency: values.agency, p_password: values.password }
        );

        if (isRegister && data.registered !== true) throw new Error('가입 응답이 올바르지 않습니다.');
        if (!isRegister && data.loggedIn !== true) throw new Error('로그인 응답이 올바르지 않습니다.');

        state.user = {
          name: data.name || values.name,
          agency: data.agency || values.agency,
          notionPageId: data.notionPageId || '',
          message: isRegister ? '가입에 성공했습니다.' : '로그인되었습니다.',
          loggedAt: new Date().toISOString(),
        };
        saveSession(state.user);
        showHome();

        // 2단계: 가입 시에만 GAS로 구글시트·노션 동기화 (비동기, 화면 전환 후 진행)
        if (isRegister) {
          syncWithGas(values.name, values.agency, values.password);
        }
      });
    }

    // ─────────────────────────────────────────────
    // GAS 동기화: 구글시트 업데이트 + 노션 페이지 생성
    // ─────────────────────────────────────────────
    async function syncWithGas(name, agency, password) {
      if (!GAS_URL || GAS_URL.indexOf('YOUR_') !== -1) {
        setSyncStatus('sheet', 'error', 'GAS URL 미설정');
        setSyncStatus('notion', 'error', 'GAS URL 미설정');
        return;
      }

      $('syncStatus').style.display = 'grid';
      setSyncStatus('sheet', 'loading', '구글시트 업데이트 중...');
      setSyncStatus('notion', 'loading', '노션 페이지 생성 중...');

      try {
        // GAS는 CORS 제한이 있어 no-cors로 호출, 응답을 읽을 수 없지만 요청은 전달됨
        // 신뢰도를 높이려면 GAS 측에서 Access-Control-Allow-Origin 헤더를 추가해야 합니다
        const params = new URLSearchParams({
          action: 'completeSignup',
          name: name,
          agency: agency,
          password: password,
          secret: SYNC_SECRET,
        });

        const gasResponse = await fetchGas(GAS_URL + '?' + params.toString());

        if (gasResponse && gasResponse.ok) {
          const notionId = gasResponse.data && gasResponse.data.notionPageId;
          setSyncStatus('sheet', 'ok', '구글시트 업데이트 완료');
          setSyncStatus('notion', 'ok', notionId ? '노션 페이지 생성 완료' : '노션 페이지 연결됨');

          // notionPageId를 세션에 업데이트
          if (notionId && !state.user.notionPageId) {
            state.user.notionPageId = notionId;
            saveSession(state.user);
            $('homeNotion').textContent = '연결됨';
          }
        } else {
          const errMsg = gasResponse && gasResponse.error ? gasResponse.error : '동기화 중 오류 발생';
          setSyncStatus('sheet', 'error', errMsg);
          setSyncStatus('notion', 'error', errMsg);
        }
      } catch (err) {
        // no-cors 모드에서는 응답을 읽지 못해도 요청은 전달됐을 수 있음
        const msg = err.message || String(err);
        if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
          // GAS CORS 이슈일 가능성 → no-cors fallback
          await fallbackNoCors(name, agency, password);
        } else {
          setSyncStatus('sheet', 'error', msg);
          setSyncStatus('notion', 'error', msg);
        }
      }
    }

    async function fetchGas(url) {
      const res = await Promise.race([
        fetch(url, { method: 'GET', redirect: 'follow' }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('GAS 요청 시간 초과')), 30000)),
      ]);
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        throw new Error('GAS 응답이 JSON이 아닙니다: ' + text.slice(0, 100));
      }
    }

    // GAS가 CORS 헤더를 반환하지 않을 경우 no-cors 폴백
    // no-cors에서는 응답을 읽을 수 없으므로 "전달됐을 가능성 있음"으로 표시
    async function fallbackNoCors(name, agency, password) {
      try {
        const params = new URLSearchParams({
          action: 'completeSignup',
          name: name,
          agency: agency,
          password: password,
          secret: SYNC_SECRET,
        });
        await fetch(GAS_URL + '?' + params.toString(), { method: 'GET', mode: 'no-cors', redirect: 'follow' });
        setSyncStatus('sheet', 'ok', '동기화 요청 전송됨 (확인 불가)');
        setSyncStatus('notion', 'ok', '동기화 요청 전송됨 (확인 불가)');
      } catch (err2) {
        setSyncStatus('sheet', 'error', '네트워크 오류: ' + (err2.message || ''));
        setSyncStatus('notion', 'error', '네트워크 오류: ' + (err2.message || ''));
      }
    }

    function setSyncStatus(target, dotState, label) {
      const dot = $(target === 'sheet' ? 'sheetDot' : 'notionDot');
      const lbl = $(target === 'sheet' ? 'sheetLabel' : 'notionLabel');
      dot.className = 'sync-dot ' + dotState;
      lbl.textContent = label;
    }

    function getFormValues() {
      return {
        name: $('name').value.trim(),
        agency: $('agency').value.trim(),
        password: $('password').value.trim(),
      };
    }

    async function rpc(name, body) {
      const res = await fetchWithRetry(`${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${name}`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body || {}),
      });

      const text = await res.text();
      let data;
      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        throw new Error(`Supabase 응답이 JSON이 아닙니다.\n${text.slice(0, 160)}`);
      }

      if (!res.ok) {
        throw new Error((data && (data.message || data.error_description || data.error)) || `Supabase 오류 (${res.status})`);
      }
      return data;
    }

    async function fetchWithRetry(url, options, retries = 2) {
      let lastError;
      for (let i = 0; i <= retries; i++) {
        try {
          return await Promise.race([
            fetch(url, options),
            new Promise((_, reject) => setTimeout(() => reject(new Error('요청 시간이 초과되었습니다.')), 25000)),
          ]);
        } catch (err) {
          lastError = err;
          if (i < retries) await new Promise(resolve => setTimeout(resolve, 1200 * (i + 1)));
        }
      }
      throw lastError;
    }

    function showHome() {
      $('authScreen').classList.remove('active');
      $('homeScreen').classList.add('active');
      $('homeTitle').textContent = `${state.user.name}님`;
      $('homeSubtitle').textContent = state.user.message || '로그인되었습니다.';
      $('homeName').textContent = state.user.name || '-';
      $('homeAgency').textContent = state.user.agency || '-';
      $('homeNotion').textContent = state.user.notionPageId ? '연결됨' : '없음';
      $('syncStatus').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      state.user = null;
      $('homeScreen').classList.remove('active');
      $('authScreen').classList.add('active');
      showStatus('');
    }

    async function withLoading(fn) {
      if (state.loading) return;
      state.loading = true;
      setButtonsDisabled(true);
      try {
        await fn();
      } catch (err) {
        showStatus(err.message || String(err), 'error');
      } finally {
        state.loading = false;
        setButtonsDisabled(false);
      }
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('button').forEach(b => { b.disabled = disabled; });
    }

    function showStatus(message, type) {
      $('status').className = `status ${type || ''}`;
      $('status').textContent = message || '';
    }

    function saveSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    }

    function readSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      } catch { return null; }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
