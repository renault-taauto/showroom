<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>영업담당 포털</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{background:#f5f6f8;color:#171923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;line-height:1.45}
    button,input,select,textarea{font:inherit}
    button{border:0;cursor:pointer}
    .app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:#fff}
    .screen{display:none;min-height:100vh;padding:env(safe-area-inset-top) 18px 28px}
    .screen.active{display:block}
    .auth{display:flex;min-height:100vh;flex-direction:column;justify-content:center;gap:22px}
    .brand{display:grid;gap:8px}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:900}
    h1{margin:0;font-size:26px;letter-spacing:0}
    h2{margin:0;font-size:20px}
    p{margin:0;color:#667085;font-size:14px}
    .panel{display:grid;gap:14px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px;border-radius:14px;background:#eef1f5}
    .tab{min-height:42px;border-radius:11px;background:transparent;color:#667085;font-weight:800}
    .tab.active{background:#fff;color:#111827;box-shadow:0 4px 14px rgba(15,23,42,.08)}
    .form{display:grid;gap:12px}
    .field{display:grid;gap:7px}
    label{font-size:13px;font-weight:800;color:#344054}
    input,select{width:100%;min-height:50px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;padding:12px 14px;color:#101828;font-size:16px;outline:none}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#667085 50%),linear-gradient(135deg,#667085 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
    input:focus,select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
    .radio-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .radio-card{position:relative}
    .radio-card input{position:absolute;opacity:0;pointer-events:none}
    .radio-card span{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;color:#344054;font-weight:800}
    .radio-card input:checked+span{border-color:#111827;background:#111827;color:#fff}
    .hint{font-size:12px;color:#98a2b3}
    .primary,.secondary,.ghost{width:100%;min-height:50px;border-radius:14px;font-weight:900}
    .primary{background:#111827;color:#fff}
    .secondary{background:#eef1f5;color:#111827}
    .ghost{background:transparent;color:#667085}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{min-height:20px;color:#667085;font-size:13px;white-space:pre-wrap}
    .status.error{color:#d92d20;font-weight:800}
    .status.ok{color:#067647;font-weight:800}
    .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -18px;padding:14px 18px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
    .hello{display:grid;gap:2px}
    .hello strong{font-size:18px}
    .menu-btn{width:42px;height:42px;border-radius:14px;background:#f2f4f7;display:grid;place-items:center}
    .menu-icon,.menu-icon:before,.menu-icon:after{display:block;width:18px;height:2px;border-radius:99px;background:#111827;content:""}
    .menu-icon:before{transform:translateY(-6px)}
    .menu-icon:after{transform:translateY(4px)}
    .home{display:grid;gap:18px;padding-top:8px}
    .banner{min-height:132px;border-radius:18px;background:linear-gradient(135deg,#111827,#475467);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
    .banner strong{font-size:20px}
    .section{display:grid;gap:10px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .section-head h2{font-size:16px}
    .list{display:grid;gap:8px}
    .item{min-height:54px;border:1px solid #eaecf0;border-radius:14px;padding:12px;background:#fff}
    .item-title{font-weight:800;font-size:14px}
    .item-meta{margin-top:2px;color:#98a2b3;font-size:12px}
    .empty{padding:14px;border-radius:14px;background:#f9fafb;color:#98a2b3;font-size:13px;text-align:center}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .quick button{min-height:68px;border-radius:16px;background:#f2f4f7;color:#101828;font-weight:900;text-align:left;padding:14px}
    .drawer-backdrop{position:fixed;inset:0;z-index:50;display:none;background:rgba(15,23,42,.38)}
    .drawer-backdrop.active{display:block}
    .drawer{position:absolute;right:0;top:0;width:min(320px,86vw);height:100%;background:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 18px;box-shadow:-18px 0 48px rgba(15,23,42,.2)}
    .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
    .drawer-close{width:38px;height:38px;border-radius:13px;background:#f2f4f7;color:#111827;font-size:22px}
    .menu-list{display:grid;gap:0;border-top:1px solid #eaecf0}
    .menu-list button{width:100%;min-height:48px;border-radius:0;background:transparent;color:#101828;text-align:left;padding:14px 0;border-bottom:1px solid #eaecf0;font-weight:800}
    .logout{margin-top:14px!important;color:#c01048!important;border-bottom:0!important}
    .page-head{display:flex;align-items:center;gap:10px;margin:0 -18px 18px;padding:14px 18px 10px;background:#fff}
    .back-btn{width:38px;height:38px;border-radius:999px;background:#f2f4f7;color:#111827;font-size:20px;font-weight:900}
    .page{display:grid;gap:16px;padding-top:8px}
    .conditional{display:none}
    .conditional.active{display:grid}
    .modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(15,23,42,.38)}
    .modal.active{display:flex}
    .modal-panel{width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;background:#fff;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);display:grid;gap:12px}
    .modal-panel .secondary{margin-top:2px}
  </style>
</head>
<body>
  <main class="app">
    <section id="authScreen" class="screen auth active">
      <div class="brand">
        <div class="brand-mark">B</div>
        <h1>영업담당 포털</h1>
        <p>등록된 영업담당만 사용할 수 있습니다.</p>
      </div>

      <div class="panel">
        <div class="tabs" aria-label="로그인 방식">
          <button id="loginTab" class="tab active" type="button" onclick="setAuthMode('login')">로그인</button>
          <button id="registerTab" class="tab" type="button" onclick="setAuthMode('register')">최초 가입</button>
        </div>

        <form id="authForm" class="form">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="agency">소속 대리점</label>
            <select id="agency" required>
              <option value="">대리점 선택</option>
            </select>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <div id="passwordHint" class="hint">영문과 숫자를 포함한 4~8자</div>
          </div>
          <div id="status" class="status"></div>
          <button id="submitBtn" class="primary" type="submit">로그인</button>
          <button id="checkBtn" class="secondary" type="button" onclick="checkMember()">가입 가능 확인</button>
        </form>
      </div>
    </section>

    <section id="profileScreen" class="screen">
      <header class="page-head">
        <button id="profileBackBtn" class="back-btn" type="button" onclick="enterHome()">‹</button>
        <div>
          <h2>내 정보 등록</h2>
          <p id="profileSubtitle">노션 영업담당 정보가 비어 있어 먼저 등록이 필요합니다.</p>
        </div>
      </header>

      <form id="profileForm" class="form page">
        <div class="field">
          <label>이름</label>
          <input id="profileName" disabled>
        </div>
        <div class="field">
          <label>소속 대리점</label>
          <input id="profileAgency" disabled>
        </div>
        <div class="field">
          <label>업로드 블로그</label>
          <div class="radio-row">
            <label class="radio-card">
              <input type="radio" name="uploadBlog" value="본인 블로그" onchange="syncProfileFields()">
              <span>본인 블로그</span>
            </label>
            <label class="radio-card">
              <input type="radio" name="uploadBlog" value="지점 블로그" onchange="syncProfileFields()">
              <span>지점 블로그</span>
            </label>
          </div>
        </div>
        <div id="personalBlogFields" class="field conditional">
          <label for="blogUrl">블로그 URL</label>
          <input id="blogUrl" type="url" placeholder="https://blog.naver.com/...">
        </div>
        <div id="branchBlogFields" class="conditional">
          <div class="field">
            <label for="personalUrl">본인 URL</label>
            <input id="personalUrl" type="url" placeholder="시승신청 또는 개인 연결 URL">
          </div>
          <div class="field">
            <label for="businessCardFile">본인 명함 이미지</label>
            <input id="businessCardFile" type="file" accept="image/*">
            <div id="businessCardCurrent" class="hint"></div>
          </div>
        </div>
        <div id="profileStatus" class="status"></div>
        <button class="primary" type="submit">저장하고 시작하기</button>
      </form>
    </section>

    <section id="homeScreen" class="screen">
      <header class="topbar">
        <div class="hello">
          <strong id="homeName">안녕하세요</strong>
          <p id="homeAgency"></p>
        </div>
        <button class="menu-btn" type="button" aria-label="메뉴 열기" onclick="openDrawer()">
          <span class="menu-icon"></span>
        </button>
      </header>

      <div class="home">
        <button class="banner" type="button" onclick="openComingSoon('시책 참여 신청')">
          <strong>6월 블로그 시책</strong>
          <span>배너 클릭 후 참여 신청 폼으로 연결됩니다.</span>
        </button>

        <section class="section">
          <div class="section-head">
            <h2>공지사항</h2>
          </div>
          <div class="list">
            <div class="item">
              <div class="item-title">모바일 포털 준비 중</div>
              <div class="item-meta">공지 API 연결 전 임시 표시입니다.</div>
            </div>
          </div>
        </section>

        <section class="section">
          <button class="primary" type="button" onclick="openComingSoon('블로그 원고 제작 요청')">블로그 원고 제작 요청</button>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>완료된 원고</h2>
          </div>
          <div class="empty">아직 표시할 완료 원고가 없습니다.</div>
        </section>
      </div>
    </section>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawerOnBackdrop(event)">
    <aside class="drawer" aria-label="메뉴">
      <div class="drawer-head">
        <div>
          <h2>메뉴</h2>
          <p id="drawerUser"></p>
        </div>
        <button class="drawer-close" type="button" aria-label="닫기" onclick="closeDrawer()">×</button>
      </div>
      <div class="menu-list">
        <button type="button" onclick="enterProfile(false)">내 정보</button>
        <button type="button" onclick="openComingSoon('나의 원고 리스트')">나의 원고 리스트</button>
        <button type="button" onclick="openComingSoon('업로드 콘텐츠')">업로드 콘텐츠</button>
        <button type="button" onclick="openComingSoon('시책 점수 확인')">시책 점수 확인</button>
        <button type="button" onclick="openComingSoon('블로그 스킨제작 요청')">블로그 스킨제작 요청</button>
        <button class="logout" type="button" onclick="logout()">로그아웃</button>
      </div>
    </aside>
  </div>

  <div id="modal" class="modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-panel">
      <h2 id="modalTitle">준비 중</h2>
      <p id="modalText">이 기능은 다음 단계에서 연결합니다.</p>
      <button class="secondary" type="button" onclick="closeModal()">확인</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxSjlIY_u-8y-y_OhF3PbhL4iiagvPkwcFwxI_l1znn02Kl2kOvi9crk_OO8XF2FItj/exec';
    const SESSION_KEY = 'salesMemberSession_v1';

    const state = {
      authMode: 'login',
      loading: false,
      user: null,
      profileRequired: false,
    };

    const $ = id => document.getElementById(id);

    init();

    function init() {
      const saved = readSession();
      if (saved && saved.name && saved.agency) {
        state.user = saved;
        showHome();
      }

      $('authForm').addEventListener('submit', handleAuthSubmit);
      $('profileForm').addEventListener('submit', handleProfileSubmit);
      loadAgencies();
    }

    async function loadAgencies() {
      const select = $('agency');

      try {
        const res = await apiGet({ action: 'agencies' });
        if (!res.ok) throw new Error(res.error || '대리점 목록을 불러오지 못했습니다.');

        const agencies = Array.isArray(res.data) ? res.data : [];
        select.innerHTML = '<option value="">대리점 선택</option>' +
          agencies.map(agency => `<option value="${esc(agency)}">${esc(agency)}</option>`).join('');

        if (state.user && state.user.agency) {
          select.value = state.user.agency;
        }
      } catch (error) {
        replaceAgencySelectWithInput();
        showStatus(`${error.message || String(error)}\n대리점은 직접 입력으로 진행할 수 있습니다.`, 'error');
      }
    }

    function replaceAgencySelectWithInput() {
      const current = $('agency');
      if (!current || current.tagName === 'INPUT') return;

      const input = document.createElement('input');
      input.id = 'agency';
      input.name = 'agency';
      input.autocomplete = 'organization';
      input.placeholder = '소속 대리점 직접 입력';
      input.required = true;
      current.replaceWith(input);
    }

    function setAuthMode(mode) {
      state.authMode = mode;
      $('loginTab').classList.toggle('active', mode === 'login');
      $('registerTab').classList.toggle('active', mode === 'register');
      $('submitBtn').textContent = mode === 'login' ? '로그인' : '비밀번호 생성';
      $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
      $('passwordHint').textContent = mode === 'login'
        ? '가입 때 만든 비밀번호를 입력하세요.'
        : '영문과 숫자를 포함한 4~8자';
      clearStatus();
    }

    async function checkMember() {
      const name = $('name').value.trim();
      const agency = $('agency').value.trim();

      if (!name || !agency) {
        showStatus('이름과 소속 대리점을 먼저 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showStatus('가입 가능 여부를 확인하는 중입니다.');
        const res = await apiGet({ action: 'checkMember', name, agency });
        if (!res.ok) throw new Error(res.error || '확인에 실패했습니다.');

        if (!res.data.exists) {
          showStatus(res.data.message || '등록 가능한 영업담당이 아닙니다.', 'error');
          return;
        }

        showStatus(res.data.registered
          ? '이미 가입된 영업담당입니다. 로그인해주세요.'
          : '가입 가능합니다. 비밀번호를 생성해주세요.', 'ok');
      });
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();

      const payload = {
        action: state.authMode === 'login' ? 'login' : 'register',
        name: $('name').value.trim(),
        agency: $('agency').value.trim(),
        password: $('password').value.trim(),
      };

      if (!payload.name || !payload.agency || !payload.password) {
        showStatus('모든 항목을 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showStatus(state.authMode === 'login' ? '로그인 중입니다.' : '가입 처리 중입니다.');
        const res = await apiGet(payload);
        if (!res.ok) throw new Error(res.error || '요청에 실패했습니다.');

        const data = res.data || {};
        if (data.ok === false) {
          throw new Error(data.error || '요청에 실패했습니다.');
        }
        if (state.authMode === 'login' && data.loggedIn !== true) {
          throw new Error(data.error || '로그인 성공 응답을 받지 못했습니다.');
        }
        if (state.authMode === 'register' && data.registered !== true) {
          throw new Error(data.error || '가입 성공 응답을 받지 못했습니다.');
        }

        const user = {
          name: data.name || payload.name,
          agency: data.agency || payload.agency,
          notionPageId: data.notionPageId || '',
          profile: data.profile || {},
          profileComplete: !!data.profileComplete,
          loggedAt: new Date().toISOString(),
        };

        saveSession(user);
        state.user = user;
        if (!user.profileComplete) {
          enterProfile(true);
        } else {
          enterHome();
        }
      });
    }

    function enterProfile(required) {
      if (!state.user) return;
      state.profileRequired = !!required;
      hideScreens();
      $('profileScreen').classList.add('active');
      $('profileScreen').style.display = 'block';
      $('profileBackBtn').style.display = required ? 'none' : 'block';
      $('profileSubtitle').textContent = required
        ? '노션 영업담당 정보가 비어 있어 먼저 등록이 필요합니다.'
        : '노션 영업담당 정보를 수정합니다.';
      fillProfileForm(state.user.profile || {});
      closeDrawer();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function enterHome() {
      if (!state.user) return;
      if (state.profileRequired && state.user.profileComplete === false) {
        enterProfile(true);
        return;
      }
      hideScreens();
      const authScreen = $('authScreen');
      const homeScreen = $('homeScreen');
      homeScreen.classList.add('active');
      homeScreen.style.display = 'block';
      $('homeName').textContent = `${state.user.name}님`;
      $('homeAgency').textContent = state.user.agency;
      $('drawerUser').textContent = `${state.user.name} / ${state.user.agency}`;
      closeDrawer();
      clearStatus();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function showHome() {
      if (state.user && state.user.profileComplete === false) enterProfile(true);
      else enterHome();
    }

    function hideScreens() {
      ['authScreen', 'profileScreen', 'homeScreen'].forEach(id => {
        $(id).classList.remove('active');
        $(id).style.display = 'none';
      });
    }

    function fillProfileForm(profile) {
      $('profileName').value = state.user.name || '';
      $('profileAgency').value = state.user.agency || '';
      document.querySelectorAll('input[name="uploadBlog"]').forEach(input => {
        input.checked = input.value === (profile.uploadBlog || '');
      });
      $('blogUrl').value = profile.blogUrl || '';
      $('personalUrl').value = profile.personalUrl || '';
      $('businessCardFile').value = '';
      $('businessCardCurrent').textContent = profile.businessCardUrl ? '기존 명함 이미지가 등록되어 있습니다.' : '';
      syncProfileFields();
      showProfileStatus('');
    }

    function syncProfileFields() {
      const mode = getUploadBlogMode();
      $('personalBlogFields').classList.toggle('active', mode === '본인 블로그');
      $('branchBlogFields').classList.toggle('active', mode === '지점 블로그');
    }

    function getUploadBlogMode() {
      const checked = document.querySelector('input[name="uploadBlog"]:checked');
      return checked ? checked.value : '';
    }

    async function handleProfileSubmit(event) {
      event.preventDefault();
      if (!state.user || !state.user.notionPageId) {
        showProfileStatus('노션페이지 ID가 없습니다. 다시 로그인해주세요.', 'error');
        return;
      }

      const payload = {
        action: 'saveProfile',
        notionPageId: state.user.notionPageId,
        uploadBlog: getUploadBlogMode(),
        blogUrl: $('blogUrl').value.trim(),
        personalUrl: $('personalUrl').value.trim(),
        businessCardUrl: state.user.profile && state.user.profile.businessCardUrl ? state.user.profile.businessCardUrl : '',
      };

      if (!payload.uploadBlog) {
        showProfileStatus('업로드 블로그를 선택해주세요.', 'error');
        return;
      }
      if (payload.uploadBlog === '본인 블로그' && !payload.blogUrl) {
        showProfileStatus('블로그 URL을 입력해주세요.', 'error');
        return;
      }
      if (payload.uploadBlog === '지점 블로그' && !payload.personalUrl) {
        showProfileStatus('본인 URL을 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showProfileStatus('내 정보를 저장하는 중입니다.');
        if (payload.uploadBlog === '지점 블로그') {
          payload.businessCardUrl = await ensureBusinessCardUploaded_();
        }
        const res = await apiGet(payload);
        if (!res.ok) throw new Error(res.error || '내 정보 저장에 실패했습니다.');
        const data = res.data || {};
        state.user.profile = data.profile || {};
        state.user.profileComplete = !!data.complete;
        state.profileRequired = !state.user.profileComplete;
        saveSession(state.user);
        if (!state.user.profileComplete) {
          showProfileStatus('필수 정보를 모두 입력해주세요.', 'error');
          return;
        }
        enterHome();
      }, showProfileStatus);
    }

    async function ensureBusinessCardUploaded_() {
      const file = $('businessCardFile').files[0];
      const existingUrl = state.user.profile && state.user.profile.businessCardUrl;

      if (!file && existingUrl) return existingUrl;
      if (!file) throw new Error('본인 명함 이미지를 선택해주세요.');

      showProfileStatus('명함 이미지를 업로드하는 중입니다.');
      const fileData = await fileToDataUrl(file);
      const res = await apiPost({
        action: 'uploadBusinessCard',
        notionPageId: state.user.notionPageId,
        fileName: file.name,
        fileData,
      });

      if (!res.ok) throw new Error(res.error || '명함 이미지 업로드에 실패했습니다.');
      if (!res.data || !res.data.url) throw new Error('명함 이미지 URL을 받지 못했습니다.');
      return res.data.url;
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('명함 이미지 파일을 읽지 못했습니다.'));
        reader.readAsDataURL(file);
      });
    }

    function showProfileStatus(message, type) {
      $('profileStatus').className = `status ${type || ''}`;
      $('profileStatus').textContent = message || '';
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      state.user = null;
      $('homeScreen').classList.remove('active');
      $('authScreen').classList.add('active');
      $('homeScreen').style.display = 'none';
      $('profileScreen').style.display = 'none';
      $('authScreen').style.display = 'flex';
      closeDrawer();
      $('password').value = '';
      showStatus('로그아웃되었습니다.', 'ok');
    }

    function openDrawer() {
      $('drawerBackdrop').classList.add('active');
    }

    function closeDrawer() {
      $('drawerBackdrop').classList.remove('active');
    }

    function closeDrawerOnBackdrop(event) {
      if (event.target === $('drawerBackdrop')) closeDrawer();
    }

    function openComingSoon(title) {
      closeDrawer();
      $('modalTitle').textContent = title;
      $('modalText').textContent = '이 기능은 다음 단계에서 API를 연결하면 바로 사용할 수 있게 열어둘 예정입니다.';
      $('modal').classList.add('active');
    }

    function closeModal() {
      $('modal').classList.remove('active');
    }

    function closeModalOnBackdrop(event) {
      if (event.target === $('modal')) closeModal();
    }

    async function withLoading(task, statusFn) {
      if (state.loading) return;
      state.loading = true;
      setButtonsDisabled(true);

      try {
        await task();
      } catch (error) {
        (statusFn || showStatus)(error.message || String(error), 'error');
      } finally {
        state.loading = false;
        setButtonsDisabled(false);
      }
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('button').forEach(button => {
        if (!button.classList.contains('drawer-close')) button.disabled = disabled;
      });
    }

    function apiGet(params) {
      return new Promise((resolve, reject) => {
        const callback = `jsonp_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const url = new URL(API_URL);

        Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        url.searchParams.set('callback', callback);
        url.searchParams.set('_', Date.now());

        const script = document.createElement('script');
        script.async = true;
        script.referrerPolicy = 'no-referrer';
        script.crossOrigin = 'anonymous';
        let settled = false;
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('API 응답 시간이 초과되었습니다. 모바일 네트워크를 확인한 뒤 다시 시도해주세요.'));
        }, 45000);

        window[callback] = data => {
          if (settled) return;
          settled = true;
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          if (settled) return;
          settled = true;
          cleanup();
          reject(new Error('API를 불러오지 못했습니다. 배포 URL 또는 모바일 네트워크를 확인해주세요.'));
        };

        function cleanup() {
          clearTimeout(timer);
          delete window[callback];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.src = url.toString();
        (document.head || document.documentElement).appendChild(script);
      });
    }

    async function apiPost(payload) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload),
      });

      return response.json();
    }

    function showStatus(message, type) {
      $('status').className = `status ${type || ''}`;
      $('status').textContent = message || '';
    }

    function clearStatus() {
      showStatus('');
    }

    function saveSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    }

    function readSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      } catch (error) {
        return null;
      }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      }[char]));
    }
  </script>
</body>
</html>
