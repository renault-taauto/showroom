<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>영업담당 로그인</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{background:#f5f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
    button,input,select{font:inherit}
    button{border:0;cursor:pointer}
    .app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:#fff}
    .screen{display:none;min-height:100vh;padding:calc(env(safe-area-inset-top) + 22px) 18px 28px}
    .screen.active{display:flex}
    .auth{flex-direction:column;justify-content:center;gap:22px}
    .home{flex-direction:column;gap:18px}
    .brand{display:grid;gap:8px}
    .mark{width:48px;height:48px;border-radius:15px;background:#111827;color:#fff;display:grid;place-items:center;font-size:21px}
    h1{margin:0;font-size:26px;letter-spacing:0}
    h2{margin:0;font-size:20px}
    p{margin:0;color:#667085;font-size:14px;line-height:1.45}
    .panel{display:grid;gap:14px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px;border-radius:14px;background:#eef1f5}
    .tab{min-height:42px;border-radius:11px;background:transparent;color:#667085}
    .tab.active{background:#fff;color:#111827;box-shadow:0 4px 14px rgba(15,23,42,.08)}
    .form{display:grid;gap:12px}
    .field{display:grid;gap:7px}
    label{font-size:13px;color:#344054}
    input,select{width:100%;min-height:52px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;padding:12px 14px;color:#101828;font-size:16px;outline:none}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#667085 50%),linear-gradient(135deg,#667085 50%,transparent 50%);background-position:calc(100% - 20px) 23px,calc(100% - 14px) 23px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
    input:focus,select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
    .primary,.secondary,.ghost{width:100%;min-height:52px;border-radius:14px}
    .primary{background:#111827;color:#fff}
    .secondary{background:#eef1f5;color:#111827}
    .ghost{background:transparent;color:#667085}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{min-height:20px;color:#667085;font-size:13px;white-space:pre-wrap;line-height:1.45}
    .status.error{color:#d92d20}
    .status.ok{color:#067647}
    .hint{font-size:12px;color:#98a2b3;line-height:1.4}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .card{border:1px solid #eaecf0;border-radius:14px;padding:14px;display:grid;gap:6px}
    .info{display:grid;gap:10px}
    .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
    .row span:first-child{color:#667085}
  </style>
</head>
<body>
  <main class="app">
    <section id="authScreen" class="screen auth active">
      <div class="brand">
        <div class="mark">B</div>
        <h1>영업담당 로그인</h1>
        <p>영업담당 시트에 등록된 사람만 사용할 수 있습니다.</p>
        <p class="hint">HTML 빌드: 2026-06-07-login-only-1</p>
        <p id="apiStatus" class="status">API 확인 중입니다.</p>
        <button class="ghost" type="button" onclick="openApiTest()">API 직접 확인</button>
      </div>

      <div class="panel">
        <div class="tabs">
          <button id="loginTab" class="tab active" type="button" onclick="setMode('login')">로그인</button>
          <button id="registerTab" class="tab" type="button" onclick="setMode('register')">최초 가입</button>
        </div>

        <form id="authForm" class="form">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="agency">소속 대리점</label>
            <select id="agency" required>
              <option value="">대리점 선택</option>
            </select>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <div id="passwordHint" class="hint">가입 때 만든 비밀번호를 입력하세요.</div>
          </div>
          <div id="status" class="status"></div>
          <button id="submitBtn" class="primary" type="submit">로그인</button>
          <button class="secondary" type="button" onclick="checkMember()">가입 가능 확인</button>
        </form>
      </div>
    </section>

    <section id="homeScreen" class="screen home">
      <div class="topbar">
        <div>
          <h2 id="homeTitle">로그인 완료</h2>
          <p id="homeSubtitle"></p>
        </div>
      </div>
      <div class="card info">
        <div class="row"><span>이름</span><span id="homeName"></span></div>
        <div class="row"><span>소속 대리점</span><span id="homeAgency"></span></div>
        <div class="row"><span>노션 페이지</span><span id="homeNotion"></span></div>
      </div>
      <button class="secondary" type="button" onclick="logout()">로그아웃</button>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxJOlnA4b9l3bzZnZi2AtKm-S2-fYSoK8fCQx6Sbm8rlIixxU0Gbfv0_g2JRlKEvr-k/exec';
    const EXPECTED_API_VERSION = '2026-06-07-mobile-login-only-1';
    const SESSION_KEY = 'salesLoginSession_v1';

    const state = {
      mode: 'login',
      loading: false,
      apiVersion: '',
      user: null,
    };

    const $ = id => document.getElementById(id);

    init();

    function init() {
      $('authForm').addEventListener('submit', handleSubmit);
      const saved = readSession();
      if (saved && saved.name && saved.agency) {
        state.user = saved;
        showHome();
      }
      boot();
    }

    async function boot() {
      await loadVersion();
      await loadAgencies();
    }

    async function loadVersion() {
      try {
        const res = await api({ action: 'version' });
        if (!res.ok) throw new Error(res.error || 'API 확인 실패');
        state.apiVersion = res.version || '';
        $('apiStatus').className = res.version === EXPECTED_API_VERSION ? 'status ok' : 'status error';
        $('apiStatus').textContent = res.version === EXPECTED_API_VERSION
          ? `API 연결됨: ${res.version}`
          : `API 연결됨: ${res.version}\nApps Script 최신 배포 필요: ${EXPECTED_API_VERSION}`;
      } catch (error) {
        state.apiVersion = '';
        $('apiStatus').className = 'status error';
        $('apiStatus').textContent = error.message || String(error);
      }
    }

    async function loadAgencies() {
      try {
        const res = await api({ action: 'agencies' });
        if (!res.ok) throw new Error(res.error || '대리점 목록을 불러오지 못했습니다.');
        const agencies = Array.isArray(res.data) ? res.data : [];
        $('agency').innerHTML = '<option value="">대리점 선택</option>' +
          agencies.map(agency => `<option value="${esc(agency)}">${esc(agency)}</option>`).join('');
      } catch (error) {
        showStatus(error.message || String(error), 'error');
      }
    }

    function setMode(mode) {
      state.mode = mode;
      $('loginTab').classList.toggle('active', mode === 'login');
      $('registerTab').classList.toggle('active', mode === 'register');
      $('submitBtn').textContent = mode === 'login' ? '로그인' : '비밀번호 생성';
      $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
      $('passwordHint').textContent = mode === 'login'
        ? '가입 때 만든 비밀번호를 입력하세요.'
        : '영문과 숫자를 포함한 4~8자로 생성하세요.';
      showStatus('');
    }

    async function checkMember() {
      const base = getFormValues();
      if (!base.name || !base.agency) {
        showStatus('이름과 소속 대리점을 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showStatus('가입 가능 여부를 확인하는 중입니다.');
        const res = await api({ action: 'checkMember', name: base.name, agency: base.agency });
        if (!res.ok) throw new Error(res.error || '확인 실패');
        if (!res.data.exists) {
          showStatus(res.data.message || '등록된 영업담당이 아닙니다.', 'error');
          return;
        }
        showStatus(res.data.registered ? '이미 가입되어 있습니다. 로그인해주세요.' : '가입 가능합니다. 비밀번호를 생성해주세요.', 'ok');
      });
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const values = getFormValues();
      if (!values.name || !values.agency || !values.password) {
        showStatus('모든 항목을 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showStatus(state.mode === 'login' ? '로그인 중입니다.' : '가입 처리 중입니다.');
        const res = await api({
          action: state.mode === 'login' ? 'login' : 'register',
          name: values.name,
          agency: values.agency,
          password: values.password,
        });
        if (!res.ok) throw new Error(res.error || '요청 실패');
        const data = res.data || {};
        if (state.mode === 'login' && data.loggedIn !== true) throw new Error('로그인 응답이 올바르지 않습니다.');
        if (state.mode === 'register' && data.registered !== true) throw new Error('가입 응답이 올바르지 않습니다.');

        state.user = {
          name: data.name || values.name,
          agency: data.agency || values.agency,
          notionPageId: data.notionPageId || '',
          loggedAt: new Date().toISOString(),
        };
        saveSession(state.user);
        showHome();
      });
    }

    function getFormValues() {
      return {
        name: $('name').value.trim(),
        agency: $('agency').value.trim(),
        password: $('password').value.trim(),
      };
    }

    function showHome() {
      $('authScreen').classList.remove('active');
      $('homeScreen').classList.add('active');
      $('homeTitle').textContent = `${state.user.name}님`;
      $('homeSubtitle').textContent = '로그인되었습니다.';
      $('homeName').textContent = state.user.name || '-';
      $('homeAgency').textContent = state.user.agency || '-';
      $('homeNotion').textContent = state.user.notionPageId ? '연결됨' : '없음';
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      state.user = null;
      $('homeScreen').classList.remove('active');
      $('authScreen').classList.add('active');
      showStatus('');
    }

    function api(params) {
      return new Promise((resolve, reject) => {
        const callback = `__mobileLoginCb_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const query = new URLSearchParams();
        Object.keys(params || {}).forEach(key => {
          const value = params[key];
          if (value !== undefined && value !== null) query.set(key, String(value));
        });
        query.set('callback', callback);
        query.set('_', String(Date.now()));

        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('API 응답 시간이 초과되었습니다. 모바일 네트워크가 느리거나 Apps Script 배포가 응답하지 않습니다.'));
        }, 30000);

        window[callback] = data => {
          cleanup();
          resolve(data);
        };

        script.async = true;
        script.onerror = () => {
          cleanup();
          reject(new Error('API 스크립트 로드에 실패했습니다. API 직접 확인 버튼으로 JSON이 열리는지 확인해주세요.'));
        };
        script.src = `${API_URL}?${query.toString()}`;
        document.head.appendChild(script);

        function cleanup() {
          clearTimeout(timer);
          delete window[callback];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
      });
    }

    async function withLoading(fn) {
      if (state.loading) return;
      state.loading = true;
      setButtonsDisabled(true);
      try {
        await fn();
      } catch (error) {
        showStatus(error.message || String(error), 'error');
      } finally {
        state.loading = false;
        setButtonsDisabled(false);
      }
    }

    function openApiTest() {
      window.open(`${API_URL}?action=version&_=${Date.now()}`, '_blank', 'noopener');
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('button').forEach(button => {
        button.disabled = disabled;
      });
    }

    function showStatus(message, type) {
      $('status').className = `status ${type || ''}`;
      $('status').textContent = message || '';
    }

    function saveSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    }

    function readSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      } catch (error) {
        return null;
      }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      }[char]));
    }
  </script>
</body>
</html>
