<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>영업담당 포털</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{background:#f5f6f8;color:#171923;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;line-height:1.45}
    button,input,select,textarea{font:inherit}
    button{border:0;cursor:pointer}
    .app{width:100%;max-width:480px;min-height:100vh;margin:0 auto;background:#fff}
    .screen{display:none;min-height:100vh;padding:env(safe-area-inset-top) 18px 28px}
    .screen.active{display:block}
    .auth{display:flex;min-height:100vh;flex-direction:column;justify-content:center;gap:22px}
    .brand{display:grid;gap:8px}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-size:20px;font-weight:900}
    h1{margin:0;font-size:26px;letter-spacing:0}
    h2{margin:0;font-size:20px}
    p{margin:0;color:#667085;font-size:14px}
    .panel{display:grid;gap:14px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px;border-radius:14px;background:#eef1f5}
    .tab{min-height:42px;border-radius:11px;background:transparent;color:#667085;font-weight:800}
    .tab.active{background:#fff;color:#111827;box-shadow:0 4px 14px rgba(15,23,42,.08)}
    .form{display:grid;gap:12px}
    .field{display:grid;gap:7px}
    label{font-size:13px;font-weight:800;color:#344054}
    input,select{width:100%;min-height:50px;border:1px solid #d0d5dd;border-radius:14px;background:#fff;padding:12px 14px;color:#101828;font-size:16px;outline:none}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#667085 50%),linear-gradient(135deg,#667085 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px}
    input:focus,select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
    .hint{font-size:12px;color:#98a2b3}
    .primary,.secondary,.ghost{width:100%;min-height:50px;border-radius:14px;font-weight:900}
    .primary{background:#111827;color:#fff}
    .secondary{background:#eef1f5;color:#111827}
    .ghost{background:transparent;color:#667085}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{min-height:20px;color:#667085;font-size:13px;white-space:pre-wrap}
    .status.error{color:#d92d20;font-weight:800}
    .status.ok{color:#067647;font-weight:800}
    .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -18px;padding:14px 18px 10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}
    .hello{display:grid;gap:2px}
    .hello strong{font-size:18px}
    .menu-btn{width:42px;height:42px;border-radius:14px;background:#f2f4f7;display:grid;place-items:center}
    .menu-icon,.menu-icon:before,.menu-icon:after{display:block;width:18px;height:2px;border-radius:99px;background:#111827;content:""}
    .menu-icon:before{transform:translateY(-6px)}
    .menu-icon:after{transform:translateY(4px)}
    .home{display:grid;gap:18px;padding-top:8px}
    .banner{min-height:132px;border-radius:18px;background:linear-gradient(135deg,#111827,#475467);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
    .banner strong{font-size:20px}
    .section{display:grid;gap:10px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .section-head h2{font-size:16px}
    .list{display:grid;gap:8px}
    .item{min-height:54px;border:1px solid #eaecf0;border-radius:14px;padding:12px;background:#fff}
    .item-title{font-weight:800;font-size:14px}
    .item-meta{margin-top:2px;color:#98a2b3;font-size:12px}
    .empty{padding:14px;border-radius:14px;background:#f9fafb;color:#98a2b3;font-size:13px;text-align:center}
    .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .quick button{min-height:68px;border-radius:16px;background:#f2f4f7;color:#101828;font-weight:900;text-align:left;padding:14px}
    .drawer-backdrop{position:fixed;inset:0;z-index:50;display:none;background:rgba(15,23,42,.38)}
    .drawer-backdrop.active{display:block}
    .drawer{position:absolute;right:0;top:0;width:min(320px,86vw);height:100%;background:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 18px;box-shadow:-18px 0 48px rgba(15,23,42,.2)}
    .drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px}
    .drawer-close{width:38px;height:38px;border-radius:13px;background:#f2f4f7;color:#111827;font-size:22px}
    .menu-list{display:grid;gap:8px}
    .menu-list button{width:100%;min-height:48px;border-radius:14px;background:#f9fafb;color:#101828;text-align:left;padding:12px 14px;font-weight:800}
    .logout{margin-top:14px;background:#fff1f3!important;color:#c01048!important}
    .modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(15,23,42,.38)}
    .modal.active{display:flex}
    .modal-panel{width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;background:#fff;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);display:grid;gap:12px}
    .modal-panel .secondary{margin-top:2px}
  </style>
</head>
<body>
  <main class="app">
    <section id="authScreen" class="screen auth active">
      <div class="brand">
        <div class="brand-mark">B</div>
        <h1>영업담당 포털</h1>
        <p>등록된 영업담당만 사용할 수 있습니다.</p>
      </div>

      <div class="panel">
        <div class="tabs" aria-label="로그인 방식">
          <button id="loginTab" class="tab active" type="button" onclick="setAuthMode('login')">로그인</button>
          <button id="registerTab" class="tab" type="button" onclick="setAuthMode('register')">최초 가입</button>
        </div>

        <form id="authForm" class="form">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="agency">소속 대리점</label>
            <select id="agency" required>
              <option value="">대리점 선택</option>
            </select>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <div id="passwordHint" class="hint">영문과 숫자를 포함한 4~8자</div>
          </div>
          <div id="status" class="status"></div>
          <button id="submitBtn" class="primary" type="submit">로그인</button>
          <button id="checkBtn" class="secondary" type="button" onclick="checkMember()">가입 가능 확인</button>
        </form>
      </div>
    </section>

    <section id="homeScreen" class="screen">
      <header class="topbar">
        <div class="hello">
          <strong id="homeName">안녕하세요</strong>
          <p id="homeAgency"></p>
        </div>
        <button class="menu-btn" type="button" aria-label="메뉴 열기" onclick="openDrawer()">
          <span class="menu-icon"></span>
        </button>
      </header>

      <div class="home">
        <button class="banner" type="button" onclick="openComingSoon('시책 참여 신청')">
          <strong>6월 블로그 시책</strong>
          <span>배너 클릭 후 참여 신청 폼으로 연결됩니다.</span>
        </button>

        <section class="section">
          <div class="section-head">
            <h2>공지사항</h2>
          </div>
          <div class="list">
            <div class="item">
              <div class="item-title">모바일 포털 준비 중</div>
              <div class="item-meta">공지 API 연결 전 임시 표시입니다.</div>
            </div>
          </div>
        </section>

        <section class="section">
          <button class="primary" type="button" onclick="openComingSoon('블로그 원고 제작 요청')">블로그 원고 제작 요청</button>
        </section>

        <section class="section">
          <div class="section-head">
            <h2>완료된 원고</h2>
          </div>
          <div class="empty">아직 표시할 완료 원고가 없습니다.</div>
        </section>
      </div>
    </section>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeDrawerOnBackdrop(event)">
    <aside class="drawer" aria-label="메뉴">
      <div class="drawer-head">
        <div>
          <h2>메뉴</h2>
          <p id="drawerUser"></p>
        </div>
        <button class="drawer-close" type="button" aria-label="닫기" onclick="closeDrawer()">×</button>
      </div>
      <div class="menu-list">
        <button type="button" onclick="openComingSoon('내 정보')">내 정보</button>
        <button type="button" onclick="openComingSoon('나의 원고 리스트')">나의 원고 리스트</button>
        <button type="button" onclick="openComingSoon('업로드 콘텐츠')">업로드 콘텐츠</button>
        <button type="button" onclick="openComingSoon('시책 점수 확인')">시책 점수 확인</button>
        <button type="button" onclick="openComingSoon('블로그 스킨제작 요청')">블로그 스킨제작 요청</button>
        <button class="logout" type="button" onclick="logout()">로그아웃</button>
      </div>
    </aside>
  </div>

  <div id="modal" class="modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-panel">
      <h2 id="modalTitle">준비 중</h2>
      <p id="modalText">이 기능은 다음 단계에서 연결합니다.</p>
      <button class="secondary" type="button" onclick="closeModal()">확인</button>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzYIDXKYp1H73HNPLKfC4U_WLrl0tnZxtxMmX_nSujrHi18QO0P4M0-vGOynINfD4lt/exec';
    const SESSION_KEY = 'salesMemberSession_v1';

    const state = {
      authMode: 'login',
      loading: false,
      user: null,
    };

    const $ = id => document.getElementById(id);

    init();

    function init() {
      const saved = readSession();
      if (saved && saved.name && saved.agency) {
        state.user = saved;
        showHome();
      }

      $('authForm').addEventListener('submit', handleAuthSubmit);
      loadAgencies();
    }

    async function loadAgencies() {
      const select = $('agency');

      try {
        const res = await apiGet({ action: 'agencies' });
        if (!res.ok) throw new Error(res.error || '대리점 목록을 불러오지 못했습니다.');

        const agencies = Array.isArray(res.data) ? res.data : [];
        select.innerHTML = '<option value="">대리점 선택</option>' +
          agencies.map(agency => `<option value="${esc(agency)}">${esc(agency)}</option>`).join('');

        if (state.user && state.user.agency) {
          select.value = state.user.agency;
        }
      } catch (error) {
        select.innerHTML = '<option value="">대리점 목록을 불러오지 못했습니다</option>';
        showStatus(error.message || String(error), 'error');
      }
    }

    function setAuthMode(mode) {
      state.authMode = mode;
      $('loginTab').classList.toggle('active', mode === 'login');
      $('registerTab').classList.toggle('active', mode === 'register');
      $('submitBtn').textContent = mode === 'login' ? '로그인' : '비밀번호 생성';
      $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
      $('passwordHint').textContent = mode === 'login'
        ? '가입 때 만든 비밀번호를 입력하세요.'
        : '영문과 숫자를 포함한 4~8자';
      clearStatus();
    }

    async function checkMember() {
      const name = $('name').value.trim();
      const agency = $('agency').value.trim();

      if (!name || !agency) {
        showStatus('이름과 소속 대리점을 먼저 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showStatus('가입 가능 여부를 확인하는 중입니다.');
        const res = await apiGet({ action: 'checkMember', name, agency });
        if (!res.ok) throw new Error(res.error || '확인에 실패했습니다.');

        if (!res.data.exists) {
          showStatus(res.data.message || '등록 가능한 영업담당이 아닙니다.', 'error');
          return;
        }

        showStatus(res.data.registered
          ? '이미 가입된 영업담당입니다. 로그인해주세요.'
          : '가입 가능합니다. 비밀번호를 생성해주세요.', 'ok');
      });
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();

      const payload = {
        action: state.authMode === 'login' ? 'login' : 'register',
        name: $('name').value.trim(),
        agency: $('agency').value.trim(),
        password: $('password').value.trim(),
      };

      if (!payload.name || !payload.agency || !payload.password) {
        showStatus('모든 항목을 입력해주세요.', 'error');
        return;
      }

      await withLoading(async () => {
        showStatus(state.authMode === 'login' ? '로그인 중입니다.' : '가입 처리 중입니다.');
        const res = await apiGet(payload);
        if (!res.ok) throw new Error(res.error || '요청에 실패했습니다.');

        const data = res.data || {};
        if (data.ok === false) {
          throw new Error(data.error || '요청에 실패했습니다.');
        }

        const user = {
          name: data.name || payload.name,
          agency: data.agency || payload.agency,
          notionPageId: data.notionPageId || '',
          loggedAt: new Date().toISOString(),
        };

        saveSession(user);
        state.user = user;
        showStatus(state.authMode === 'login' ? '로그인되었습니다.' : '가입되었습니다.', 'ok');
        window.setTimeout(showHome, 80);
      });
    }

    function showHome() {
      if (!state.user) return;
      $('authScreen').classList.remove('active');
      $('homeScreen').classList.add('active');
      $('homeName').textContent = `${state.user.name}님`;
      $('homeAgency').textContent = state.user.agency;
      $('drawerUser').textContent = `${state.user.name} / ${state.user.agency}`;
      closeDrawer();
      clearStatus();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function logout() {
      localStorage.removeItem(SESSION_KEY);
      state.user = null;
      $('homeScreen').classList.remove('active');
      $('authScreen').classList.add('active');
      closeDrawer();
      $('password').value = '';
      showStatus('로그아웃되었습니다.', 'ok');
    }

    function openDrawer() {
      $('drawerBackdrop').classList.add('active');
    }

    function closeDrawer() {
      $('drawerBackdrop').classList.remove('active');
    }

    function closeDrawerOnBackdrop(event) {
      if (event.target === $('drawerBackdrop')) closeDrawer();
    }

    function openComingSoon(title) {
      closeDrawer();
      $('modalTitle').textContent = title;
      $('modalText').textContent = '이 기능은 다음 단계에서 API를 연결하면 바로 사용할 수 있게 열어둘 예정입니다.';
      $('modal').classList.add('active');
    }

    function closeModal() {
      $('modal').classList.remove('active');
    }

    function closeModalOnBackdrop(event) {
      if (event.target === $('modal')) closeModal();
    }

    async function withLoading(task) {
      if (state.loading) return;
      state.loading = true;
      setButtonsDisabled(true);

      try {
        await task();
      } catch (error) {
        showStatus(error.message || String(error), 'error');
      } finally {
        state.loading = false;
        setButtonsDisabled(false);
      }
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('button').forEach(button => {
        if (!button.classList.contains('drawer-close')) button.disabled = disabled;
      });
    }

    function apiGet(params) {
      return new Promise((resolve, reject) => {
        const callback = `jsonp_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const url = new URL(API_URL);

        Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        url.searchParams.set('callback', callback);

        const script = document.createElement('script');
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('API 응답 시간이 초과되었습니다.'));
        }, 20000);

        window[callback] = data => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('API 요청에 실패했습니다.'));
        };

        function cleanup() {
          clearTimeout(timer);
          delete window[callback];
          script.remove();
        }

        script.src = url.toString();
        document.body.appendChild(script);
      });
    }

    async function apiPost(payload) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload),
      });

      return response.json();
    }

    function showStatus(message, type) {
      $('status').className = `status ${type || ''}`;
      $('status').textContent = message || '';
    }

    function clearStatus() {
      showStatus('');
    }

    function saveSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    }

    function readSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      } catch (error) {
        return null;
      }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;',
      }[char]));
    }
  </script>
</body>
</html>
