<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>관리자 앱</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0}
    body{background:#eef4fb;color:#102033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
    button,select,input{font:inherit}
    button{border:0;cursor:pointer}
    a{color:inherit}
    .app{width:100%;max-width:720px;min-height:100vh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 28px;display:grid;gap:14px;align-content:start}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    h1{margin:0;font-size:22px;color:#102033}
    h2{margin:0;font-size:16px}
    p{margin:4px 0 0;color:#6a7d94;font-size:13px;line-height:1.45}
    .panel{background:#fff;border:1px solid #dbeafe;border-radius:18px;padding:14px;display:grid;gap:12px;box-shadow:0 12px 28px rgba(38,84,134,.08)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .primary,.secondary,.small{min-height:44px;border-radius:13px;background:#1268f3;color:#fff;padding:0 13px}
    .secondary{background:#e8f2ff;color:#1268f3}
    .small{min-height:34px;border-radius:10px;font-size:12px}
    .status{min-height:18px;font-size:13px;color:#6a7d94;white-space:pre-wrap}
    .status.error{color:#d92d20}
    .status.ok{color:#067647}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:13px;display:grid;gap:4px;box-shadow:0 10px 22px rgba(38,84,134,.06)}
    .stat strong{font-size:23px;color:#1268f3}
    .stat span{font-size:12px;color:#6a7d94}
    .list{display:grid;gap:8px}
    .item{background:#fff;border:1px solid #dbeafe;border-radius:16px;padding:13px;display:grid;gap:9px}
    .item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .title{font-size:14px;font-weight:800;line-height:1.35;color:#102033}
    .meta{font-size:12px;color:#6a7d94;line-height:1.45}
    .badge{flex:0 0 auto;border-radius:999px;padding:5px 9px;background:#e8f2ff;color:#1268f3;font-size:12px;font-weight:800}
    .badge.warn{background:#fff1f3;color:#d92d20}
    .badge.done{background:#ecfdf3;color:#067647}
    .badge.dark{background:#153c75;color:#fff}
    .actions,.links,.menu{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .actions select{min-height:36px;border:1px solid #cfe3ff;border-radius:10px;background:#fff;padding:6px 8px;color:#102033}
    .links a{font-size:12px;text-decoration:underline;color:#1268f3}
    .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .menu button{min-height:52px;border-radius:16px;background:#fff;border:1px solid #dbeafe;color:#102033;box-shadow:0 10px 22px rgba(38,84,134,.06);font-weight:800}
    .menu button.active{background:#1268f3;color:#fff;border-color:#1268f3}
    .count{display:inline-grid;min-width:20px;height:20px;border-radius:999px;background:#d92d20;color:#fff;place-items:center;font-size:12px;margin-left:5px;padding:0 6px}
    .view{display:none}
    .view.active{display:grid;gap:10px}
    .month-group{display:grid;gap:8px}
    .month-head{width:100%;min-height:42px;border-radius:13px;background:#e8f2ff;color:#153c75;padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-weight:800}
    .month-items{display:grid;gap:8px}
    .month-group.collapsed .month-items{display:none}
    .empty{padding:18px;border-radius:16px;background:#fff;border:1px dashed #bfd7f7;color:#8aa0b8;text-align:center;font-size:13px}
    @media (max-width:560px){.top{display:grid}.summary,.menu{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>관리자 앱</h1>
      <p>등록 요청과 진행중 원고</p>
    </div>
    <button class="secondary" type="button" onclick="loadDashboard()">새로고침</button>
  </header>

  <section class="summary">
    <div class="stat"><strong id="requestCount">0</strong><span>등록 요청</span></div>
    <div class="stat"><strong id="progressCount">0</strong><span>진행중</span></div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>등록 요청 / 진행중</h2><p id="activeCount"></p></div>
    <div id="activeList" class="list"></div>
  </section>

  <section class="menu">
    <button id="completedBtn" type="button" onclick="openView('completed')">완료 확인<span id="uncheckedCount" class="count" style="display:none">0</span></button>
    <button id="campaignBtn" type="button" onclick="openView('campaign')">시책 신청 현황</button>
  </section>

  <section id="completedView" class="view">
    <div class="panel">
      <div class="section-head"><h2>완료 리스트</h2><p>최신순 · 월별</p></div>
      <div id="completedList" class="list"></div>
    </div>
  </section>

  <section id="campaignView" class="view">
    <div class="panel">
      <div class="section-head"><h2>시책 신청 현황</h2><p id="campaignCount"></p></div>
      <div id="campaignList" class="list"></div>
    </div>
  </section>

  <div id="adminStatus" class="status"></div>
</main>

<script>
  const SUPABASE_URL = 'https://gwajgqdqwovwuqhwoebq.supabase.co';
  const GAS_FUNCTION_NAME = 'swift-function';
  const state = { activePosts: [], completedPosts: [], campaigns: [], view: '' };
  const $ = id => document.getElementById(id);

  loadDashboard();

  async function gasAction(action, body) {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${GAS_FUNCTION_NAME}`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...(body || {}) }),
    });
    const text = await res.text();
    let data;
    try { data = text ? JSON.parse(text) : null; } catch { throw new Error(`GAS 응답 오류\n${text.slice(0, 160)}`); }
    if (!res.ok || !data || data.ok !== true) throw new Error((data && (data.message || data.error)) || `GAS 오류 (${res.status})`);
    return data.data;
  }

  async function loadDashboard() {
    setStatus('불러오는 중입니다.');
    try {
      const [activePosts, completedPosts, campaigns] = await Promise.all([
        gasAction('getAdminActivePosts'),
        gasAction('getAdminCompletedPosts'),
        gasAction('getCampaignApplications'),
      ]);
      state.activePosts = Array.isArray(activePosts) ? activePosts : [];
      state.completedPosts = sortByDate(Array.isArray(completedPosts) ? completedPosts : []);
      state.campaigns = Array.isArray(campaigns) ? campaigns : [];
      renderActivePosts();
      renderCompletedPosts();
      renderCampaigns();
      setStatus('불러왔습니다.', 'ok');
    } catch (e) {
      setStatus(e.message || String(e), 'error');
      $('activeList').innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
    }
  }

  function renderActivePosts() {
    $('requestCount').textContent = state.activePosts.filter(p => p.status === '요청').length;
    $('progressCount').textContent = state.activePosts.filter(p => p.status === '진행중').length;
    $('activeCount').textContent = `${state.activePosts.length}건`;
    if (!state.activePosts.length) {
      $('activeList').innerHTML = '<div class="empty">등록 요청/진행중 원고가 없습니다.</div>';
      return;
    }
    $('activeList').innerHTML = state.activePosts.map(renderPostItem).join('');
  }

  function renderPostItem(p) {
    const google = p.googleUrl ? `<a href="${esc(p.googleUrl)}" target="_blank" rel="noopener">구글원고</a>` : '';
    const upload = p.uploadUrl ? `<a href="${esc(p.uploadUrl)}" target="_blank" rel="noopener">업로드보기</a>` : '';
    return `<article class="item">
      <div class="item-head">
        <div><div class="title">${esc(p.title || '제목 없음')}</div><div class="meta">${esc(p.date || '')} · ${esc(p.salesperson || '-')} · ${esc(p.agency || '-')} · ${esc(p.uploadBlog || '-')}</div></div>
        <span class="badge">${esc(p.status || '')}</span>
      </div>
      <div class="links">${google}${upload}</div>
      <div class="actions">
        <select data-page-id="${esc(p.pageId)}">
          <option value="요청"${p.status === '요청' ? ' selected' : ''}>요청</option>
          <option value="진행중"${p.status === '진행중' ? ' selected' : ''}>진행중</option>
          <option value="완료"${p.status === '완료' ? ' selected' : ''}>완료</option>
        </select>
        <button class="small" type="button" onclick="updateStatus(this)">상태 변경</button>
      </div>
    </article>`;
  }

  async function updateStatus(btn) {
    const select = btn.parentElement.querySelector('select');
    btn.disabled = true;
    setStatus('상태를 변경하는 중입니다.');
    try {
      await gasAction('updatePostStatus', { pageId: select.dataset.pageId, status: select.value });
      await loadDashboard();
      setStatus('상태가 변경되었습니다.', 'ok');
    } catch (e) {
      setStatus(e.message || String(e), 'error');
    } finally {
      btn.disabled = false;
    }
  }

  function openView(view) {
    state.view = state.view === view ? '' : view;
    $('completedView').classList.toggle('active', state.view === 'completed');
    $('campaignView').classList.toggle('active', state.view === 'campaign');
    $('completedBtn').classList.toggle('active', state.view === 'completed');
    $('campaignBtn').classList.toggle('active', state.view === 'campaign');
  }

  function renderCompletedPosts() {
    const unchecked = state.completedPosts.filter(p => !p.completedChecked).length;
    $('uncheckedCount').style.display = unchecked ? 'inline-grid' : 'none';
    $('uncheckedCount').textContent = unchecked > 99 ? '99+' : String(unchecked);
    if (!state.completedPosts.length) {
      $('completedList').innerHTML = '<div class="empty">완료된 원고가 없습니다.</div>';
      return;
    }
    const groups = groupByMonth(state.completedPosts);
    $('completedList').innerHTML = Object.keys(groups).map((month, index) => {
      const symbol = index === 0 ? '▾' : '▸';
      const collapsed = index === 0 ? '' : ' collapsed';
      const items = groups[month].map(p => {
        const checked = p.completedChecked ? `<span class="badge done">담당자 확인</span>` : '<span class="badge warn">담당자 미확인</span>';
        const checkedMeta = p.completedCheckedAt ? ` · 확인 ${esc(p.completedCheckedAt)}` : '';
        return `<article class="item">
          <div class="item-head">
            <div><div class="title">${esc(p.title || '제목 없음')}</div><div class="meta">${esc(p.date || '')} · ${esc(p.salesperson || '-')} · ${esc(p.agency || '-')}${checkedMeta}</div></div>
            ${checked}
          </div>
        </article>`;
      }).join('');
      return `<div class="month-group${collapsed}"><button class="month-head" type="button" onclick="toggleMonth(this)"><span>${esc(month)}</span><span>${groups[month].length}건 ${symbol}</span></button><div class="month-items">${items}</div></div>`;
    }).join('');
  }

  function renderCampaigns() {
    $('campaignCount').textContent = `${state.campaigns.length}건`;
    if (!state.campaigns.length) {
      $('campaignList').innerHTML = '<div class="empty">시책 신청 내역이 없습니다.</div>';
      return;
    }
    $('campaignList').innerHTML = state.campaigns.map(item => `<article class="item">
      <div class="item-head">
        <div><div class="title">${esc(item.name || '-')} · ${esc(item.agency || '-')}</div><div class="meta">${esc(item.appliedAt || '')} · ${esc(item.uploadBlog || '-')}</div></div>
        <span class="badge dark">${esc(item.score || '신청')}</span>
      </div>
      ${item.memo ? `<div class="meta">${esc(item.memo)}</div>` : ''}
    </article>`).join('');
  }

  function toggleMonth(btn) {
    const group = btn.closest('.month-group');
    group.classList.toggle('collapsed');
    const count = btn.querySelector('span:last-child');
    count.textContent = count.textContent.replace(/[▾▸]$/, group.classList.contains('collapsed') ? '▸' : '▾');
  }

  function groupByMonth(items) {
    return items.reduce((acc, item) => {
      const month = getMonthLabel(item.date);
      (acc[month] ||= []).push(item);
      return acc;
    }, {});
  }

  function sortByDate(items) {
    return items.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  }

  function getMonthLabel(dateText) {
    const value = String(dateText || '').trim();
    const match = value.match(/^(\d{4})-(\d{1,2})/);
    if (match) return `${match[1]}년 ${Number(match[2])}월`;
    return '날짜 없음';
  }

  function setStatus(msg, type) {
    $('adminStatus').className = 'status ' + (type || '');
    $('adminStatus').textContent = msg || '';
  }

  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
