<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>티에이오토 대리점 안내</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #111;
  }

  .top-banner {
    position: relative;
  }

  .top-banner img {
    width: 100%;
    display: block;
  }

  /* 이미지 내 "프로모션 상담 및 문의" 버튼 위에 투명 클릭 영역 */
  .promo-overlay {
    position: absolute;
    top: 74%;
    left: 20%;
    width: 60%;
    height: 5%;
    cursor: pointer;
    display: block;
  }

  header {
    text-align: center;
    padding: 18px 16px 14px;
    border-bottom: 1px solid #eee;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #777;
  }

  .container {
    padding: 12px;
  }

  .category {
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .category-toggle {
    width: 100%;
    background: #fff;
    border: none;
    padding: 13px 14px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .category-toggle .arrow {
    font-size: 12px;
    color: #999;
    transition: transform 0.2s ease;
  }

  .category.open .category-toggle .arrow {
    transform: rotate(180deg);
  }

  .branch-grid {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px;
    border-top: 1px solid #eee;
  }

  .category.open .branch-grid {
    display: grid;
  }

  @media (max-width: 360px) {
    .branch-grid { grid-template-columns: 1fr; }
  }

  .branch-card {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px;
  }

  .branch-name {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .branch-person {
    font-size: 13px;
    color: #444;
    margin-bottom: 4px;
  }

  .branch-location {
    font-size: 12px;
    color: #777;
    margin-bottom: 8px;
  }

  .branch-phone-text {
    font-size: 13px;
    font-weight: 700;
    color: #111;
    text-align: left;
    margin-bottom: 6px;
  }

  .branch-actions {
    display: flex;
    gap: 5px;
  }

  .btn-call, .btn-sms {
    flex: 1;
    display: block;
    text-align: center;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 0;
    border-radius: 6px;
    cursor: pointer;
    border: none;
  }

  .btn-call {
    background: #111;
    color: #fff;
  }

  .btn-sms {
    background: #f0f0f0;
    color: #111;
  }

  .empty-state {
    text-align: center;
    color: #999;
    font-size: 13px;
    padding: 40px 10px;
  }

  .updated-at {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    padding: 10px 0 20px;
  }

  /* 문자 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 14px 14px 0 0;
    padding: 20px 16px 32px;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .modal-sub {
    font-size: 12px;
    color: #888;
    margin-bottom: 16px;
  }

  .modal label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #444;
    margin-bottom: 4px;
  }

  .modal input, .modal select {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    margin-bottom: 12px;
    font-family: inherit;
  }

  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .modal-cancel {
    flex: 1;
    padding: 11px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .modal-confirm {
    flex: 2;
    padding: 11px 0;
    border: none;
    border-radius: 8px;
    background: #111;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- 상단 배너 이미지 -->
<div class="top-banner">
  <img src="https://raw.githubusercontent.com/renault-taauto/showroom/main/2.image/2.png"
       alt="신한캐피탈 프로모션">
  <a class="promo-overlay" onclick="document.getElementById('dealership').scrollIntoView({behavior:'smooth'})"></a>
</div>

<header>
  <h1>티에이오토 대리점 안내</h1>
  <p>가까운 대리점으로 문의 부탁드립니다.</p>
</header>

<div class="container" id="dealership">
  <div id="container"></div>
</div>

<div class="updated-at" id="updatedAt"></div>

<!-- 문자 모달 -->
<div class="modal-overlay" id="smsModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">문자 보내기</div>

    <label>이름</label>
    <input type="text" id="smsName" placeholder="예: 홍길동">

    <label>관심 차종</label>
    <select id="smsCar">
      <option value="">선택하세요</option>
      <option>필랑트</option>
      <option>그랑 콜레오스</option>
      <option>아르카나</option>
    </select>

    <label>연령대</label>
    <select id="smsAge">
      <option value="">선택하세요</option>
      <option>20대</option>
      <option>30대</option>
      <option>40대</option>
      <option>50대</option>
      <option>60대 이상</option>
    </select>

    <label>연락 가능 시간대</label>
    <select id="smsTime">
      <option value="">선택하세요</option>
      <option>오전 (10시~12시)</option>
      <option>점심 (12시~14시)</option>
      <option>오후 (14시~18시)</option>
      <option>저녁 (18시~20시)</option>
      <option>언제든지 가능</option>
    </select>

    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">취소</button>
      <button class="modal-confirm" onclick="sendSms()">문자 보내기</button>
    </div>
  </div>
</div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxsuk2HoylKPJD3_VQlrApOlZXlev1oHwFttQ6KRe4b75mZVXicuc4mcoLUUxAfbJeSLA/exec';

  const CATEGORY_ORDER = ['서울', '인천', '경기북부', '경기 남/동부', '강원'];
  let openCategories = new Set();
  let currentPhone = '';
  let currentBranch = '';

  function render(data) {
    const container = document.getElementById('container');

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty-state">등록된 지점 정보가 없습니다.</div>';
      return;
    }

    const grouped = {};
    data.forEach(item => {
      if (!grouped[item.category]) grouped[item.category] = [];
      grouped[item.category].push(item);
    });

    const categories = [...CATEGORY_ORDER.filter(c => grouped[c]),
                        ...Object.keys(grouped).filter(c => !CATEGORY_ORDER.includes(c))];

    let html = '';
    categories.forEach(cat => {
      const isOpen = openCategories.has(cat);
      const branches = grouped[cat];

      html += `<div class="category ${isOpen ? 'open' : ''}" data-category="${cat}">`;
      html += `<button class="category-toggle" onclick="toggleCategory('${cat}')">${cat} <span class="arrow">▼</span></button>`;
      html += `<div class="branch-grid">`;

      branches.forEach(b => {
        const tel = b.phone.replace(/[^0-9]/g, '');
        const phoneFormatted = formatPhone(tel);
        html += `
          <div class="branch-card">
            <div class="branch-name">${b.branch}</div>
            <div class="branch-person">${b.name}</div>
            <div class="branch-location">${b.location}</div>
            <div class="branch-phone-text">${phoneFormatted}</div>
            <div class="branch-actions">
              <a class="btn-call" href="tel:${tel}">📞 전화걸기</a>
              <button class="btn-sms" onclick="openModal('${tel}', '${b.branch}', '${b.name}')">✉️ 문자보내기</button>
            </div>
          </div>`;
      });

      html += `</div></div>`;
    });

    container.innerHTML = html;
  }

  function formatPhone(num) {
    if (num.length === 11) return num.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
    if (num.length === 10) return num.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
    return num;
  }

  function toggleCategory(cat) {
    if (openCategories.has(cat)) {
      openCategories.delete(cat);
    } else {
      openCategories.add(cat);
    }
    const el = document.querySelector(`.category[data-category="${cat}"]`);
    if (el) el.classList.toggle('open');
  }

  function openModal(phone, branch, name) {
    currentPhone = phone;
    currentBranch = branch;
    document.getElementById('modalTitle').textContent = branch + ' · ' + name + ' 지점장';
    document.getElementById('smsName').value = '';
    document.getElementById('smsCar').value = '';
    document.getElementById('smsAge').value = '';
    document.getElementById('smsTime').value = '';
    document.getElementById('smsModal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('smsModal').classList.remove('show');
  }

  function sendSms() {
    const name = document.getElementById('smsName').value.trim();
    const car  = document.getElementById('smsCar').value;
    const age  = document.getElementById('smsAge').value;
    const time = document.getElementById('smsTime').value;

    if (!name) { alert('이름을 입력해주세요.'); return; }
    if (!car)  { alert('관심 차종을 선택해주세요.'); return; }
    if (!age)  { alert('연령대를 선택해주세요.'); return; }
    if (!time) { alert('연락 가능 시간대를 선택해주세요.'); return; }

    const body =
      `안녕하세요, ${name}입니다.\n` +
      `신한캐피탈 프로모션을 보고 연락드립니다.\n` +
      `관심 차종: ${car}\n` +
      `연령대: ${age}\n` +
      `연락 가능 시간: ${time}\n` +
      `상담 부탁드립니다.`;

    window.location.href = `sms:${currentPhone}?body=${encodeURIComponent(body)}`;
    closeModal();
  }

  // 모달 바깥 터치 시 닫기
  document.getElementById('smsModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  function loadData() {
    // 캐시 먼저 렌더링
    const cached = localStorage.getItem('branchData');
    if (cached) {
      try { render(JSON.parse(cached)); } catch(e) {}
    }

    fetch(WEB_APP_URL, { redirect: 'follow' })
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        localStorage.setItem('branchData', JSON.stringify(data));
        render(data);
        document.getElementById('updatedAt').textContent =
          '마지막 업데이트: ' + new Date().toLocaleTimeString('ko-KR');
      })
      .catch(err => {
        console.error(err);
        if (!cached) {
          document.getElementById('container').innerHTML =
            '<div class="empty-state">데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도합니다.</div>';
        }
        document.getElementById('updatedAt').textContent = '업데이트 실패';
      });
  }

  loadData();
  setInterval(loadData, 10000);
</script>

</body>
</html>
