<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: #111;
  }

  header {
    text-align: center;
    padding: 20px 16px 14px;
    border-bottom: 1px solid #eee;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  header p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #777;
  }

  .container {
    padding: 12px;
  }

  .category {
    border: 1px solid #e2e2e2;
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }

  .category-toggle {
    width: 100%;
    background: #fff;
    border: none;
    padding: 13px 14px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }

  .category-toggle .arrow {
    font-size: 12px;
    color: #999;
    transition: transform 0.2s ease;
  }

  .category.open .category-toggle .arrow {
    transform: rotate(180deg);
  }

  .branch-grid {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 12px 12px;
    border-top: 1px solid #eee;
    padding-top: 12px;
  }

  .category.open .branch-grid {
    display: grid;
  }

  @media (max-width: 360px) {
    .branch-grid { grid-template-columns: 1fr; }
  }

  .branch-card {
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px;
  }

  .branch-name {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .branch-person {
    font-size: 13px;
    color: #444;
    margin-bottom: 4px;
  }

  .branch-location {
    font-size: 12px;
    color: #777;
    margin-bottom: 8px;
  }

  .branch-phone {
    display: block;
    text-align: center;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    color: #111;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 7px 0;
  }

  .empty-state {
    text-align: center;
    color: #999;
    font-size: 13px;
    padding: 40px 10px;
  }

  .updated-at {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    padding: 10px 0 20px;
  }
</style>
</head>
<body>

<header>
  <h1>티에이오토 대리점 안내</h1>
  <p>전화번호를 누르시면 바로 연결됩니다.</p>
</header>

<div class="container" id="container">
  <div class="empty-state">불러오는 중...</div>
</div>

<div class="updated-at" id="updatedAt"></div>

<script>
  const CATEGORY_ORDER = ['서울', '인천', '경기북부', '경기 남/동부', '강원'];
  let openCategories = new Set();

  function render(data) {
    const container = document.getElementById('container');

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty-state">등록된 지점 정보가 없습니다.</div>';
      return;
    }

    const grouped = {};
    data.forEach(item => {
      if (!grouped[item.category]) grouped[item.category] = [];
      grouped[item.category].push(item);
    });

    const categories = [...CATEGORY_ORDER.filter(c => grouped[c]),
                         ...Object.keys(grouped).filter(c => !CATEGORY_ORDER.includes(c))];

    let html = '';
    categories.forEach(cat => {
      const isOpen = openCategories.has(cat);
      const branches = grouped[cat];

      html += `<div class="category ${isOpen ? 'open' : ''}" data-category="${cat}">`;
      html += `<button class="category-toggle" onclick="toggleCategory('${cat}')">${cat} <span class="arrow">▼</span></button>`;
      html += `<div class="branch-grid">`;

      branches.forEach(b => {
        const tel = b.phone.replace(/[^0-9]/g, '');
        html += `
          <div class="branch-card">
            <div class="branch-name">${b.branch}</div>
            <div class="branch-person">${b.name}</div>
            <div class="branch-location">${b.location}</div>
            <a class="branch-phone" href="tel:${tel}">${b.phone}</a>
          </div>`;
      });

      html += `</div></div>`;
    });

    container.innerHTML = html;
  }

  function toggleCategory(cat) {
    if (openCategories.has(cat)) {
      openCategories.delete(cat);
    } else {
      openCategories.add(cat);
    }
    const el = document.querySelector(`.category[data-category="${cat}"]`);
    if (el) el.classList.toggle('open');
  }

  function loadData() {
    google.script.run
      .withSuccessHandler(function(data) {
        render(data);
        document.getElementById('updatedAt').textContent =
          '마지막 업데이트: ' + new Date().toLocaleTimeString('ko-KR');
      })
      .withFailureHandler(function(err) {
        console.error(err);
      })
      .getBranchData();
  }

  loadData();
  setInterval(loadData, 10000);
</script>

</body>
</html>
