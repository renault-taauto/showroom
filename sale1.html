<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>용품 시책 신청</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-soft: #eff6ff;
      --line: #dbeafe;
      --text: #111827;
      --muted: #6b7280;
      --danger: #dc2626;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 40px 20px 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .sub {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      height: 46px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 13px;
      color: var(--text);
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    input[disabled] {
      background: #f8fafc;
      color: #94a3b8;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--blue-dark);
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .panel {
      display: none;
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .summary {
      padding: 15px;
      background: var(--blue-soft);
      border-bottom: 1px solid var(--line);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 5px 0;
      font-size: 14px;
    }

    .summary-row span:first-child {
      color: var(--muted);
    }

    .summary-row span:last-child {
      text-align: right;
      font-weight: 800;
    }

    .form-body {
      padding: 16px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }

    .item-grid label {
      margin-bottom: 0;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin: 8px 0 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      font-size: 14px;
      font-weight: 800;
    }

    .message {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.45;
    }

    .done {
      color: var(--blue-dark);
    }

    .note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>용품 시책 신청</h1>
    <p class="sub">영업담당 이름을 입력한 뒤 배정된 수량 안에서 신청 수량을 작성해주세요.</p>

    <div class="field">
      <label for="salesName">영업담당</label>
      <input id="salesName" type="text" autocomplete="name" placeholder="이름 입력">
    </div>
    <button id="checkButton" type="button">확인</button>
    <p id="lookupMessage" class="message"></p>

    <section id="surveyPanel" class="panel">
      <div class="summary">
        <div class="summary-row"><span>시책월</span><span id="monthText"></span></div>
        <div class="summary-row"><span>거점</span><span id="branchText"></span></div>
        <div class="summary-row"><span>기간</span><span id="periodText"></span></div>
        <div class="summary-row"><span>선택 가능</span><span id="limitText"></span></div>
      </div>

      <div class="form-body">
        <div class="item-grid">
          <label for="costcoCount">코스트코 회원권</label>
          <input id="costcoCount" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="item-grid">
          <label for="ownersCount">오너스패키지</label>
          <input id="ownersCount" type="number" min="0" step="1" value="0" inputmode="numeric">
        </div>
        <div class="total">
          <span>선택 합계</span>
          <span><span id="totalText">0</span> / <span id="limitTotalText">0</span>개</span>
        </div>
        <button id="submitButton" type="button">제출</button>
        <p id="submitMessage" class="message"></p>
      </div>
    </section>

    <p class="note">수정이 필요하면 sky13@teianmotors.com으로 연락 주세요.</p>
  </main>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxmPObC8ucI-weusv5bcjgmAHzbY6gM9YpLKPdFzQpAh0SmJsXKyCjttGIkN4o93ZtPng/exec';
    const state = {
      config: null,
      selectedRep: null
    };

    const els = {
      salesName: document.getElementById('salesName'),
      checkButton: document.getElementById('checkButton'),
      lookupMessage: document.getElementById('lookupMessage'),
      surveyPanel: document.getElementById('surveyPanel'),
      monthText: document.getElementById('monthText'),
      branchText: document.getElementById('branchText'),
      periodText: document.getElementById('periodText'),
      limitText: document.getElementById('limitText'),
      costcoCount: document.getElementById('costcoCount'),
      ownersCount: document.getElementById('ownersCount'),
      totalText: document.getElementById('totalText'),
      limitTotalText: document.getElementById('limitTotalText'),
      submitButton: document.getElementById('submitButton'),
      submitMessage: document.getElementById('submitMessage')
    };

    function jsonp(params) {
      return new Promise((resolve, reject) => {
        const callbackName = 'surveyCallback_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        const query = new URLSearchParams({ ...params, callback: callbackName });

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          cleanup();
          reject(new Error('서버에 연결할 수 없습니다.'));
        };

        function cleanup() {
          delete window[callbackName];
          script.remove();
        }

        script.src = WEB_APP_URL + '?' + query.toString();
        document.body.appendChild(script);
      });
    }

    async function loadConfig() {
      els.checkButton.disabled = true;
      els.checkButton.textContent = '불러오는 중';
      try {
        const data = await jsonp({ action: 'getConfig' });
        if (!data.ok) throw new Error(data.message || '설정을 불러오지 못했습니다.');
        state.config = data;
        els.checkButton.disabled = false;
        els.checkButton.textContent = '확인';
      } catch (err) {
        state.config = null;
        els.lookupMessage.textContent = err.message;
        els.checkButton.disabled = false;
        els.checkButton.textContent = '확인';
      }
    }

    async function handleLookup() {
      clearMessages();
      const name = els.salesName.value.trim();
      if (!state.config) {
        els.lookupMessage.textContent = '설정을 아직 불러오지 못했습니다. 잠시 후 다시 확인해주세요.';
        loadConfig();
        return;
      }
      if (!name) {
        alert('영업담당 이름을 입력해주세요.');
        return;
      }

      els.checkButton.disabled = true;
      els.checkButton.textContent = '확인 중';
      hideSurvey();

      try {
        const data = await jsonp({
          action: 'lookupRep',
          salesName: name,
          month: state.config.defaultMonth
        });
        if (!data.ok) throw new Error(data.message || '조회에 실패했습니다.');
        if (!data.found) {
          alert('해당사항이 없습니다.');
          return;
        }
        if (data.alreadySubmitted) {
          alert('이미 제출되었습니다. 수정이 필요하면 sky13@teianmotors.com으로 연락 주세요.');
          return;
        }

        state.config.defaultMonth = data.defaultMonth || state.config.defaultMonth;
        state.selectedRep = data.rep;
        showSurvey(data.rep);
      } catch (err) {
        els.lookupMessage.textContent = err.message;
      } finally {
        els.checkButton.disabled = false;
        els.checkButton.textContent = '확인';
      }
    }

    function showSurvey(rep) {
      els.monthText.textContent = state.config.defaultMonth || '-';
      els.branchText.textContent = rep.branch;
      els.periodText.textContent = rep.periodDetail || '-';
      els.limitText.textContent = rep.limit + '개';
      els.limitTotalText.textContent = rep.limit;
      els.costcoCount.value = '0';
      els.ownersCount.value = '0';
      els.submitButton.disabled = false;
      els.submitButton.textContent = '제출';
      els.surveyPanel.style.display = 'block';
      updateTotal();
    }

    function hideSurvey() {
      state.selectedRep = null;
      els.surveyPanel.style.display = 'none';
    }

    function getCount(input) {
      const value = Number(input.value || 0);
      if (!Number.isInteger(value) || value < 0) return 0;
      return value;
    }

    function updateTotal(changedInput) {
      const limit = state.selectedRep ? Number(state.selectedRep.limit) : 0;
      let costco = getCount(els.costcoCount);
      let owners = getCount(els.ownersCount);
      let total = costco + owners;

      if (total > limit && changedInput) {
        const other = changedInput === els.costcoCount ? owners : costco;
        changedInput.value = Math.max(0, limit - other);
        costco = getCount(els.costcoCount);
        owners = getCount(els.ownersCount);
        total = costco + owners;
      }

      els.totalText.textContent = total;
      els.submitMessage.textContent = total > limit ? '선택 가능 개수를 초과할 수 없습니다.' : '';
    }

    async function submitSurvey() {
      clearMessages();
      if (!state.selectedRep) return;

      const costco = getCount(els.costcoCount);
      const owners = getCount(els.ownersCount);
      const total = costco + owners;

      if (total <= 0) {
        els.submitMessage.textContent = '최소 1개 이상 입력해주세요.';
        return;
      }
      if (total > state.selectedRep.limit) {
        els.submitMessage.textContent = '선택 가능 개수를 초과할 수 없습니다.';
        return;
      }

      const payload = {
        month: state.config.defaultMonth,
        salesName: state.selectedRep.salesName,
        selections: {
          '코스트코 회원권': costco,
          '오너스패키지': owners
        }
      };

      els.submitButton.disabled = true;
      els.submitButton.textContent = '제출 중';

      try {
        const data = await jsonp({
          action: 'submit',
          payload: JSON.stringify(payload)
        });
        if (!data.ok) throw new Error(data.message || '제출에 실패했습니다.');

        els.salesName.disabled = true;
        els.costcoCount.disabled = true;
        els.ownersCount.disabled = true;
        els.submitButton.textContent = '제출 완료';
        els.submitMessage.className = 'message done';
        els.submitMessage.textContent = '제출되었습니다.';
      } catch (err) {
        els.submitButton.disabled = false;
        els.submitButton.textContent = '제출';
        els.submitMessage.className = 'message';
        els.submitMessage.textContent = err.message;
      }
    }

    function clearMessages() {
      els.lookupMessage.textContent = '';
      els.submitMessage.className = 'message';
      els.submitMessage.textContent = '';
    }

    els.checkButton.addEventListener('click', handleLookup);
    els.salesName.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') handleLookup();
    });
    els.costcoCount.addEventListener('input', () => updateTotal(els.costcoCount));
    els.ownersCount.addEventListener('input', () => updateTotal(els.ownersCount));
    els.submitButton.addEventListener('click', submitSurvey);

    loadConfig();
  </script>
</body>
</html>
