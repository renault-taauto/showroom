<!DOCTYPE html>

<head>

<title>전화 연결</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  a.call-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    background: #FFCC00;
    color: #0A0A0A;
    font-size: 18px;
    font-weight: 700;
    padding: 16px 32px;
    border-radius: 50px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  a.call-button:active {
    transform: scale(0.96);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  a.call-button svg {
    width: 20px;
    height: 20px;
  }
</style>
</head>
