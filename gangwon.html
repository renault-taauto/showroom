    (function () {
      var TRACKING_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyYaRfn8stk6f6XBgeVCc3rQfgCpyhgm6OZPOCUxnzRIcok8x29a29BRgK2EL86k77fxA/exec';

      var sessionKey = 'renaultGangwonSessionId';
      var sessionId = sessionStorage.getItem(sessionKey);

      if (!sessionId) {
        sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2);
        sessionStorage.setItem(sessionKey, sessionId);
      }

      function sendTrafficEvent(eventName, branch, href) {
        var payload = JSON.stringify({
          event: eventName,
          branch: branch || '',
          page: location.href,
          href: href || '',
          referrer: document.referrer,
          userAgent: navigator.userAgent,
          sessionId: sessionId

          navigator.sendBeacon(TRACKING_ENDPOINT, payload);

        fetch(TRACKING_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          keepalive: true,
          body: payload
        });
